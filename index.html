/* ── hoja: añadir ── */
/* de qué va un resultado: puede llegar con nombres (demo, o si el servidor los
   manda) o con los ids de TMDB */
function genAdd(r, sel){
  const nombres = (r.genres || []).map((g) => norm(g));
  const ids = r.genreIds || [];
  return sel.some((label) => {
    const g = GEN_ADD.find((x) => x[0] === label);
    if (!g) return false;
    return g[2].some((n) => nombres.indexOf(norm(n)) >= 0) || g[1].some((id) => ids.indexOf(id) >= 0);
  });
}
function addFiltrados(){
  const f = S.afRun, res = S.addResults || [];
  let out = res.filter((r) => {
    if (f.type && r.type !== f.type) return false;
    if (f.rateMin && !(r.score >= f.rateMin)) return false;
    if (f.dec){
      const y = r.year || 0;
      if (f.dec === 'old' ? y >= 1990 : (f.dec === '2020' ? y < 2020 : (y < +f.dec || y > +f.dec + 9))) return false;
    }
    const sabeGen = (r.genres && r.genres.length) || (r.genreIds && r.genreIds.length);
    if (f.genres.length && sabeGen && !genAdd(r, f.genres)) return false;
    if (f.provs.length && (r.providers || []).length && !r.providers.some((p) => f.provs.indexOf(p.name) >= 0)) return false;
    if (f.hideHave && S.data.items.some((i) => i.tmdbId === r.tmdbId)) return false;
    return true;
  });
  if (f.sort === 'score') out = out.slice().sort((a, b) => (b.score || 0) - (a.score || 0));
  if (f.sort === 'new') out = out.slice().sort((a, b) => (b.year || 0) - (a.year || 0));
  return out;
}
const PAG = 12;        /* cuántos resultados se pintan de golpe */
const PAG_API = 20;    /* lo que devuelve una página de TMDB */
const nAf = (f) => (f.type ? 1 : 0) + (f.rateMin ? 1 : 0) + (f.dec ? 1 : 0) + f.genres.length + f.provs.length
  + (f.hideHave ? 1 : 0) + (f.sort !== 'rel' ? 1 : 0);

  /* qué es siempre a la vista: es el filtro que se toca en todas las búsquedas */

    return '<button style="flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;'
      + 'color:' + (on ? 'var(--wish)' : 'var(--text-dim)') + (on ? ';box-shadow:inset 0 -2.5px 0 -0.5px var(--wish)' : '')
      + '" data-a="af.t:' + k + '" aria-pressed="' + on + '">'

/* ── hoja: buscar y filtrar ── */
function filtersHtml(){

    + (gens.length ? '<div style="margin-top:14px;padding-top:12px;box-shadow:inset 0 1px 0 #ffffff14">'
        + '<div style="display:flex;align-items:baseline;gap:8px"><span class="lbl-u">de qué va</span>'

/* «Nuria», «Nuria y Bruno», «Nuria, Bruno y Ana» */
function listaY(ns){
  const l = ns.map(esc);
  if (l.length < 2) return l[0] || '';
  return l.slice(0, -1).join(', ') + ' y ' + l[l.length - 1];
}

function candidates(){
  const r = S.roul || { users:[], provs:[], kind:'both' };
  return S.data.items.map((it) => {
    let w = 0;
    r.users.forEach((u) => { const p = it.participants[u]; if (p && p.status === 'wish') w += p.hype; });
    if (!w) return null;
    if (r.kind !== 'both' && it.type !== r.kind) return null;
    if (r.time && (it.runtime || 0) > r.time) return null;
    if (r.provs.length && !it.providers.some((p) => r.provs.includes(p.name))) return null;
    return { item:it, w:w };
  }).filter(Boolean);
}

/* ── hoja: estadísticas ── */
function statsHtml(){
  const d = S.data, me = meId(), mineOnly = S.statScope === 'me', year = S.statYear;
  const rows = [];
  d.items.forEach((it) => Object.keys(it.participants).forEach((u) => {
    if (mineOnly && u !== me) return;
    const p = it.participants[u];
    const y = p.finishedAt ? new Date(p.finishedAt).getFullYear() : null;
    if (year !== 'all' && String(y) !== year) return;
    rows.push({ item:it, u:u, p:p });
  }));
  const done = rows.filter((r) => r.p.status === 'done');
  const series = done.filter((r) => r.item.type === 'tv').length;
  const movies = done.filter((r) => r.item.type === 'movie').length;
  const mins = rows.reduce((a, r) => {
    const it = r.item;
    if (it.type === 'movie') return a + (r.p.status === 'done' ? it.runtime : 0);
    const eps = r.p.status === 'done' ? (it.totalEpisodes || 0) : absEp(it, r.p.progress);
    return a + eps * it.runtime;
  }, 0);
  const hours = Math.round(mins / 60);
  const human = hours > 48 ? nfmt(hours / 24) + ' días seguidos de televisión' : nfmt(hours / 3.5) + ' tardes de sofá enteras';
  const rated = rows.filter((r) => r.p.rating);
  const avg = rated.length ? rated.reduce((a, r) => a + r.p.rating, 0) / rated.length : 0;
  const best = rated.slice().sort((a, b) => b.p.rating - a.p.rating)[0];
  const worst = rated.slice().sort((a, b) => a.p.rating - b.p.rating)[0];
  const dropped = rows.filter((r) => r.p.status === 'dropped');
  const dropEp = dropped.filter((r) => r.p.progress).map((r) => absEp(r.item, r.p.progress));
  const genres = {}; done.forEach((r) => r.item.genres.forEach((g) => { genres[g] = (genres[g] || 0) + 1; }));
  const gTop = Object.keys(genres).map((g) => [g, genres[g]]).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const gMax = gTop.length ? gTop[0][1] : 1;
  const props = {}; d.items.forEach((i) => { props[i.addedBy] = (props[i.addedBy] || 0) + 1; });
  const pTop = Object.keys(props).map((u) => [u, props[u]]).sort((a, b) => b[1] - a[1]);
  const pMax = pTop.length ? pTop[0][1] : 1;
  const hit = Object.keys(props).map((u) => {
    const rr = [];
    d.items.filter((i) => i.addedBy === u).forEach((i) => Object.keys(i.participants).forEach((k) => { const p = i.participants[k]; if (p.rating) rr.push(p.rating); }));
    return { u:u, n: rr.length ? rr.reduce((a, b) => a + b, 0) / rr.length : 0 };
  }).filter((x) => x.n).sort((a, b) => b.n - a.n);
  const pairs = [];
  d.users.forEach((a, i) => d.users.slice(i + 1).forEach((b) => {
    const diffs = [];
    d.items.forEach((it) => { const pa = it.participants[a.id], pb = it.participants[b.id];
      if (pa && pb && pa.rating && pb.rating) diffs.push(Math.abs(pa.rating - pb.rating)); });
    if (diffs.length) pairs.push({ a:a, b:b, n: diffs.reduce((x, y) => x + y, 0) / diffs.length });
  }));
  pairs.sort((x, y) => x.n - y.n);
  const years = ['all'].concat([].concat.apply([], d.items.map((i) => Object.keys(i.participants).map((k) => i.participants[k].finishedAt && new Date(i.participants[k].finishedAt).getFullYear())))
    .filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => b - a).map(String));
  const total = series + movies || 1;
  const ringA = Math.round((series / total) * 100);

  /* ── cifras para presumir ──────────────────────────────────────────────────
     Todo sale de lo que ya hay guardado; ninguna pide nada a nadie. La gracia
     no es el número, es la frase que lo pone en escala humana. */
  const dur = (it) => it.type === 'movie' ? (it.runtime || 0) : (it.totalEpisodes || 0) * (it.runtime || 0);
  const equis = hours >= 4 ? 'o ' + Math.round(hours / 1.9) + ' películas seguidas, uña y carne con el sofá'
    : hours >= 1 ? 'o una tarde larga de domingo' : (mineOnly ? 'aún estás calentando' : 'aún estáis calentando');
  /* lo que queda por ver, sin contar dos veces un título que quieren varios */
  const pend = {};

  const pendH = Math.round(Object.keys(pend).reduce((a, k) => a + pend[k], 0) / 60);

  const bronca = debates[0], acuerdo = debates.filter((x) => x.sp === 0)[0];

/* abrir/cerrar una sección de ajustes midiendo su contenido */
function plegar(k){
  const abrir = !(S.sopen && S.sopen[k]);
  S.sopen = Object.assign({}, S.sopen); S.sopen[k] = abrir;
  const wrap = document.querySelector('[data-fold="' + k + '"]');
  const btn = document.querySelector('[data-a="sopen:' + k + '"]');
  if (!wrap){ render(); return; }
  const alto = wrap.scrollHeight;
  wrap.style.maxHeight = (abrir ? 0 : alto) + 'px';
  wrap.style.opacity = abrir ? '0' : '1';
  void wrap.offsetHeight;                      /* fuerza el punto de partida */
  wrap.style.maxHeight = (abrir ? alto : 0) + 'px';
  wrap.style.opacity = abrir ? '1' : '0';
  if (btn){
    btn.setAttribute('aria-expanded', String(abrir));
    const sv = btn.querySelector('svg'); if (sv) sv.style.transform = 'rotate(' + (abrir ? 180 : 0) + 'deg)';
    const res = btn.querySelector('[data-res]'); if (res) res.style.display = abrir ? 'none' : 'block';
  }
  clearTimeout(wrap._plegar);
  /* al acabar se suelta el tope: si el contenido crece (otro club, más gente)
     no queda cortado a la altura de hace un rato */
  wrap._plegar = setTimeout(() => { if (abrir) wrap.style.maxHeight = 'none'; }, 340);
}

/* ── instalar la app ───────────────────────────────────────────────────────
   Chrome hace años que no ofrece instalar por su cuenta: guarda el ofrecimiento
   en un menú que nadie abre. Así que se lo pedimos nosotros. El navegador nos
   avisa con `beforeinstallprompt` de que la considera instalable, y ese aviso se
   guarda para poder sacarlo cuando la persona toque el botón — hay que gastarlo
   dentro del gesto, no vale enseñarlo por nuestra cuenta.

   Safari no manda ese aviso y nunca lo hará: en iPhone se instala a mano desde
   «Compartir», así que lo que toca es contarlo, no esconder el botón.          */
let promptInstalar = null;
const yaInstalada = () => {
  try { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
  catch(e){ return false; }
};
const esApple = () => /iphone|ipad|ipod/i.test(navigator.userAgent || '');

function instalarHtml(){
  if (yaInstalada()){
    return '<div class="xclub" style="margin-top:11px">🛋️<div>ya la tienes instalada. Por eso no ves las barras del navegador.</div></div>';
  }
  if (promptInstalar){
    return '<button class="pill" style="margin-top:11px;width:100%;justify-content:center;color:var(--done)" data-a="p.instalar">'
      + '⬇️ instalar como app</button>'
      + '<div style="font-size:11.5px;color:var(--text-dim);font-weight:600;margin-top:8px" class="pretty">'
      + 'queda un icono en la pantalla de inicio y se abre sin las barras del navegador.</div>';
  }
  if (esApple()){
    return '<div class="xclub" style="margin-top:11px">📲<div>para tenerla como app: toca <b style="color:var(--text)">Compartir</b> '
      + 'y luego <b style="color:var(--text)">Añadir a pantalla de inicio</b>. Se abrirá sin las barras de Safari.</div></div>';
  }
  return '<div style="font-size:11.5px;color:var(--text-dim);font-weight:600;margin-top:11px" class="pretty">'
    + 'para tenerla como app, busca <b style="color:var(--text-dim)">instalar</b> o '
    + '<b style="color:var(--text-dim)">añadir a pantalla de inicio</b> en el menú del navegador.</div>';
}

   la copia local de cada tablero. Ni una petición, y el servidor sigue sin
   saber que las personas de un club y otro son la misma.                     */
function clubsHtml(){
  const gs = Api.grupos ? Api.grupos() : [];
  const rec = Api.perfilDelDispositivo ? Api.perfilDelDispositivo() : null;
  return '<div class="stitle">tus clubes</div>'
    + '<div class="ssub">cada uno es un tablero aparte, con su gente, sus títulos y sus notas. Lo que hagas en uno no se ve en el otro.</div>'
    + '<div style="display:flex;flex-direction:column;gap:9px;margin-top:15px">'
    + gs.map((g) => {
        const st = Api.estadoDeClub(g.group);
        const c = g.activo ? 'var(--watching)' : 'var(--wish)';
        const gente = st ? st.users : [];
        const cuantos = (k) => (st && st.me) ? st.items.filter((i) => i.participants[st.me] && i.participants[st.me].status === k).length : 0;
        const trozos = [];
        if (st){
          const v = cuantos('watching'), w = cuantos('wish');

/* ── pintado por zonas ────────────────────────────────────────────────────────
   Esto era un innerHTML del documento entero en cada cambio de estado, y hacía
   dos cosas malas: reproducía la animación de entrada de todas las tarjetas —que
   nacen con opacity 0, o sea un parpadeo en toda regla— y tiraba el foco y el
   scroll. Ahora cada zona recuerda el HTML que pintó y sólo toca el DOM si ha
   cambiado de verdad. Quieto en la pantalla, el repaso de cada minuto ya no
   mueve un solo nodo.                                                          */
const ZONAS = ['rhead', 'rmain', 'rnav', 'rfloat', 'rsheet'];
const pintado = {};
let vistas = {};          /* tarjetas que ya estaban en el repintado anterior */
let hojaPintada = null;   /* qué hoja había abierta, para animarla sólo al abrir */

function zonas(){
  if (!S.data) return { rhead:headerHtml(), rmain:bootHtml(), rnav:'', rfloat:'', rsheet:'' };
  /* Con una invitación en la mano SIEMPRE hay que preguntar quién eres, aunque
     ya estés dentro de otro club: si no, entrar en un segundo club desde un
     móvil que ya tiene uno es imposible y la invitación se pierde en silencio.
     Las redundantes ya las ha descartado el Api antes de llegar aquí.          */
  const needsWelcome = (Api.hayInvitacion && Api.hayInvitacion())
    || !S.data.me || !S.data.users.some((u) => u.id === S.data.me);
  if (needsWelcome && (!S.sheet || S.sheet.kind !== 'welcome')){ S.sheet = { kind:'welcome' }; S.pila = []; }
  if (needsWelcome && !S.prof){
    const rec = Api.perfilDelDispositivo ? Api.perfilDelDispositivo() : null;
    S.prof = rec ? { name:rec.name, emoji:rec.emoji, color:rec.color } : { name:'', emoji:'🐻', color:PALETTE[0] };
    S.profRec = !!rec;
  }
  return {
    rhead: headerHtml(),
    rmain: (Api.authFailed() ? '<div class="banner" style="color:var(--bad);background:color-mix(in oklab,#FF6B8A 14%,var(--surface))">tu clave ya no vale: puede que te hayan sacado del club o que se haya generado otra. Pide un enlace nuevo.</div>' : '')
      + (S.booting ? bootHtml() : (S.isMobile && S.view !== 'board' ? secHtml() : boardHtml())),
    rnav: navHtml()
      + '<button class="fab desk" data-a="add"><span style="font-size:26px;line-height:1;margin-top:-2px">+</span> Añadir un título</button>',
    rfloat: floatHtml(),
    rsheet: sheetHtml(),
  };
}
/* scroll infinito de «añadir»: un único observador que se reengancha al
   centinela cada vez que se repinta la lista. rootMargin generoso para que la
   página siguiente llegue antes de que se vea el final. */
let obsFin = null, finVisto = null;
function sincronizarInfinito(){
  const el = document.getElementById('addfin');
  if (!el){ if (obsFin) obsFin.disconnect(); finVisto = null; return; }
  if (el === finVisto) return;
  if (!obsFin){
    obsFin = new IntersectionObserver((entradas) => {
      if (entradas.some((e) => e.isIntersecting)) verMas();
    }, { rootMargin:'500px 0px' });
  }
  obsFin.disconnect();
  finVisto = el;
  obsFin.observe(el);
}
let rafPending = false;
function render(){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    document.documentElement.setAttribute('data-theme', S.theme);
    /* de qué color va la pantalla: dentro del tablero manda la columna; en las
       demás secciones, el color de su botón en la barra de abajo */
    const secc = { roulette:'wish', add:'watching', stats:'done', settings:'dropped' };
    const clave = (S.isMobile && secc[S.view]) ? secc[S.view] : S.tab;
    document.documentElement.setAttribute('data-col', clave);
    document.documentElement.style.setProperty('--colc', COL(clave).v);
    fxSync();
    const z = zonas();
    const act = document.activeElement;
    const fid = act && act.id ? act.id : null;
    const ss = fid ? act.selectionStart : null, se = fid ? act.selectionEnd : null;
    const scr = document.querySelector('[data-sheet] .scroll');
    const scrTop = scr ? scr.scrollTop : 0;

    let algo = false;
    for (const id of ZONAS){
      if (pintado[id] === z[id]) continue;          /* esta zona no ha cambiado */
      pintado[id] = z[id];
      document.getElementById(id).innerHTML = z[id];
      algo = true;
    }
    if (!algo) return;

    const kind = S.sheet ? S.sheet.kind : null;
    if (kind && kind !== hojaPintada){
      /* recién abierta: que se deslice. La clase va aquí y no en el HTML para
         que no forme parte de lo que se compara arriba */
      const ov = document.querySelector('.ov'), sh = document.querySelector('[data-sheet]');
      if (ov) ov.classList.add('anim');
      if (sh) sh.classList.add('anim');
    } else if (kind && scrTop){
      /* seguía abierta: no la mandes otra vez al principio */
      const el = document.querySelector('[data-sheet] .scroll');
      if (el) el.scrollTop = scrTop;
    }
    hojaPintada = kind;

    vistas = {};
    document.querySelectorAll('[data-card]').forEach((e) => { vistas[e.dataset.card] = 1; });
    sincronizarInfinito();

    if (fid){
      const el = document.getElementById(fid);
      if (el && el !== document.activeElement){
        el.focus({ preventScroll:true });
        try { if (ss != null) el.setSelectionRange(ss, se); } catch(e){}
      }
    }
  });
}

/* ── acciones ── */
/* ── navegación entre hojas ───────────────────────────────────────────────────
   Cada hoja abierta empuja una entrada en el historial, así que el botón atrás
   del móvil cierra la hoja en vez de sacarte de la aplicación. Quien manda sobre
   cuántas hay abiertas es el historial: al volver, «popstate» dice a qué
   profundidad hay que quedarse y la pila se recorta hasta ahí. Por eso cerrar
   nunca toca el estado a mano — pide un paso atrás y deja que llegue.          */
function abrirHoja(sheet, extra, apilar){
  if (apilar && S.sheet) S.pila.push(S.sheet);
  else S.pila = [];
  const prof = S.pila.length + 1;
  /* cambiar de hoja sin apilar REEMPLAZA la entrada, no añade otra. Si no,
     abrir dos detalles seguidos dejaba dos entradas a la misma profundidad y
     el aspa se comía un paso atrás sin cerrar nada: parecía que no respondía. */
  if (!apilar && S.sheet) history.replaceState({ sc: prof, scv: S.view }, '');
  else history.pushState({ sc: prof, scv: S.view }, '');
  setS(Object.assign({ sheet:sheet }, extra || {}));
}
const profundidad = () => S.pila.length + (S.sheet ? 1 : 0);
const closeSheet = () => {
  const n = profundidad();
  if (n <= 0){ setS({ sheet:null, pila:[], confirmAsk:null }); return; }
  history.go(-n);
  /* red de seguridad: si el historial no contesta (un iframe, una app metida en
     otra), la hoja se cierra igual. Cerrar nunca debe quedarse a medias. */
  setTimeout(() => {
    if (!S.sheet) return;
    setS({ sheet:null, pila:[], confirmAsk:null });
    try { history.replaceState({ sc:0, scv:S.view }, ''); } catch(err){}
  }, 320);
};
/* recorta la pila hasta la profundidad que pide el historial. Aparte porque es
   lo único de todo esto que se puede probar sin navegador. */
function recortarPila(sheet, pila, objetivo){
  let prof = pila.length + (sheet ? 1 : 0);
  while (prof > objetivo){ sheet = pila.pop() || null; prof--; }
  return { sheet:sheet, pila:pila };
}
window.addEventListener('popstate', (e) => {
  const objetivo = (e.state && e.state.sc) || 0;
  const vista = (e.state && e.state.scv) || 'board';
  if (vista !== S.view) S.view = vista;
  if (profundidad() <= objetivo){ render(); return; }
  const r = recortarPila(S.sheet, S.pila, objetivo);
  S.sheet = r.sheet; S.pila = r.pila;
  setS({ confirmAsk:(S.sheet && S.sheet.kind === 'confirm') ? S.confirmAsk : null });
});

/* En el móvil, ruleta, añadir, datos y ajustes dejan de ser ventanas flotantes
   y pasan a ser secciones de pleno derecho: la barra de abajo cambia de
   pantalla, no abre un cajón encima. En escritorio siguen siendo hojas, que
   ahí el tablero se ve entero y no hay barra inferior. */
function irA(v, extra){
  const era = S.view;
  const p = Object.assign({ view:v, sheet:null, pila:[] }, extra || {});
  if (era !== v) history.pushState({ sc:0, scv:v }, '');
  setS(p);
  window.scrollTo(0, 0);
}

function move(key, to, rect){
  const k = parseKey(key), it = findItem(k.itemId); if (!it) return;
  const users = groupUsers(it, k.status, k.order);
  if (to === 'done' && rect) rain(rect);
  flash([k.itemId + '|' + to], 'land');
  call(() => Api.setStatus(k.itemId, users, to), it.title + ' → ' + COL(to).label);
  if (S.isMobile && S.tab !== to) setS({ tab:to });
}
function shift(key, dir, rect){
  const flow = ['wish','watching','done'];
  const st = parseKey(key).status;
  const i = flow.indexOf(st);
  if (i < 0){ move(key, dir > 0 ? 'watching' : 'wish', rect); return; }
  const j = clamp(i + dir, 0, flow.length - 1);
  if (j === i){ toast(dir > 0 ? 'ya está en Terminado 🎉' : 'no hay nada antes de Nos apetece'); return; }
  move(key, flow[j], rect);
}
function bumpProgress(itemId, users, dir, rect){
  const it = findItem(itemId); if (!it) return;
  const p = it.participants[users[0]]; if (!p) return;
  const next = step(it, p.progress, dir);
  if (next === 'end'){
    if (rect) rain(rect);
    call(() => Api.setStatus(itemId, users, 'done'), it.title + ' terminada');
    toast('¡' + it.title + ' terminada! ✨ ponedle nota cuando queráis');
    return;
  }
  call(() => Api.setProgress(itemId, users, next));
}

let searchDeb = null, searchAC = null;
/* el botón de abajo: si hay título busca por título, y si no, pide al catálogo
   todo lo que cumpla los filtros */
/* «ver más»: mientras haya resultados cargados sin pintar, sólo crece la lista
   (no cuesta nada); cuando se agotan, pide la página siguiente al catálogo y
   añade lo que no estuviera ya. */
function verMas(){
  if (S.view !== 'add' && !(S.sheet && S.sheet.kind === 'add')) return;
  if (S.addSearching || S.addLoadingMore) return;
  const vis = addFiltrados();
  if (S.addShown < vis.length){ setS({ addShown:S.addShown + PAG }); return; }
  if (!S.addMore || S.addLoadingMore) return;
  const q = S.addQ.trim(), p = S.addPage + 1;
  setS({ addLoadingMore:true });
  (q ? Api.searchTitles(q, { page:p }) : Api.discoverTitles(S.afRun, { page:p }))
    .then((lote) => {
      const ya = (S.addResults || []).slice(), ids = ya.map((x) => x.tmdbId);
      const nuevos = (lote || []).filter((x) => ids.indexOf(x.tmdbId) < 0);
      setS({ addResults:ya.concat(nuevos), addPage:p, addLoadingMore:false,
        addShown:S.addShown + PAG,
        /* si la página no trae nada nuevo, el catálogo se ha acabado */
        addMore: nuevos.length > 0 && (lote || []).length >= PAG_API });
    })
    .catch((err) => { setS({ addLoadingMore:false, addMore:false });
      if (err && err.code === 'no-tmdb') toast('falta la clave de TMDB'); });
}
function lanzarBusqueda(){
  clearTimeout(searchDeb);
  if (searchAC) searchAC.abort();
  const q = S.addQ.trim(), f = Object.assign({}, S.af);
  setS({ addSearching:true, addPick:null, addDone:null, sinDiscover:false, afRun:f,
    addPage:1, addMore:false, addShown:PAG, addLoadingMore:false });
  searchAC = new AbortController();
  const opts = { signal:searchAC.signal, page:1 };
  (q ? Api.searchTitles(q, opts) : Api.discoverTitles(f, opts))
    .then((r) => setS({ addResults:r, addSearching:false, addMore:(r || []).length >= PAG_API }))
    .catch((err) => {
      if (err.name === 'AbortError') return;
      if (err.code === 'no-discover'){ setS({ addSearching:false, addResults:null, sinDiscover:true }); return; }
      setS({ addSearching:false, addResults:[] });
      if (err.code === 'no-tmdb') toast('falta la clave de TMDB');
    });
}

  }, 240);
}
let spinT = null;
function spin(){
  const cands = candidates();
  const r = Object.assign({}, S.roul);
  const pool = cands.length > 1 ? cands.filter((c) => c.item.id !== r.last) : cands;
  if (!pool.length){ setS({ roul:Object.assign(r, { spinning:false, result:null, nothing:true }) }); return; }
  let total = pool.reduce((a, c) => a + c.w, 0), pick = Math.random() * total, chosen = pool[0];
  for (const c of pool){ pick -= c.w; if (pick <= 0){ chosen = c; break; } }
  setS({ roul:Object.assign(r, { spinning:true, result:null, nothing:false, frame:Api.imageUrl(pool[0].item.poster, 'lg') }) });
  let i = 0;
  clearInterval(spinT);
  /* diez carátulas por segundo no son diez repintados del documento: se cambia
     la imagen del elemento y ya. La URL la valida imageUrl y la CSP sólo deja
     cargar de image.tmdb.org, así que no hay por dónde colar nada. */
  spinT = setInterval(() => {
    i++;
    const el = document.querySelector('[data-spin]');
    if (!el) return;
    const u = Api.imageUrl(pool[i % pool.length].item.poster, 'lg');
    el.style.backgroundImage = u ? 'url("' + u + '")' : '';
  }, 95);
  setTimeout(() => {
    clearInterval(spinT);
    setS({ roul:Object.assign({}, S.roul, { spinning:false, result:chosen.item.id, last:chosen.item.id, weight:chosen.w }) });
    buzz(14);
  }, 1750);
}
async function saveProfile(finish){
  const p = S.prof;
  if (!p || !p.name.trim()){ toast(finish ? 'ponte un nombre, aunque sea inventado' : 'ponle un nombre, aunque sea inventado'); return; }
  /* con una invitación en la mano, entrar significa canjearla: el Worker crea tu
     persona y te devuelve TU secreto, distinto del de todos los demás */
  if (finish && Api.hayInvitacion()){
    setS({ saveState:'saving' });
    try {
      await Api.unirse(p);
      closeSheet();
      toast('bienvenida/o al club, ' + p.name + ' ' + p.emoji);
    } catch(e){
      setS({ saveState:'idle' });
      toast(e.code === 'invitacion-invalida'
        ? 'esa invitación ya se usó o ha caducado, pide otra'
        : 'no he podido entrar, ¿probamos otra vez?', 'reintentar', () => saveProfile(true));
    }
    return;
  }
  setS({ saveState:'saving' });
  const r = await call(() => Api.updateProfile(p), 'perfil guardado');
  if (finish) closeSheet();
  if (r === null){ setS({ saveState:'idle' }); return; }
  if (!finish){ setS({ saveState:'done' }); setTimeout(() => setS({ saveState:'idle' }), 2000); }
  toast((finish ? 'bienvenida/o, ' : 'perfil guardado: ') + p.name + ' ' + p.emoji);
}
/* el resumen que se pega en el grupo: texto plano, sin enlaces ni datos de
   nadie más allá de lo que ya se ve en la pantalla */
function compartirDatos(){
  const d = S.data, me = meId(), mineOnly = S.statScope === 'me';
  const dur = (it) => it.type === 'movie' ? (it.runtime || 0) : (it.totalEpisodes || 0) * (it.runtime || 0);
  let mins = 0, hechas = 0, notas = [];
  d.items.forEach((it) => Object.keys(it.participants).forEach((u) => {
    if (mineOnly && u !== me) return;
    const p = it.participants[u];
    if (p.status === 'done'){ hechas++; mins += dur(it); }
    else if (p.status === 'watching' && it.type === 'tv') mins += absEp(it, p.progress) * (it.runtime || 0);
    if (p.rating) notas.push(p.rating);
  }));
  const horas = Math.round(mins / 60);
  const media = notas.length ? nfmt(notas.reduce((a, b) => a + b, 0) / notas.length) : '–';
  const txt = '🛋️ Sofa Club — ' + (mineOnly ? 'lo mío' : 'el grupo') + '\n'
    + horas + ' h de sofá · ' + hechas + ' títulos terminados · nota media ' + media + '/5\n'
    + (horas >= 24 ? 'son ' + nfmt(horas / 24) + ' días seguidos de televisión' : 'seguimos calentando');
  const ok = () => { toast('resumen copiado 💌 pégalo en el grupo'); };
  navigator.clipboard && navigator.clipboard.writeText(txt).then(ok).catch(() => toast(txt));
}
async function copyInvite(){
  const txt = S.invite;
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch(e){
    try {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); document.body.removeChild(ta);
    } catch(e2){ ok = false; }
  }
  if (ok){ setS({ copyState:'done' }); toast('enlace copiado al portapapeles 💌'); setTimeout(() => setS({ copyState:'idle' }), 2200); }
  else toast('cópialo a mano de ahí arriba, el navegador no me deja tocar el portapapeles');
}
/* ── eventos delegados ── */
let blockClick = 0;
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const raw = el.dataset.a;
  const i = raw.indexOf(':');
  const verb = i < 0 ? raw : raw.slice(0, i);
  const arg = i < 0 ? null : raw.slice(i + 1);

  /* «close» es el fondo oscuro y por eso ignora los toques de dentro; el botón
     de la esquina vive dentro de la hoja y necesita verbos propios */
  if (verb === 'cerrar'){ closeSheet(); return; }
  if (verb === 'atras'){ history.back(); return; }
  if (verb === 'close'){ if (e.target.closest('.sheet')) return; closeSheet(); return; }
  /* tras un gesto no se cuela un clic: ni en las tarjetas ni en el fondo de una
     hoja que se acaba de ir arrastrada */
  if (Date.now() - blockClick < 320 && (el.closest('[data-card]') || el.closest('.ov') || el.closest('.strip'))) return;
  e.stopPropagation();

  const cardEl = el.closest('[data-card]');
  const ck = cardEl && parseKey(cardEl.dataset.card);
  const it = ck && findItem(ck.itemId);
  const users = it ? groupUsers(it, ck.status, ck.order) : [];
  const rect = cardEl ? cardEl.getBoundingClientRect() : null;
  const me = meId();

  switch (verb){
    /* cabecera y navegación */
    case 'sync': if (!Api.isDemo()) Api.retry(); break;
    case 'filters': abrirHoja({ kind:'filters' }, { fd:Object.assign({}, S.f) }); break;
    case 'roulette': openRoulette(); break;
    case 'stats': openStats(); break;
    case 'settings': openSettings(); break;
    case 'add': openAdd(); break;
    case 'tab': setS({ tab:arg }); break;
    case 'collapse': if (arg === 'dropped' && !S.isMobile) setS({ collapsed:!S.collapsed }); break;
    case 'nav':
      if (arg === 'board'){ if (S.isMobile) irA('board'); else closeSheet(); }
      else if (arg === 'add') openAdd();
      else if (arg === 'roulette') openRoulette();
      else if (arg === 'stats') openStats();
      else if (arg === 'settings') openSettings();
      break;
    case 'toastact': { const t = S.toast; if (t && t.action) t.action(); setS({ toast:null }); break; }
    case 'confirmyes': confirmYes(); break;
    case 'sopen': plegar(arg); break;
    case 'theme': S.theme = arg; try { localStorage.setItem(LS.theme, arg); } catch(err){} render(); break;

    /* quitar filtros */
    case 'rm': {
      const parts = arg.split(':'), what = parts[0], v = parts[1];
      if (what === 'all'){ setS({ q:'', f:Object.assign({}, F0), fd:null }); break; }
      if (what === 'q'){ setS({ q:'' }); break; }
      if (what === 'allgen'){ const g2 = Object.assign({}, S.fd || S.f, { genres:[] }); setS(S.fd ? { fd:g2 } : { f:g2 }); break; }
      const f = Object.assign({}, S.f, { provs:S.f.provs.slice(), by:S.f.by.slice(), who:S.f.who.slice(), genres:(S.f.genres || []).slice() });
      if (what === 'type') f.type = null;
      else if (what === 'avail') f.avail = false;
      else if (what === 'hype') f.hypeUser = null;
      else if (what === 'who') f.who = f.who.filter((x) => x !== v);
      else if (what === 'prov') f.provs = f.provs.filter((x) => x !== v);
      else if (what === 'by') f.by = f.by.filter((x) => x !== v);
      else if (what === 'gen') f.genres = (f.genres || []).filter((x) => x !== v);
      else if (what === 'rate') f.rateMin = null;
      setS({ f:f, fd:null });
      break;
    }

    /* tarjeta */
    case 'hype': call(() => Api.setHype(ck.itemId, me, +arg)); break;
    case 'plus': bumpProgress(ck.itemId, users, 1, rect); break;
    case 'minus': bumpProgress(ck.itemId, users, -1, rect); break;
    case 'rplus': bumpProgress(ck.itemId, arg.split(','), 1, rect); break;
    case 'rminus': bumpProgress(ck.itemId, arg.split(','), -1, rect); break;
    case 'seen': move(cardEl.dataset.card, 'done', rect); break;
    case 'open': openDetail(cardEl.dataset.card); break;

    /* detalle */
    case 'd.to': {
      const k = parseKey(S.sheet.key);
      flash([k.itemId + '|' + arg], 'land');
      call(() => Api.setStatus(k.itemId, [me], arg), 'te he movido a ' + COL(arg).label);
      setTimeout(() => { const x = findItem(k.itemId); const p = x && x.participants[me];
        /* el calendario se queda plegado: aparece, pero no se despliega solo */
        if (p) setS({ sheet:{ kind:'detail', key:k.itemId + '|' + p.status + '|' + p.order }, epGrid:false }); }, 30);
      break;
    }
    case 'd.rate': {
      const k = parseKey(S.sheet.key);
      call(() => Api.setRating(k.itemId, me, +arg));
      S.pop = +arg; render(); setTimeout(() => { S.pop = null; render(); }, 320);
      break;
    }
    case 'd.hype': {
      const k = parseKey(S.sheet.key);
      call(() => Api.setHype(k.itemId, me, +arg));
      S.pop = +arg; render(); setTimeout(() => { S.pop = null; render(); }, 320);
      break;
    }
    case 'd.ep': { const k = parseKey(S.sheet.key); bumpProgress(k.itemId, [me], +arg, null); break; }
    case 'd.grid': setS({ epGrid:!S.epGrid }); break;
    case 'd.set': {
      const k = parseKey(S.sheet.key), n = arg.split('-');
      call(() => Api.setProgress(k.itemId, [me], { s:+n[0], e:+n[1] }));
      setS({ epGrid:false });
      buzz(8);
      break;
    }
    case 'd.solo': {
      const k = parseKey(S.sheet.key), x = findItem(k.itemId);
      flash([S.sheet.key], 'split');
      call(() => Api.splitOut(k.itemId, me), 'a tu ritmo, sin prisa');
      toast('vas a tu ritmo en ' + x.title + ' 🚶 ahora tienes tu propia fila en la tarjeta');
      closeSheet();
      break;
    }
    case 'd.join': {
      const k = parseKey(S.sheet.key), x = findItem(k.itemId);
      const tp = x.participants[arg], target = user(arg);
      flash([k.itemId + '|' + tp.status + '|' + tp.order], 'join');
      call(() => Api.joinUsers(k.itemId, me, arg), 'te has unido a ' + target.name);
      toast('te uniste a ' + target.name + ' ' + target.emoji + ' en ' + x.title);
      setS({ sheet:{ kind:'detail', key:k.itemId + '|' + tp.status + '|' + tp.order } });
      break;
    }
    case 'd.del': {
      const k = parseKey(S.sheet.key), x = findItem(k.itemId);
      /* apilada sobre el detalle: al contestar «mejor no» vuelves al título */
      abrirHoja({ kind:'confirm' }, { confirmAsk:{ kind:'del', itemId:k.itemId, title:x.title } }, true);
      break;
    }
    case 'd.note': { const k = parseKey(S.sheet.key); call(() => Api.removeNote(k.itemId, arg)); break; }
    case 'd.send': {
      const t = S.noteDraft.trim(); if (!t) break;
      const k = parseKey(S.sheet.key);
      setS({ noteDraft:'' });
      call(() => Api.addNote(k.itemId, t), 'nota guardada');
      break;
    }

    /* añadir */
    case 'a.pick': {
      const r = (S.addResults || []).find((x) => x.tmdbId === +arg);
      const have = S.data.items.find((x) => x.tmdbId === +arg);
      if (have && have.participants[me]){
        const p = have.participants[me];
        if (S.isMobile) S.tab = p.status;
        openDetail(have.id + '|' + p.status + '|' + p.order);
        toast('ya lo tenías en ' + COL(p.status).label);
        break;
      }
      if (have){
        const other = Object.keys(have.participants)[0], p = have.participants[other];
        flash([have.id + '|' + p.status + '|' + p.order], 'join');
        call(() => Api.joinUsers(have.id, me, other), 'te has unido');
        setS({ addDone:{ text:'te uniste a ' + user(other).name + ' en ' + have.title, sub:COL(p.status).label.toLowerCase(),
          c:COL(p.status).v, itemId:have.id, status:p.status } , addPick:null });
        break;
      }
      setS({ addPick:Object.assign({}, r, { status:'wish', hype:3 }), addDone:null });
      break;
    }
    case 'a.col': setS({ addPick:Object.assign({}, S.addPick, { status:arg }) }); break;
    case 'a.hype': setS({ addPick:Object.assign({}, S.addPick, { hype:+arg }) }); break;
    case 'a.confirm': {
      const p = S.addPick; if (!p) break;
      call(() => Api.addItem({ tmdbId:p.tmdbId, type:p.type, status:p.status, hype:p.hype }), p.title + ' añadida');
      if (S.isMobile) S.tab = p.status;
      setS({ addPick:null, addDone:{ text:p.title + ' está en ' + COL(p.status).label,
        sub: p.status === 'wish' ? 'con ' + p.hype + (p.hype === 1 ? ' corazón de ganas' : ' corazones de ganas') : null,
        c:COL(p.status).v, tmdbId:p.tmdbId, status:p.status } });
      break;
    }
    case 'a.cancel': setS({ addPick:null }); break;
    case 'a.clearq': setS({ addQ:'', addResults:null, addSearching:false, addPick:null });
      setTimeout(() => { const el = document.getElementById('addi'); if (el) el.focus(); }, 40); break;
    case 'af.more': setS({ afOpen:S.afOpen === false }); break;
    case 'af.go': lanzarBusqueda(); break;
    case 'af.t': setS({ af:Object.assign({}, S.af, { type: arg === 'both' ? null : arg }) }); break;
    case 'af.rate': setS({ af:Object.assign({}, S.af, { rateMin: S.af.rateMin === +arg ? null : +arg }) }); break;
    case 'af.dec': setS({ af:Object.assign({}, S.af, { dec: S.af.dec === arg ? null : arg }) }); break;
    case 'af.sort': setS({ af:Object.assign({}, S.af, { sort:arg }) }); break;
    case 'af.have': setS({ af:Object.assign({}, S.af, { hideHave:!S.af.hideHave }) }); break;
    case 'af.gen': { const g = S.af.genres.slice(), i = g.indexOf(arg);
      if (i < 0) g.push(arg); else g.splice(i, 1);
      setS({ af:Object.assign({}, S.af, { genres:g }) }); break; }
    case 'af.prov': { const p = S.af.provs.slice(), i = p.indexOf(arg);
      if (i < 0) p.push(arg); else p.splice(i, 1);
      setS({ af:Object.assign({}, S.af, { provs:p }) }); break; }
    case 'af.clear': setS({ af:Object.assign({}, AF0) }); break;
    case 'a.again': setS({ addDone:null, addQ:'', addResults:null });
      setTimeout(() => { const el = document.getElementById('addi'); if (el) el.focus(); }, 60); break;
    case 'a.undo': {
      const d = S.addDone; if (!d || !d.tmdbId) break;
      const x = S.data.items.find((i) => i.tmdbId === d.tmdbId);
      if (x) call(() => Api.removeItem(x.id));
      setS({ addDone:null });
      break;
    }
    case 'a.see': {
      const d = S.addDone; if (!d) break;
      const x = d.itemId ? findItem(d.itemId) : S.data.items.find((i) => i.tmdbId === d.tmdbId);
      if (S.isMobile) irA('board', { tab:d.status }); else closeSheet();
      if (x){
        const p = x.participants[me];
        if (p) setTimeout(() => openDetail(x.id + '|' + p.status + '|' + p.order), 60);
      }
      break;
    }

    /* filtros */
    case 'f.clear': setS({ fd:Object.assign({}, F0), q:'' }); break;
    case 'f.more': setS({ fMore:!S.fMore }); break;
    case 'f.apply':
      if (S.isMobile) irA('board', { f:S.fd || S.f, fd:null }); else setS({ f:S.fd || S.f, fd:null, sheet:null });
      say('filtros aplicados'); break;
    default: {
      if (verb.indexOf('f.') === 0){
        const f = Object.assign({}, S.fd || S.f);
        f.provs = f.provs.slice(); f.by = f.by.slice(); f.who = f.who.slice(); f.genres = (f.genres || []).slice();
        const tog = (arr, v) => arr.includes(v) ? arr.filter((x) => x !== v) : arr.concat([v]);
        const w = verb.slice(2);
        if (w === 't') f.type = (arg === 'both' || f.type === arg) ? null : arg;
        else if (w === 'mine') f.who = (f.who.length === 1 && f.who[0] === me) ? [] : [me];
        else if (w === 'who') f.who = tog(f.who, arg);
        else if (w === 'avail') f.avail = !f.avail;
        else if (w === 'prov') f.provs = tog(f.provs, arg);
        else if (w === 'hu') f.hypeUser = f.hypeUser === arg ? null : arg;
        else if (w === 'hm'){ f.hypeMin = +arg; if (!f.hypeUser) f.hypeUser = 'any'; }
        else if (w === 'by') f.by = tog(f.by, arg);
        else if (w === 'gen') f.genres = tog(f.genres, arg);
        else if (w === 'rate') f.rateMin = f.rateMin === +arg ? null : +arg;
        setS({ fd:f });
        break;
      }
      if (verb.indexOf('r.') === 0){
        const r = Object.assign({}, S.roul);
        const w = verb.slice(2);
        if (w === 'user') r.users = r.users.includes(arg) ? r.users.filter((u) => u !== arg) : r.users.concat([arg]);
        else if (w === 'time') r.time = r.time === +arg ? null : (+arg || null);
        else if (w === 'kind') r.kind = arg;
        else if (w === 'prov') r.provs = r.provs.includes(arg) ? r.provs.filter((p) => p !== arg) : r.provs.concat([arg]);
        else if (w === 'spin'){ spin(); break; }
        else if (w === 'accept'){
          const x = findItem(S.roul.result); if (!x) break;
          const us = S.roul.users.filter((u) => x.participants[u]);
          if (S.isMobile){ S.tab = 'watching'; irA('board'); } else closeSheet();
          flash([x.id + '|watching'], 'land');
          call(() => Api.setStatus(x.id, us, 'watching'), 'a verla');
          toast('¡' + x.title + ' esta noche! 🍿');
          break;
        }
        setS({ roul:r });
        break;
      }
      if (verb === 's.share'){ compartirDatos(); break; }
      if (verb === 's.scope'){ setS({ statScope:arg }); break; }
      if (verb === 's.year'){ setS({ statYear:arg }); break; }
      if (verb.indexOf('p.') === 0){
        const w = verb.slice(2), p = S.prof || {};
        if (w === 'emoji') setS({ prof:Object.assign({}, p, { emoji:arg }) });
        else if (w === 'color') setS({ prof:Object.assign({}, p, { color:decodeURIComponent(arg) }) });
        else if (w === 'save') saveProfile(false);
        else if (w === 'finish') saveProfile(true);
        else if (w === 'welcome') setS({ sheet:{ kind:'welcome' }, pila:[], profRec:false, prof:{ name:'', emoji:'🐻', color:PALETTE[0] } });
        else if (w === 'rmuser') abrirHoja({ kind:'confirm' }, { confirmAsk:{ kind:'user', userId:arg, name:user(arg).name } }, true);
        else if (w === 'copy') copyInvite();
        else if (w === 'forget') Api.olvidarDispositivo();
        /* el ofrecimiento del navegador se gasta aquí, dentro del gesto de tocar
           el botón, y sólo vale una vez: si dice que no, desaparece hasta que el
           navegador vuelva a ofrecerlo por su cuenta */
        else if (w === 'instalar'){
          const pr = promptInstalar; if (!pr) break;
          promptInstalar = null; render();
          Promise.resolve(pr.prompt())
            .then(() => pr.userChoice)
            .then((r) => { if (r && r.outcome === 'accepted') toast('instalada 🛋️ búscala en la pantalla de inicio'); })
            .catch(() => {});
        }
        else if (w === 'clubs') abrirHoja({ kind:'clubs' }, { nuevoClub:'', creando:false });
        else if (w === 'crear'){
          if (S.creando) break;
          /* norm() ya quita los acentos, con el rango de diacríticos escapado.
             No los escribas literales aquí: se leen fatal y son la clase de
             carácter invisible que ya nos costó una tarde. */
          const n = norm(String(S.nuevoClub || '').trim()).replace(/\s+/g, '-');
          if (!/^[a-z0-9][a-z0-9-]{1,30}$/.test(n)){ toast('el nombre va en minúsculas, sin espacios ni acentos, de 2 a 31 letras'); break; }
          if (Api.grupos().some((g) => g.group === n)){ toast('ya estás en un club que se llama así'); break; }
          const yo = user(meId());
          const rec = Api.perfilDelDispositivo() || { name:yo.name, emoji:yo.emoji, color:yo.color };
          setS({ creando:true });
          Api.crearClub(n, rec).then(() => {
            toast('club «' + n + '» creado ✨ ya estás dentro');
            setTimeout(() => location.reload(), 700);
          }).catch((e) => {
            setS({ creando:false });
            toast(e.code === 'ya-existe' ? 'ese nombre ya lo tiene otro club'
              : e.code === 'demasiados-clubes' ? 'hay demasiados clubes ya, habla conmigo'
              : 'no he podido crearlo, ¿probamos otra vez?');
          });
        }
        else if (w === 'switch'){
          const s = decodeURIComponent(arg);
          if (Api.grupos().some((g) => g.secret === s && g.activo)) closeSheet();
          else Api.cambiarGrupo(s);
        }
        else if (w === 'leave'){
          const s = decodeURIComponent(arg);
          abrirHoja({ kind:'confirm' }, { confirmAsk:{ kind:'leave', secret:s, group:grupoDe(s) } }, true);
        }
        else if (w === 'invite'){
          if (S.inviteState === 'making') break;
          setS({ inviteState:'making' });
          call(() => Api.createInvite()).then((url) => {
            if (!url){ setS({ inviteState:'idle' }); return; }
            setS({ invite:url, inviteState:'ready', copyState:'idle' });
            toast('invitación lista 💌 cópiala y mándala');
          });
        }
        break;
      }
    }
  }
});

document.addEventListener('input', (e) => {

  else if (k === 'note'){ S.noteDraft = el.value; }
  else if (k === 'add') onSearchInput(el.value);
  else if (k === 'pname'){ S.prof = Object.assign({}, S.prof, { name:el.value }); render(); }
  else if (k === 'nclub'){ S.nuevoClub = el.value; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.sheet) closeSheet();
  if (e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.in === 'note'){
    const t = S.noteDraft.trim(); if (!t) return;
    const k = parseKey(S.sheet.key);
    setS({ noteDraft:'' });
    call(() => Api.addNote(k.itemId, t), 'nota guardada');
  }
});

/* ── gestos (Pointer Events, ratón y dedo con el mismo código) ──────────────────
   Ninguno pasa por el pintado. Antes cada pointermove reconstruía el documento
   entero —unas sesenta veces por segundo mientras deslizas una tarjeta—, así que
   ahora el gesto escribe el estilo del elemento que se mueve y el estado sólo se
   entera al soltar, que es cuando de verdad ha pasado algo.                     */
function pintarDeslizamiento(card, dx){
  if (!card) return;
  card.style.transform = dx ? 'translateX(' + dx + 'px)' : '';
  card.style.transition = dx ? 'none' : '';
  const hint = card.parentElement && card.parentElement.querySelector('[data-swipe]');
  if (!hint || !card.dataset.card) return;
  const fi = ['wish','watching','done'].indexOf(parseKey(card.dataset.card).status);
  const nxt = COL(['wish','watching','done'][clamp(fi + 1, 0, 2)]);
  const prv = COL(['wish','watching','done'][clamp(fi - 1, 0, 2)]);
  const on = Math.abs(dx) > 4;
  hint.style.opacity = on ? '1' : '0';
  hint.style.background = on ? soft(dx > 0 ? nxt.v : prv.v, 26) : '';
  hint.children[0].style.opacity = dx < 0 ? '1' : '0';
  hint.children[1].style.opacity = dx > 0 ? '1' : '0';
}
const marcarColumna = (key) => document.querySelectorAll('[data-dropline]').forEach((el) => {
  const col = el.closest('[data-col]');
  el.classList.toggle('on', !!col && col.dataset.col === key);
});
const marcarDock = (key) => document.querySelectorAll('[data-dockt]').forEach((el) => {
  el.classList.toggle('over', el.dataset.dockt === key);
});

/* ── arrastrar la hoja hacia abajo para cerrarla ──────────────────────────────
   Antes sólo valía la barrita —21 px de alto— y había que recorrer 90 px
   enteros: en el móvil era casi imposible. Ahora se arrastra desde cualquier
   sitio de la hoja siempre que el contenido esté arriba del todo, que es lo que
   la gente intenta antes de buscar la barrita, y basta con soltarla con
   impulso. El fondo se va aclarando para que se vea venir el cierre.          */
document.addEventListener('wheel', (e) => {
  const s = e.target.closest && e.target.closest('.strip');
  if (!s || s.scrollWidth <= s.clientWidth + 2) return;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (!d) return;
  s.scrollLeft += d;
  e.preventDefault();
}, { passive:false });
let tira = null;
document.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'mouse') return;
  const s = e.target.closest && e.target.closest('.strip');
  if (!s || s.scrollWidth <= s.clientWidth + 2) return;
  tira = { s:s, x0:e.clientX, left:s.scrollLeft, movido:false };
});
document.addEventListener('pointermove', (e) => {
  if (!tira) return;
  const dx = e.clientX - tira.x0;
  if (!tira.movido && Math.abs(dx) < 4) return;
  tira.movido = true;
  tira.s.scrollLeft = tira.left - dx;
  e.preventDefault();
});
document.addEventListener('pointerup', () => {
  /* si has arrastrado, el clic que viene detrás no debe encender un filtro */
  if (tira && tira.movido) blockClick = Date.now();
  tira = null;
}, true);

let arrastreHoja = null;
function empezarArrastre(e){
  const hoja = e.target.closest('[data-sheet]');
  if (!hoja) return;
  const enTirador = !!e.target.closest('[data-handle]');
  /* No se decide aquí si esto es un botón o un arrastre: casi todo el contenido
     de una hoja está dentro de algún [data-a], y descartarlo al tocar dejaba el
     gesto reducido otra vez a la barrita. Se decide al MOVER — un toque sin
     movimiento nunca activa nada y el clic sigue su camino. Sólo se aparta de
     los campos de texto, donde arrastrar significa seleccionar. */
  if (!enTirador && e.target.closest('input,textarea,select,.strip')) return;
  arrastreHoja = { hoja:hoja, scr:hoja.querySelector('.scroll'), y0:e.clientY, dy:0,
    tUlt:e.timeStamp, yUlt:e.clientY, v:0, activo:enTirador };
  if (enTirador) fijarHoja(hoja);
  window.addEventListener('pointermove', moverHoja, { passive:true });
  window.addEventListener('pointerup', soltarHoja);
  window.addEventListener('pointercancel', soltarHoja);
}
function fijarHoja(hoja){
  /* fuera la clase de entrada: mientras una animación esté corriendo sobre el
     mismo transform, gana ella y la hoja se queda quieta por mucho que le
     escribas el estilo. Esto es lo que hace que siga al dedo. */
  hoja.classList.remove('anim');
  hoja.style.transition = 'none';
  const ov = hoja.parentElement;
  if (ov){ ov.classList.remove('anim'); ov.style.transition = 'none'; }
}
function moverHoja(e){
  const a = arrastreHoja; if (!a) return;
  const dy = e.clientY - a.y0;
  if (!a.activo){
    /* se decide una vez: ¿esto es cerrar la hoja o leer lo que hay dentro? */
    if (dy < -6 || (a.scr && a.scr.scrollTop > 0)) return quitarEscuchas();
    if (dy < 7) return;
    a.activo = true;
    fijarHoja(a.hoja);
  }
  if (e.timeStamp > a.tUlt) a.v = (e.clientY - a.yUlt) / (e.timeStamp - a.tUlt);
  a.tUlt = e.timeStamp; a.yUlt = e.clientY;
  a.dy = Math.max(0, dy);
  a.hoja.style.transform = 'translateY(' + a.dy + 'px)';
  const ov = a.hoja.parentElement;
  if (ov) ov.style.opacity = String(Math.max(.3, 1 - a.dy / ((a.hoja.offsetHeight || 600) * .85)));
}
function soltarHoja(){
  const a = arrastreHoja;
  quitarEscuchas();
  arrastreHoja = null;
  if (!a || !a.activo) return;
  const alto = a.hoja.offsetHeight || 600;
  const ov = a.hoja.parentElement;
  /* o has recorrido un buen trozo, o la has soltado con ganas */
  /* 0,55 px/ms son unos 550 px/s: un gesto claro de descarte. Con 0,4 se
     colaban arrastres tranquilos de medio segundo y la hoja se iba sola. */
  const cierra = a.dy > Math.min(130, alto * .22) || (a.v > .55 && a.dy > 30);
  if (!cierra){
    /* Devolver la curva y quitar el transform en el mismo tick no anima nada: el
       navegador compara con la transición que había ANTES del cambio, que era
       «none». Leer offsetHeight fuerza el recálculo en medio, así que la curva
       ya cuenta cuando se quita el transform. Se hace así y no con
       requestAnimationFrame para que la hoja vuelva a su sitio aunque el
       navegador no esté dando fotogramas. */
    a.hoja.style.transition = '';
    if (ov) ov.style.transition = '';
    void a.hoja.offsetHeight;
    a.hoja.style.transform = '';
    if (ov) ov.style.opacity = '';
    return;
  }
  blockClick = Date.now();          /* que el clic de después no reabra ni cierre nada */
  a.hoja.style.transition = 'transform .16s ease-in';
  a.hoja.style.transform = 'translateY(' + alto + 'px)';
  if (ov){ ov.style.transition = 'opacity .16s ease'; ov.style.opacity = '0'; }
  setTimeout(closeSheet, 140);
}
function quitarEscuchas(){
  window.removeEventListener('pointermove', moverHoja);
  window.removeEventListener('pointerup', soltarHoja);
  window.removeEventListener('pointercancel', soltarHoja);
}

let G = null, lpT = null, moved = false;
function detach(){ window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); window.removeEventListener('pointercancel', onUp); }
function endGesture(){
  clearTimeout(lpT); detach();
  if (G && G.mode === 'swipe') pintarDeslizamiento(G.el, 0);
  G = null;
  if (S.drag || S.dock) setS({ drag:null, dock:null });
}
document.addEventListener('pointerdown', (e) => {
  if (e.target.closest('[data-sheet]')){ if (e.button === 0) empezarArrastre(e); return; }
  const cardEl = e.target.closest('[data-card]');
  if (cardEl){
    if (e.button > 0 || e.target.closest('[data-a]')) return;
    G = { key:cardEl.dataset.card, el:cardEl, dx:0, x0:e.clientX, y0:e.clientY, r:cardEl.getBoundingClientRect(), mode:null };
    moved = false;
    window.addEventListener('pointermove', onMove, { passive:false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    if (S.isMobile){
      lpT = setTimeout(() => {
        if (!G || G.mode) return;
        G.mode = 'dock'; moved = true; buzz(12); G.over = null;
        setS({ dock:{ key:G.key } });
        /* el dock se pinta en el fotograma siguiente: medirlo antes daría nada */
        requestAnimationFrame(() => { if (G) G.docks = [...document.querySelectorAll('[data-dockt]')].map((el) => ({ key:el.dataset.dockt, r:el.getBoundingClientRect() })); });
      }, 350);
    }
    return;
  }
  /* deslizar el fondo cambia de pestaña */
  const board = e.target.closest('[data-board]');
  if (board && S.isMobile && !e.target.closest('[data-a]')){
    const x0 = e.clientX, y0 = e.clientY; let done = false;
    const mv = (ev) => {
      if (done) return;
      const dx = ev.clientX - x0, dy = ev.clientY - y0;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4){
        done = true;
        const i = CK.indexOf(S.tab), j = clamp(i + (dx < 0 ? 1 : -1), 0, CK.length - 1);
        if (j !== i){ setS({ tab:CK[j] }); buzz(6); }
        up();
      }
    };
    const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', mv, { passive:true });
    window.addEventListener('pointerup', up);
  }
});
function onMove(e){
  if (!G) return;
  const dx = e.clientX - G.x0, dy = e.clientY - G.y0;
  if (!G.mode){
    if (Math.abs(dx) < 9 && Math.abs(dy) < 9) return;
    clearTimeout(lpT);
    if (!S.isMobile){
      G.mode = 'drag';
      const k = parseKey(G.key), it = findItem(k.itemId); if (!it){ endGesture(); return; }
      const us = groupUsers(it, k.status, k.order), c = COL(k.status).v;
      /* los rectángulos de las columnas se miden una vez, no en cada movimiento */
      G.cols = [...document.querySelectorAll('[data-col]')].map((el) => ({ key:el.dataset.col, r:el.getBoundingClientRect() }));
      G.over = k.status;
      setS({ drag:{ key:G.key, w:G.r.width, x:G.r.left, y:G.r.top, ox:G.x0 - G.r.left, oy:G.y0 - G.r.top,
        over:k.status, c:c, title:it.title, ini:it.title.slice(0, 2).toUpperCase(),
        who: us.map((u) => user(u).emoji).join(' ') + ' ' + (us.length > 1 ? us.length + ' personas' : user(us[0]).name) } });
    }
    else if (Math.abs(dx) > Math.abs(dy) * 1.25) G.mode = 'swipe';
    else { endGesture(); return; }
  }
  moved = true;
  if (G.mode === 'swipe'){
    e.preventDefault();
    G.dx = clamp(dx, -150, 150);
    pintarDeslizamiento(G.el, G.dx);
  }
  else if (G.mode === 'drag'){
    e.preventDefault();
    let over = null;
    (G.cols || []).forEach((c) => { if (e.clientX >= c.r.left && e.clientX <= c.r.right) over = c.key; });
    const ghost = document.querySelector('[data-ghost]');
    if (ghost) ghost.style.translate = (e.clientX - S.drag.ox) + 'px ' + (e.clientY - S.drag.oy) + 'px';
    if (over && over !== G.over){
      G.over = over;
      marcarColumna(over !== parseKey(G.key).status ? over : null);
    }
  }
  else if (G.mode === 'dock'){
    e.preventDefault();
    let over = null;
    (G.docks || []).forEach((d) => {
      if (e.clientX >= d.r.left - 4 && e.clientX <= d.r.right + 4 && e.clientY >= d.r.top - 30) over = d.key;
    });
    if (over !== G.over){ if (over) buzz(6); G.over = over; marcarDock(over); }
  }
}
function onUp(){
  if (!G){ endGesture(); return; }
  const mode = G.mode, key = G.key, r = G.r, el = G.el, dx = G.dx || 0, over = G.over;
  clearTimeout(lpT); detach(); G = null;
  if (mode === 'swipe'){
    const dir = dx > 80 ? 1 : dx < -80 ? -1 : 0;
    pintarDeslizamiento(el, 0);        /* vuelve a su sitio con su propia curva */
    if (dir){ buzz(10); shift(key, dir, r); }
  } else if (mode === 'drag'){
    setS({ drag:null });
    if (over && over !== parseKey(key).status) move(key, over, r);
  } else if (mode === 'dock'){
    setS({ dock:null });
    if (over && over !== parseKey(key).status){ buzz(10); move(key, over, r); }
  } else {
    endGesture();
    if (!moved) openDetail(key);
  }
  if (moved) blockClick = Date.now();
}
window.addEventListener('resize', () => {
  const m = window.innerWidth < 900;
  if (m !== S.isMobile) setS({ isMobile:m });
});

/* ── arranque ── */
(async function boot(){
  /* si venías de un tema de los antiguos, se cae con suavidad al de casa */
  try { const t = localStorage.getItem(LS.theme); S.theme = TEMA_OK(t) ? t : 'cosmos'; } catch(e){ S.theme = 'cosmos'; }
  const cfg = readConfig();
  Api = createApi(cfg);
  Api.subscribe((data) => { S.data = data; S.sync = Api.getSyncStatus(); render(); });
  render();
  await Api.boot();
  S.data = Api.getState(); S.sync = Api.getSyncStatus();
  setTimeout(() => setS({ booting:false }), 700);
  /* si la invitación era para un club en el que ya estabas, no se canjea, pero
     tampoco se calla: abrir un enlace y que no pase nada es lo peor que hay */
  if (Api.invitacionSobraba && Api.invitacionSobraba()){
    setTimeout(() => toast('ya estabas en este club 🛋️ te he dejado como estabas'), 900);
  }

  /* El service worker es lo que le falta al navegador para ofrecer «instalar» y
     que la app se abra sin barras, como una de verdad. Se registra al final y
     sin esperarlo: si falla —contexto no seguro, un navegador que no lo trae—,
     la app funciona exactamente igual, sólo que no se puede instalar. */
  if ('serviceWorker' in navigator){
    try { await navigator.serviceWorker.register('sw.js'); }
    catch(e){ /* sin instalar, pero viva */ }
  }
})();

/* Esto se engancha fuera del arranque y cuanto antes: el navegador dispara el
   aviso una sola vez y no espera a que terminemos de cargar. */
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();               /* si no, algunos navegadores lo sueltan a su aire */
  promptInstalar = e;
  /* en el móvil los ajustes son sección y en escritorio hoja: hay que mirar las dos */
  if (S.view === 'settings' || (S.sheet && S.sheet.kind === 'settings')) render();
});
window.addEventListener('appinstalled', () => { promptInstalar = null; render(); });
</script>
