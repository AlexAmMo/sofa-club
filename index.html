<style>
/* ═══════════ TOKENS ═══════════ */
:root{
  --bg:#171425; --surface:#221D33; --surface-2:#2C2542; --text:#F2EDFF; --text-dim:#A79DC4;
  --wish:#FFE08A; --watching:#FF8FD0; --done:#7EF0D2; --dropped:#B79CFF;
  --spring:cubic-bezier(.34,1.56,.64,1); --ink:#1B1626; --bad:#FF6B8A;
}
[data-theme="cielo"]{ --bg:#101527; --surface:#1A2038; --surface-2:#242C48; --text:#EAF0FF; --text-dim:#94A3C4;
  --wish:#A8C7FF; --watching:#C9B0FF; --done:#9BE7C4; --dropped:#F0A8C0; }
[data-theme="ciruela"]{ --bg:#221820; --surface:#2E2129; --surface-2:#3A2A34; --text:#FFF1E8; --text-dim:#C4A79B;
  --wish:#FFC49B; --watching:#FF9A8B; --done:#A8D5B0; --dropped:#D9B8A0; }
[data-theme="neon"]{ --bg:#0A0910; --surface:#14121F; --surface-2:#1E1B2E; --text:#FFFFFF; --text-dim:#8B85A8;
  --wish:#FFD84D; --watching:#FF4FA3; --done:#3DF5D0; --dropped:#8B5CF6; }

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:Nunito,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--wish);outline-offset:3px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#ffffff1f;border-radius:999px;border:3px solid transparent;background-clip:content-box}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
/* zonas de pintado: no generan caja, así que la cabecera pegajosa y el tablero
   se comportan como si fueran hijos directos de #app, que es lo que eran */
.rgn{display:contents}

/* ═══════════ ÁTOMOS ═══════════ */
.b{background:var(--surface);border-radius:20px;padding:15px}
.lbl{font-size:11.5px;font-weight:800;color:var(--text-dim)}
.lbl-u{font-size:12px;font-weight:800;color:var(--text-dim);letter-spacing:.6px;text-transform:uppercase}
.dim{color:var(--text-dim)}
.face{font-family:ui-monospace,monospace}
.pretty{text-wrap:pretty}
.r44{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;flex:none}
.pill{height:44px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:800;
  display:flex;align-items:center;gap:8px;background:#ffffff0d;color:var(--text-dim)}
.pill.on{background:color-mix(in oklab,var(--c) 20%,transparent);color:var(--c);
  box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--c) 50%,transparent)}
.av{border-radius:999px;display:grid;place-items:center;flex:none;
  background:color-mix(in oklab,var(--c) 70%,transparent);width:26px;height:26px;font-size:13px}
.av.s34{width:34px;height:34px;font-size:17px}
.av.s30{width:30px;height:30px;font-size:15px}
.av.s38{width:38px;height:38px;font-size:19px}
.av.s52{width:52px;height:52px;font-size:26px}
.bar{height:7px;border-radius:999px;background:#ffffff14;margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--c);transition:width .3s var(--spring)}
.bar.sm{height:5px;margin-top:4px}
.inp{height:52px;border-radius:999px;background:#ffffff0f;border:0;outline:none;padding:0 16px;
  font-size:15.5px;font-weight:700;width:100%;min-width:0}
.cta{width:100%;height:52px;border-radius:999px;background:var(--watching);color:var(--ink);
  font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s ease}
.clubc{width:100%;background:var(--surface);border-radius:22px;padding:13px 14px;display:flex;
  align-items:center;gap:12px;text-align:left}
.clubc.on{background:color-mix(in oklab,var(--c) 11%,var(--surface));
  box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--c) 42%,transparent)}
.stack{display:flex;flex:none}
.stack>span{margin-left:-9px;box-shadow:0 0 0 2.5px var(--surface-2)}
.stack>span:first-child{margin-left:0}
/* pista de otro club: información que sólo tiene este móvil, dicha bajito */
.xclub{display:flex;align-items:flex-start;gap:9px;background:#ffffff0a;border-radius:16px;
  padding:10px 12px;font-size:12.5px;font-weight:700;color:var(--text-dim);line-height:1.45;text-wrap:pretty}
.xclub b{font-weight:800;color:var(--text)}

/* ═══════════ CABECERA ═══════════ */
header{position:sticky;top:0;z-index:30;background:color-mix(in oklab,var(--bg) 84%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
.hrow{display:flex;align-items:center;gap:12px;max-width:1500px;margin:0 auto}
.htitle{font-weight:800;font-size:19px;line-height:1.15;letter-spacing:-.2px}
.hsync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-dim);line-height:1.3;position:relative;min-width:0}
/* pase lo que pase con el texto, esta línea no se parte en dos: recorta */
.hsync span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsync::after{content:'';position:absolute;left:0;right:0;top:-13px;bottom:-13px}
.hsync i{width:7px;height:7px;border-radius:999px;background:var(--c);flex:none;display:block}
.hline{display:flex;align-items:center;gap:9px;min-width:0}
.hclub{display:flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;flex:none;
  font-size:12px;font-weight:800;color:var(--watching);position:relative;
  background:color-mix(in oklab,var(--watching) 15%,transparent)}
.hclub::after{content:'';position:absolute;left:0;right:0;top:-10px;bottom:-10px}
.hclub b{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.dsearch{display:flex;align-items:center;gap:6px;background:#ffffff0f;border-radius:999px;height:44px;padding:0 4px 0 14px;width:250px}
.dsearch input{flex:1;min-width:0;height:44px;background:none;border:0;outline:none;font-size:13.5px;font-weight:600}
.icobtn{width:44px;height:44px;border-radius:999px;background:#ffffff10;display:grid;place-items:center;font-size:17px;flex:none}
.tabs{display:flex;gap:4px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:82px;height:50px;padding:0 6px;border-radius:16px 16px 0 0;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-bottom:3px solid transparent;color:var(--text-dim)}
.tab.on{background:color-mix(in oklab,var(--c) 12%,var(--surface));border-bottom-color:var(--c);color:var(--c)}
.tab b{font-size:11.5px;font-weight:800;white-space:nowrap}
.chips{max-width:1500px;margin:9px auto 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ═══════════ TABLERO ═══════════ */
.board{display:grid;gap:14px;padding:4px 14px 130px;align-items:start;max-width:1500px;margin:0 auto;touch-action:pan-y}
.cards{display:flex;flex-direction:column;gap:12px}
.colhead{display:flex;align-items:center;gap:8px;padding:8px 6px 12px}
.colhead b{font-weight:800;font-size:15px;color:var(--c);letter-spacing:-.1px}
.colhead u{font-size:12.5px;font-weight:800;color:var(--c);text-decoration:none;
  background:color-mix(in oklab,var(--c) 14%,transparent);border-radius:999px;padding:2px 8px}
/* siempre puesta, invisible: el arrastre la enciende sin repintar el tablero */
.dropline{height:4px;border-radius:999px;background:var(--c);box-shadow:0 0 14px var(--c);display:none}
.dropline.on{display:block}
@media (min-width:900px){
  .board{grid-template-columns:repeat(3,minmax(230px,1fr)) 74px;padding:10px 22px 160px;gap:18px}
  .board[data-dropped="open"]{grid-template-columns:repeat(4,minmax(230px,1fr))}
  .col[data-collapsed="true"] .cards{display:none}
  .col[data-collapsed="true"] .colhead{writing-mode:vertical-rl;height:230px;padding:14px 0;justify-content:flex-start;cursor:pointer}
  .col[data-collapsed="true"] .colhead u{writing-mode:horizontal-tb}
  .col[data-key="dropped"] .colhead{cursor:pointer}
  .mob{display:none!important}
}
@media (max-width:899px){
  .col[data-active="false"]{display:none}
  .colhead{display:none}
  .desk{display:none!important}
}

/* ═══════════ TARJETA ═══════════ */
.cw{position:relative}
/* la pista de deslizamiento está siempre puesta y empieza invisible: el gesto la
   enciende escribiendo estilos, sin pasar por el pintado */
.swipe{position:absolute;inset:0;border-radius:20px;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;font-size:24px;opacity:0}
.swipe>span{opacity:0}
.card{position:relative;background:color-mix(in oklab,var(--c) 7%,var(--surface));border-radius:20px;padding:12px;
  box-shadow:0 8px 24px -16px #000c;touch-action:pan-y;will-change:transform;
  transition:transform .22s var(--spring),opacity .18s ease}
.card.glow{box-shadow:0 0 0 1.5px color-mix(in oklab,var(--c) 60%,transparent),0 10px 30px -14px color-mix(in oklab,var(--c) 50%,transparent)}
.card.ghost{opacity:.22;box-shadow:none}
.ctop{display:flex;gap:12px;align-items:flex-start}
.post{width:56px;height:84px;border-radius:12px;flex:none;background-color:#0003;background-size:cover;background-position:center}
.post.ink{display:grid;place-items:center;font-weight:800;font-size:22px;
  background:color-mix(in oklab,var(--c) 18%,transparent);color:var(--c)}
.ctitle{font-weight:800;font-size:15.5px;line-height:1.2;text-wrap:pretty}
.corig{font-size:11.5px;color:var(--text-dim);margin-top:1px;font-style:italic}
.cmeta{font-size:12px;color:var(--text-dim);margin-top:3px;font-weight:600}
.crow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.stack{display:flex}
.stack>*+*{margin-left:-8px}
.stack .av,.stack .more{box-shadow:0 0 0 2px color-mix(in oklab,var(--c) 7%,var(--surface))}
.more{height:26px;min-width:26px;padding:0 5px;border-radius:999px;background:var(--surface-2);
  display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--text-dim)}
.prop{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-dim);font-weight:600}
.ncount{margin-left:auto;height:26px;padding:0 9px;border-radius:999px;background:#ffffff0f;
  font-size:11.5px;font-weight:800;color:var(--text-dim);display:flex;align-items:center;gap:4px}
.hype{display:flex;align-items:center;gap:7px;border-radius:999px;padding:5px 10px 5px 11px;background:#ffffff0d}
.hype.hot{background:color-mix(in oklab,var(--c) 20%,transparent)}
.hype b{font-size:11.5px;font-weight:800;color:var(--c)}
.hdot{width:9px;height:9px;border-radius:999px;background:#ffffff20}
.hdot.on{background:var(--c)}
.prov{height:24px;display:flex;align-items:center;gap:5px;padding:0 9px 0 3px;border-radius:999px;background:#ffffff0f}
.prov i{width:18px;height:18px;border-radius:6px;background-size:cover;display:block;background-color:#ffffff14}
.prov span{font-size:10.5px;font-weight:800;color:var(--text-dim)}
.epline{display:flex;align-items:center;gap:11px;margin-top:12px}
.epmark{font-weight:800;font-size:17px;color:var(--c);letter-spacing:-.3px}
.epcount{font-size:11.5px;color:var(--text-dim);font-weight:700}
.minus{background:#ffffff12;font-size:20px;font-weight:800}
.plus{background:var(--c);color:var(--ink);font-size:21px;font-weight:800;
  box-shadow:0 8px 20px -12px var(--c)}
.plus.off{background:#ffffff12;color:var(--text);box-shadow:none}
.rows{display:flex;flex-direction:column;gap:7px;margin-top:11px;padding-top:10px;box-shadow:inset 0 1px 0 #ffffff12}
.prow{display:flex;align-items:center;gap:9px}
.prow b{font-weight:800;font-size:13px}
.prow em{font-size:10.5px;color:var(--text-dim);font-weight:700;font-style:normal}
.wide{width:100%;margin-top:11px;height:44px;border-radius:14px;background:#ffffff0d;
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13.5px;font-weight:800;color:var(--c)}
.seen{width:100%;margin-top:11px;height:46px;border-radius:14px;background:var(--c);color:var(--ink);
  font-size:14.5px;font-weight:800;display:grid;place-items:center}
.rated{display:flex;align-items:center;gap:12px;margin-top:11px}
.ravg{font-weight:800;font-size:28px;line-height:1;color:var(--c);letter-spacing:-1px}
.rstars{font-size:13px;color:var(--c);letter-spacing:1px}
.rchip{display:flex;align-items:center;gap:3px;height:22px;padding:0 7px 0 3px;border-radius:999px;
  background:#ffffff0f;font-size:10.5px;font-weight:800;color:var(--text-dim)}
.rchip .av{width:17px;height:17px;font-size:10px}
.mood{margin-top:9px;font-size:12px;font-weight:700;border-radius:12px;padding:7px 11px;
  color:var(--c);background:color-mix(in oklab,var(--c) 16%,transparent)}
.elsew{margin-top:9px;font-size:12px;color:var(--text-dim);font-weight:600;display:flex;gap:6px;align-items:flex-start}
.empty{display:flex;flex-direction:column;align-items:center;gap:9px;padding:30px 18px;border-radius:20px;
  background:color-mix(in oklab,var(--c) 5%,var(--surface));text-align:center}
.empty p{font-size:13.5px;font-weight:700;color:var(--text-dim);max-width:230px;margin:0;text-wrap:pretty}

/* ═══════════ NAV / FLOTANTES ═══════════ */
nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;gap:4px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in oklab,var(--surface-2) 94%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 -14px 34px -18px #000c}
nav button{flex:1;height:56px;border-radius:18px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;color:var(--text-dim)}
nav button i{font-size:19px;line-height:1;font-weight:800;font-style:normal}
nav button b{font-size:10.5px;font-weight:800}
nav button.on{background:color-mix(in oklab,var(--watching) 14%,transparent);color:var(--watching)}
nav button.pri{flex:1.25;background:var(--watching);color:var(--ink);box-shadow:0 10px 26px -12px var(--watching)}
nav button.pri i{font-size:25px}
.fab{position:fixed;right:26px;bottom:26px;z-index:40;height:58px;padding:0 24px;border-radius:999px;
  background:var(--watching);color:var(--ink);font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:10px;
  box-shadow:0 14px 34px -10px var(--watching),0 4px 12px #0006}
/* la posición la escribe el arrastre en «translate», que se compone aparte del
   transform y no obliga a repintar el tablero en cada pointermove */
.ghostcard{position:fixed;left:0;top:0;z-index:60;pointer-events:none;transform:rotate(2deg) scale(1.03);
  border-radius:20px;padding:12px;background:color-mix(in oklab,var(--c) 12%,var(--surface));
  box-shadow:0 30px 60px -18px #000c,0 0 0 1px #ffffff1a}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:70;padding:16px 14px calc(20px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--surface-2),color-mix(in oklab,var(--surface-2) 0%,transparent));pointer-events:none}
.dock>p{font-size:12.5px;font-weight:800;color:var(--text-dim);text-align:center;margin:0 0 10px}
.dock>div{display:flex;gap:8px}
.dockt{flex:1;height:86px;border-radius:20px;background:#ffffff12;color:var(--text-dim);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transform:scale(1);transition:transform .16s var(--spring)}
.dockt i{font-size:22px;font-style:normal;transition:font-size .16s var(--spring)}
.dockt b{font-size:10.5px;font-weight:800}
.dockt.over{background:color-mix(in oklab,var(--c) 30%,transparent);color:var(--c);transform:scale(1.1)}
.dockt.over i{font-size:28px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:120;
  display:flex;justify-content:center;pointer-events:none}
.toast>div{pointer-events:auto;max-width:520px;width:100%;background:var(--surface-2);border-radius:18px;
  padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 22px 50px -18px #000c}
.toast span{font-size:13.5px;font-weight:700;flex:1;text-wrap:pretty}
.toast button{flex:none;height:38px;padding:0 15px;border-radius:999px;background:var(--wish);
  color:#2A2016;font-weight:800;font-size:13.5px}
.conf{position:fixed;z-index:80;pointer-events:none}

/* ═══════════ HOJAS ═══════════ */
.ov{position:fixed;inset:0;z-index:100;background:#0A0812b8;backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{position:relative;background:var(--surface-2);width:100%;max-width:100%;max-height:92vh;border-radius:28px 28px 0 0;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -20px 60px -20px #000e;
  will-change:transform;transition:transform .2s var(--spring)}
/* la entrada se anima sólo al abrir la hoja, no cada vez que cambia algo dentro:
   la clase la pone el pintado a mano sobre el elemento recién creado */
.ov.anim{animation:fadeIn .18s ease both}
.sheet.anim{animation:sheetUp .24s var(--spring) both}
.handle{flex:none;padding:10px 0 6px;display:grid;place-items:center;cursor:grab;touch-action:none}
.handle i{width:44px;height:5px;border-radius:999px;background:#ffffff2b;display:block}
/* cerrar / volver: hasta ahora sólo se salía tocando fuera o arrastrando la
   barrita, y en un móvil eso no lo encuentra nadie */
.xsheet{position:absolute;top:6px;right:8px;z-index:2;width:44px;height:44px;border-radius:999px;
  display:grid;place-items:center;font-size:22px;font-weight:800;color:var(--text-dim);line-height:1}
.xsheet:active{background:#ffffff12}
.scroll{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:6px 18px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:900px){

<body>
<div class="sr" aria-live="polite" id="live"></div>
<!-- Cinco zonas que se repintan por separado. Llevan display:contents, así que
     para el diseño esto es exactamente igual que un solo contenedor. -->
<div id="app"><div class="rgn" id="rhead"></div><div class="rgn" id="rmain"></div><div class="rgn" id="rnav"></div><div class="rgn" id="rfloat"></div><div class="rgn" id="rsheet"></div></div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   API REAL — sustituye a mock-api.js del handoff.
   Implementa el contrato de §2.2. Fuera de este bloque no hay ni un fetch ni
   un localStorage. Persistencia: data.json en un repo de GitHub vía Contents
   API. Catálogo: TMDB. Claves: link mágico → localStorage.
   ══════════════════════════════════════════════════════════════════════════ */

const LS = { cfg:'sc.cfg', theme:'sc.theme', perfil:'sc.me', cache:'sc.cache.' };
const iso = (d) => new Date(d == null ? Date.now() : d).toISOString();
const uid = (p) => p + Math.random().toString(36).slice(2, 9);
const nowIso = () => new Date().toISOString();

/* ── configuración ────────────────────────────────────────────────────────────
   El navegador ya no guarda ningún token de GitHub ni de TMDB. Sólo guarda tu
   secreto personal, que únicamente sirve para hablar con el Worker y que lleva
   dentro a qué grupo perteneces. El enlace trae «#s=» si ya eres del grupo o
   «#i=» si te acaban de invitar (de un solo uso).

   Se admiten varios secretos a la vez: así puedes estar en el tablero de la
   pareja y en el de los amigos desde el mismo móvil. Ojo con lo que esto NO es:
   no hay cuenta ni identidad común. En cada club eres una persona distinta con
   su propia clave, y el servidor no sabe que sois la misma. Quien sí lo sabe es
   este dispositivo, y por eso todo lo que cruza clubes — el perfil que se
   preselecciona, las pistas de «esto ya lo tienes en el otro» — se calcula aquí
   y no sale de aquí.                                                           */
const WORKER_URL = 'https://sofa-club.mysofaclub.workers.dev';   /* ← edítalo una vez */
const CLAVE_OK = /^[a-z0-9][a-z0-9-]{1,30}\.[a-z0-9]{16,64}$/;
const grupoDe = (s) => (CLAVE_OK.test(String(s || '')) ? String(s).split('.')[0] : null);

function readConfig(){
  let cfg = { secrets: [], active: null, invite: null };
  try {
    const g = JSON.parse(localStorage.getItem(LS.cfg) || '{}');
    if (Array.isArray(g.secrets)) cfg.secrets = g.secrets.filter((s) => CLAVE_OK.test(s));
    if (CLAVE_OK.test(g.active)) cfg.active = g.active;
  } catch(e){}
  const h = location.hash.slice(1);
  if (h){
    const p = new URLSearchParams(h);
    const s = p.get('s'), i = p.get('i');
    if (s && CLAVE_OK.test(s)) añadirSecreto(cfg, s);
    if (i && CLAVE_OK.test(i)) cfg.invite = i;          /* no se guarda: se consume al entrar */
    history.replaceState(null, '', location.pathname + location.search);
  }
  if (!cfg.active || cfg.secrets.indexOf(cfg.active) < 0) cfg.active = cfg.secrets[0] || null;
  return cfg;
}
function añadirSecreto(cfg, s){
  const g = grupoDe(s);
  cfg.secrets = cfg.secrets.filter((x) => grupoDe(x) !== g).concat([s]);
  cfg.active = s;
  saveConfig(cfg);
}
/* salir de un club en ESTE dispositivo: se va la clave y se va su copia local.
   No echa a nadie de ningún sitio ni borra nada del club; simplemente este
   móvil deja de tener llave, y para volver hará falta otra invitación.         */
function quitarSecreto(cfg, s){
  const g = grupoDe(s);
  cfg.secrets = cfg.secrets.filter((x) => x !== s);
  if (cfg.active === s) cfg.active = cfg.secrets[0] || null;
  if (g && !cfg.secrets.some((x) => grupoDe(x) === g)) borrarCacheDe(g);
  saveConfig(cfg);
}
function saveConfig(cfg){
  try { localStorage.setItem(LS.cfg, JSON.stringify({ secrets: cfg.secrets, active: cfg.active })); } catch(e){}
}
function olvidarTodo(cfg){
  try {
    localStorage.removeItem(LS.cfg);
    localStorage.removeItem(LS.perfil);
    ((cfg && cfg.secrets) || []).forEach((s) => borrarCacheDe(grupoDe(s)));
  } catch(e){}
}

/* ── la copia local, una por club ────────────────────────────────────────────
   Antes había una sola ranura y cambiar de club dejaba el tablero en blanco
   hasta que contestaba el Worker. Con una copia por club el cambio es
   instantáneo, y de paso el dispositivo puede mirar de reojo lo que tienes en
   los otros sin pedir permiso a nadie ni hacer una sola petición.              */
const claveCache = (g) => LS.cache + g;
function guardarCacheDe(g, state){
  if (!g) return;
  try { localStorage.setItem(claveCache(g), JSON.stringify(state)); } catch(e){}
}
function borrarCacheDe(g){
  if (!g) return;
  try { localStorage.removeItem(claveCache(g)); } catch(e){}
}
/* se sanea al leer: esto es texto guardado en el navegador y acaba en el DOM */
function leerCacheDe(g){
  if (!g) return null;
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(claveCache(g)) || 'null'); } catch(e){}
  if (!raw || !raw.me) return null;
  const v = publicView(raw, raw.me);
  if (!v.me) return null;
  v.group = g;
  return v;
}

/* ── el perfil de este dispositivo ───────────────────────────────────────────
   No es una cuenta: es un recuerdo. Sirve para no volver a teclear tu nombre y
   tu bicho cada vez que entras en un club nuevo. Sigues siendo una persona
   distinta en cada club, con su propia clave y su propio identificador.        */
function leerPerfil(){
  let p = null;
  try { p = JSON.parse(localStorage.getItem(LS.perfil) || 'null'); } catch(e){}
  if (!p || !String(p.name || '').trim()) return null;
  return { name: okStr(p.name, 40), emoji: okEmoji(p.emoji), color: okColor(p.color) };
}
function guardarPerfil(p){
  if (!p || !String(p.name || '').trim()) return;
  try { localStorage.setItem(LS.perfil, JSON.stringify({ name: okStr(p.name, 40), emoji: okEmoji(p.emoji), color: okColor(p.color) })); } catch(e){}
}

/* ── saneado en la frontera ──────────────────────────────────────────────────
   Todo lo que sale del Api pasa por aquí. data.json lo puede escribir cualquiera
   con el enlace, y los títulos vienen de TMDB, que es contenido editado por
   terceros: ninguno de los dos es de fiar para meterlo en el DOM tal cual.      */
const ID_OK = /^[A-Za-z0-9_-]{1,64}$/;
const okId = (s) => ID_OK.test(String(s || '')) ? String(s) : null;
const okColor = (c) => /^#[0-9a-fA-F]{3,8}$/.test(String(c || '')) ? String(c) : '#8B85A8';
const okEmoji = (e) => (String(e == null ? '' : e).replace(/[^\p{Extended_Pictographic}\p{L}\p{N}]/gu, '').slice(0, 4) || '👤');
const okNum = (n) => (typeof n === 'number' && isFinite(n)) ? n : (isFinite(+n) && n !== null && n !== '' ? +n : null);
const okStr = (s, max) => String(s == null ? '' : s).slice(0, max || 400);
/* sólo carátulas de TMDB (o el SVG del modo demo). Cualquier otra cosa, fuera. */
const okImgPath = (p) => {
  const s = String(p || '');
  if (/^\/[A-Za-z0-9._-]{1,120}$/.test(s)) return s;               // ruta TMDB
  if (/^data:image\/svg\+xml,[A-Za-z0-9%._~()'!*:@,;+$-]*$/.test(s)) return s; // demo
  return null;
};
function safeUser(u){
  const id = okId(u.id); if (!id) return null;
  return { id: id, name: okStr(u.name, 40) || '¿?', emoji: okEmoji(u.emoji), color: okColor(u.color),
    joinedAt: u.joinedAt, active: u.active !== false };
}
function safeItem(i){
  const id = okId(i.id); if (!id) return null;
  const parts = {};
  Object.keys(i.participants || {}).forEach((k) => {
    const uidOk = okId(k); if (!uidOk) return;
    const p = i.participants[k];
    if (!p || ['wish','watching','done','dropped'].indexOf(p.status) < 0) return;
    parts[uidOk] = {
      status: p.status, order: okNum(p.order) || 0,
      progress: p.progress && okNum(p.progress.s) != null && okNum(p.progress.e) != null ? { s:+p.progress.s, e:+p.progress.e } : null,
      hype: clampN(okNum(p.hype), 1, 3, 2), rating: p.rating == null ? null : clampN(okNum(p.rating), 1, 5, null),
      startedAt: p.startedAt || null, finishedAt: p.finishedAt || null, updatedAt: p.updatedAt || null,
    };
  });
  if (!Object.keys(parts).length) return null;
  const seasons = Array.isArray(i.seasons)
    ? i.seasons.map((s) => ({ number: okNum(s.number) || 0, episodes: okNum(s.episodes) || 0 })).filter((s) => s.number > 0)
    : null;
  return {
    id: id, tmdbId: okNum(i.tmdbId), type: i.type === 'movie' ? 'movie' : 'tv',
    title: okStr(i.title, 160) || 'Sin título', originalTitle: okStr(i.originalTitle, 160),
    year: okNum(i.year), poster: okImgPath(i.poster),
    genres: (Array.isArray(i.genres) ? i.genres : []).slice(0, 8).map((g) => okStr(g, 40)),
    overview: okStr(i.overview, 1200), runtime: okNum(i.runtime) || 0,
    seasons: seasons && seasons.length ? seasons : null,
    totalEpisodes: okNum(i.totalEpisodes),
    providers: (Array.isArray(i.providers) ? i.providers : []).slice(0, 6)
      .map((p) => ({ name: okStr(p.name, 40), logo: okImgPath(p.logo) })).filter((p) => p.name),
    providersCheckedAt: i.providersCheckedAt || null,
    addedBy: okId(i.addedBy) || '', addedAt: i.addedAt || null,
    participants: parts,
    notes: (Array.isArray(i.notes) ? i.notes : []).filter((n) => n && !n.deletedAt && okId(n.id))
      .slice(0, 200).map((n) => ({ id: okId(n.id), by: okId(n.by) || '', text: okStr(n.text, 600), at: n.at || null })),
    updatedAt: i.updatedAt || null,
  };
}
function clampN(v, a, b, dflt){ return (v == null || !isFinite(v)) ? dflt : Math.max(a, Math.min(b, v)); }

/* vista pública: sin lápidas y saneada */
function publicView(raw, me){
  return {
    me: okId(me),
    users: (raw.users || []).filter((u) => !u.deletedAt).map(safeUser).filter(Boolean),
    items: (raw.items || []).filter((i) => !i.deletedAt).map(safeItem).filter(Boolean),
  };
}
/* ── cliente de GitHub: data.json vía Contents API (envía CORS, sin proxy) ── */
const IMG = { sm: 'w185', md: 'w342', lg: 'w500' };

/* ── espejo local de las operaciones ──────────────────────────────────────────
   Sirve para dos cosas: el modo demo, y pintar el cambio al instante mientras
   el Worker confirma. No es una comprobación de seguridad — el Worker vuelve a
   validarlo todo y su respuesta manda —, así que puede ser simple.            */
function aplicarLocal(st, op, a, me){
  const it = (id) => st.items.find((x) => x.id === id);
  const orden = (status) => {
    let max = 0;
    st.items.forEach((i) => Object.values(i.participants).forEach((p) => { if (p.status === status) max = Math.max(max, p.order || 0); }));
    return max + 1024;
  };
  const parte = (status, o) => ({ status, order: o.order, progress: o.progress || null, hype: o.hype != null ? o.hype : 2,
    rating: null, startedAt: status === 'wish' ? null : nowIso(),
    finishedAt: (status === 'done' || status === 'dropped') ? nowIso() : null, updatedAt: nowIso() });
  const sellar = (x, u) => { if (x.participants[u]) x.participants[u].updatedAt = nowIso(); x.updatedAt = nowIso(); };
  const x = a.id ? it(a.id) : null;

  if (op === 'addItem'){
    let y = st.items.find((i) => i.tmdbId === a.tmdbId);
    if (!y){
      y = Object.assign({ id: uid('itm_'), tmdbId: a.tmdbId, type: a.type, title: a.title || 'Cargando…',
        originalTitle: a.originalTitle || '', year: a.year || null, poster: a.poster || null, genres: [], overview: '',
        runtime: 0, seasons: null, totalEpisodes: null, providers: [], addedBy: me, addedAt: nowIso(),
        participants: {}, notes: [], updatedAt: nowIso() });
      st.items = [y].concat(st.items);
    }
    if (!y.participants[me]) y.participants[me] = parte(a.status || 'wish', { order: orden(a.status || 'wish'), hype: a.hype });
    return;
  }
  if (!x && op !== 'updateProfile' && op !== 'removeUser') return;
  if (op === 'removeItem') st.items = st.items.filter((i) => i.id !== a.id);
  else if (op === 'setStatus'){
    const o = orden(a.status);
    (a.userIds || []).forEach((u) => {
      const p = x.participants[u]; if (!p) return;
      p.status = a.status; p.order = o;
      if (a.status === 'watching' && x.type === 'tv' && !p.progress) p.progress = { s: 1, e: 0 };
      if (a.status === 'wish'){ p.progress = null; p.rating = null; p.finishedAt = null; }
      if (a.status === 'done' || a.status === 'dropped') p.finishedAt = nowIso();
      if (a.status === 'watching'){ p.startedAt = p.startedAt || nowIso(); p.finishedAt = null; }
      sellar(x, u);
    });
  }
  else if (op === 'setProgress') (a.userIds || []).forEach((u) => { const p = x.participants[u]; if (p){ p.progress = { s: a.progress.s, e: a.progress.e }; sellar(x, u); } });
  else if (op === 'splitOut'){ const p = x.participants[me]; if (p){ p.order = orden(p.status); sellar(x, me); } }
  else if (op === 'joinUsers'){
    const t = x.participants[a.target]; if (!t) return;
    x.participants[me] = Object.assign({}, x.participants[me] || parte(t.status, { order: t.order }),
      { status: t.status, order: t.order, progress: t.progress ? Object.assign({}, t.progress) : null });
    sellar(x, me);
  }
  else if (op === 'setHype'){ const p = x.participants[me]; if (p){ p.hype = a.value; sellar(x, me); } }
  else if (op === 'setRating'){ const p = x.participants[me]; if (p){ p.rating = a.value; sellar(x, me); } }
  else if (op === 'addNote'){ x.notes = x.notes.concat([{ id: uid('n_'), by: me, text: a.text, at: nowIso() }]); x.updatedAt = nowIso(); }
  else if (op === 'removeNote'){ x.notes = x.notes.filter((n) => n.id !== a.noteId || n.by !== me); x.updatedAt = nowIso(); }
  else if (op === 'updateProfile') st.users = st.users.map((u) => u.id === me ? Object.assign({}, u, { name: a.name, emoji: a.emoji, color: a.color }) : u);
  else if (op === 'removeUser'){
    st.users = st.users.filter((u) => u.id !== a.userId);
    st.items.forEach((i) => { delete i.participants[a.userId]; });
    st.items = st.items.filter((i) => Object.keys(i.participants).length);
  }
}

/* lo que llega del Worker se vuelve a sanear aquí: los nombres, las notas y
   los textos de TMDB los escriben personas, y esta es la última frontera antes
   del DOM. */
const sanear = (st) => Object.assign(publicView(st || {}, st && st.me), { group: st && st.group, owner: st && st.owner });

/* ── el Api: hacia fuera, el mismo contrato de siempre ────────────────────── */
function createApi(cfg){
  const demo = !cfg.active || /TU-SUBDOMINIO/.test(WORKER_URL);
  let state = { me: null, users: [], items: [] };
  let sync = { state: 'idle', pending: 0 };
  const subs = new Set();
  const cola = [];
  let enviando = false, sinClave = false, ultimoError = null, sobraba = false;
  const catalogo = {};

  const emit = () => { const s = state; subs.forEach((f) => { try { f(s); } catch(e){ console.error(e); } }); };
  const setSync = (st, n, silencioso) => {
    const antes = sync;
    sync = { state: st, pending: n == null ? cola.length : n };
    /* «silencioso» significa: el tablero volvió igual que estaba. Si además el
       estado de sincronización tampoco cambió, no hay nada que contarle a la
       pantalla — emitir aquí es lo que la hacía parpadear cada minuto. */
    if (silencioso && antes.state === sync.state && antes.pending === sync.pending) return;
    emit();
  };
  const guardarCache = () => { if (!demo) guardarCacheDe(grupoDe(cfg.active), state); };

  async function llamar(ruta, opciones){
    const r = await fetch(WORKER_URL + ruta, Object.assign({
      headers: Object.assign({ 'Content-Type': 'application/json' }, cfg.active ? { Authorization: 'Bearer ' + cfg.active } : {}),
    }, opciones || {}));
    let cuerpo = null;
    try { cuerpo = await r.json(); } catch(e){}
    if (!r.ok){
      const err = new Error((cuerpo && cuerpo.error) || ('http-' + r.status));
      err.code = (cuerpo && cuerpo.error) || 'http'; err.status = r.status;
      throw err;
    }
    return cuerpo;
  }

  /* las operaciones se encolan y salen en orden; así el servidor nunca recibe
     dos cambios cruzados y el reintento es trivial */
  function encolar(op, args, opciones){
    if (demo){ aplicarLocal(state, op, args, state.me); state = Object.assign({}, state, { items: state.items.slice() }); emit(); return Promise.resolve({}); }
    aplicarLocal(state, op, args, state.me);
    state = Object.assign({}, state, { items: state.items.slice() });
    guardarCache(); emit();
    return new Promise((resolve, reject) => {
      const previo = (opciones && opciones.fusionar) ? cola.find((c) => c.op === op && c.clave === opciones.fusionar && !c.enviada) : null;
      if (previo){ previo.args = args; previo.resolves.push(resolve); previo.rejects.push(reject); }
      else cola.push({ op, args, clave: opciones && opciones.fusionar, enviada: false, resolves: [resolve], rejects: [reject] });
      setSync('saving');
      clearTimeout(encolar._t);
      encolar._t = setTimeout(vaciar, (opciones && opciones.esperar) || 120);
    });
  }
  async function vaciar(){
    if (enviando || !cola.length || sinClave) return;
    if (!navigator.onLine){ setSync('offline'); return; }
    enviando = true;
    while (cola.length){
      const c = cola[0];
      c.enviada = true;
      try {
        const r = await llamar('/api/op', { method: 'POST', body: JSON.stringify({ op: c.op, args: c.args }) });
        state = sanear(r.state); guardarCache();
        cola.shift(); c.resolves.forEach((f) => f(r));
      } catch(e){
        c.enviada = false;
        if (e.code === 'sin-clave'){ sinClave = true; setSync('error'); enviando = false; emit(); return; }
        if (!navigator.onLine || e.status === undefined){ setSync('offline'); enviando = false; return; }
        ultimoError = e;
        setSync('error');
        cola.shift(); c.rejects.forEach((f) => f(e));
      }
    }
    enviando = false;
    ultimoError = null;
    setSync('idle', 0);
  }
  async function refrescar(){
    if (demo || sinClave || cola.length) return;
    try {
      const r = await llamar('/api/session', { method: 'POST' });
      const nuevo = sanear(r.state);
      const igual = JSON.stringify(nuevo) === JSON.stringify(state);
      state = nuevo;
      if (!igual) guardarCache();       /* y si vino igual, ni escribir en disco */
      setSync('idle', 0, igual);
    }
    catch(e){ if (e.code === 'sin-clave'){ sinClave = true; setSync('error'); } else if (!navigator.onLine) setSync('offline'); }
  }

  const Api = {
    getState: () => state,
    subscribe(fn){ subs.add(fn); return () => subs.delete(fn); },
    getSyncStatus: () => sync,
    imageUrl(path, size){
      if (!path) return null;
      if (/^data:/.test(path)) return path;
      if (!/^\/[A-Za-z0-9._-]{1,120}$/.test(path)) return null;
      return 'https://image.tmdb.org/t/p/' + (IMG[size || 'md']) + path;
    },

    async searchTitles(query, opts){
      if (demo){
        const q = (query || '').toLowerCase();
        return state.items.filter((i) => i.title.toLowerCase().includes(q))
          .map((i) => ({ tmdbId: i.tmdbId, type: i.type, title: i.title, originalTitle: i.originalTitle, year: i.year, poster: i.poster }));
      }
      const r = await fetch(WORKER_URL + '/api/search?q=' + encodeURIComponent(query),
        { headers: { Authorization: 'Bearer ' + cfg.active }, signal: opts && opts.signal });
      if (!r.ok) throw new Error('busqueda');
      const j = await r.json();
      (j.results || []).forEach((x) => { catalogo[x.tmdbId] = x; });
      return j.results || [];
    },

    addItem(o){
      const semilla = catalogo[o.tmdbId] || {};
      return encolar('addItem', { tmdbId: o.tmdbId, type: o.type, status: o.status, hype: o.hype,
        title: semilla.title, originalTitle: semilla.originalTitle, year: semilla.year, poster: semilla.poster });
    },
    removeItem(id){ return encolar('removeItem', { id }); },
    setStatus(id, userIds, status){ return encolar('setStatus', { id, userIds, status }); },
    /* el progreso es un valor absoluto, así que varios toques seguidos se funden
       en uno solo: ni te hace esperar ni genera un commit por episodio */
    setProgress(id, userIds, p){ return encolar('setProgress', { id, userIds, progress: p }, { fusionar: 'p:' + id, esperar: 700 }); },
    splitOut(id){ return encolar('splitOut', { id }); },
    joinUsers(id, _me, target){ return encolar('joinUsers', { id, target }); },
    setHype(id, _u, value){ return encolar('setHype', { id, value }, { fusionar: 'h:' + id, esperar: 400 }); },
    setRating(id, _u, value){ return encolar('setRating', { id, value }, { fusionar: 'r:' + id, esperar: 400 }); },
    addNote(id, text){ return encolar('addNote', { id, text }); },
    removeNote(id, noteId){ return encolar('removeNote', { id, noteId }); },
    updateProfile(p){
      if (demo && !state.me){
        const id = uid('u_');
        state = Object.assign({}, state, { me: id, users: state.users.concat([{ id, name: p.name, emoji: p.emoji, color: p.color, joinedAt: nowIso(), active: true }]) });
        emit(); return Promise.resolve(id);
      }
      guardarPerfil(p);            /* para no volver a teclearlo en el próximo club */
      return encolar('updateProfile', { name: p.name, emoji: p.emoji, color: p.color });
    },
    removeUser(userId){ return encolar('removeUser', { userId }); },
    async createInvite(){
      if (demo) return location.href;
      const r = await llamar('/api/op', { method: 'POST', body: JSON.stringify({ op: 'createInvite', args: {} }) });
      state = sanear(r.state); emit();
      return r.url;
    },

    /* estado para la interfaz */
    isDemo: () => demo,
    isClassic: () => false,
    hasTmdb: () => !demo,
    authFailed: () => sinClave,
    repoName: () => grupoDe(cfg.active),

    /* los clubes de este dispositivo. Nada de esto viaja: son las claves que
       hay guardadas aquí y la copia local de cada tablero.                    */
    grupos: () => cfg.secrets.map((s) => ({ secret: s, group: grupoDe(s), activo: s === cfg.active })),
    estadoDeClub: (g) => (g && g === grupoDe(cfg.active) ? state : leerCacheDe(g)),
    perfilDelDispositivo: () => leerPerfil(),
    cambiarGrupo(secret){ if (secret === cfg.active) return; cfg.active = secret; saveConfig(cfg); location.reload(); },
    salirDeClub(secret){ quitarSecreto(cfg, secret); location.reload(); },
    olvidarDispositivo(){ olvidarTodo(cfg); location.reload(); },
    retry(){ sinClave = false; ultimoError = null; if (cola.length) vaciar(); else refrescar(); },
    ultimoFallo: () => ultimoError,

    async boot(){
      if (demo){ const raw = demoSeed(); state = sanear({ me: raw.users[0].id, users: raw.users, items: raw.items }); emit(); return; }
      const c = leerCacheDe(grupoDe(cfg.active));            /* pinta ya, sin esperar al Worker */
      if (c){ state = c; emit(); }
      /* Una invitación al club en el que YA estás no sirve de nada: canjearla te
         crearía una segunda persona y dejaría la primera huérfana en el tablero.
         Pero sólo sobra si tu clave de ese club sigue valiendo — si te echaron o
         se regeneró, la invitación es justo lo que necesitas. Por eso se
         pregunta primero y se decide después.                                  */
      if (cfg.invite && cfg.active && grupoDe(cfg.invite) === grupoDe(cfg.active)){
        await refrescar();
        if (!sinClave){ cfg.invite = null; sobraba = true; emit(); return; }
      }
      if (cfg.invite){
        emit();          /* la pantalla de bienvenida se encarga: llamará a unirse() */
        return;
      }
      await refrescar();
    },
    /* crear un club nuevo estando ya en alguno. El Worker exige una clave
       válida de cualquier club: no hace falta la llave maestra, pero tampoco
       puede hacerlo quien pase por aquí de casualidad. */
    async crearClub(nombre, perfil){
      const r = await llamar('/api/group', { method: 'POST', body: JSON.stringify({
        group: nombre, name: perfil.name, emoji: perfil.emoji, color: perfil.color }) });
      añadirSecreto(cfg, r.secret);
      guardarPerfil(perfil);
      state = sanear(r.state); guardarCacheDe(grupoDe(r.secret), state);
      return r;
    },
    /* alta con invitación de un solo uso: el Worker devuelve TU secreto */
    async unirse(perfil){
      const r = await llamar('/api/join', { method: 'POST', body: JSON.stringify({ invite: cfg.invite, name: perfil.name, emoji: perfil.emoji, color: perfil.color }) });
      añadirSecreto(cfg, r.secret);
      guardarPerfil(perfil);
      cfg.invite = null;
      state = sanear(r.state); guardarCache(); setSync('idle', 0);
      return r;
    },
    hayInvitacion: () => !!cfg.invite,
    clubInvitado: () => grupoDe(cfg.invite),
    invitacionSobraba(){ const s = sobraba; sobraba = false; return s; },   /* se cuenta una vez */
  };

  window.addEventListener('online', () => { if (cola.length) vaciar(); else refrescar(); });
  window.addEventListener('offline', () => setSync('offline'));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (cola.length) vaciar(); else refrescar(); } });
  setInterval(() => { if (!document.hidden) refrescar(); }, 60000);
  return Api;
}

/* ── lo que este móvil sabe de ti en tus OTROS clubes ────────────────────────
   Aquí está la parte buena de un «estado global» sin ninguna de sus pegas: no
   hay petición detrás, sale de la copia local de cada club. Nadie de un club ve
   nada de otro, el servidor no relaciona tus identidades y tu estado sigue
   siendo de cada tablero. La relación la pone el dispositivo, que es el único
   que tiene derecho a ponerla.
   Se calcula una vez: cambiar de club recarga la página.                      */
let otrosIdx = null;
function otrosClubes(tmdbId){
  if (!tmdbId || !Api.grupos) return [];
  if (!otrosIdx){
    otrosIdx = {};
    Api.grupos().forEach((g) => {
      if (g.activo) return;
      const st = Api.estadoDeClub(g.group);
      if (!st || !st.me) return;
      st.items.forEach((i) => {
        const p = i.participants[st.me];
        if (!p || !i.tmdbId) return;
        /* las temporadas viajan con la pista: sin ellas no hay número absoluto */
        (otrosIdx[i.tmdbId] = otrosIdx[i.tmdbId] || []).push({ group:g.group, p:p, seasons:i.seasons });
      });
    });
  }
  return otrosIdx[tmdbId] || [];
}
function fraseOtroClub(x){
  const c = COL(x.p.status);
  let t = 'en «' + x.group + '» la tienes en ' + c.emoji + ' ' + c.label.toLowerCase();
  if (x.p.status === 'watching' && x.p.progress) t += ', por la ' + epTxt({ seasons:x.seasons }, x.p.progress);
  if (x.p.rating) t += ', con ' + STARS(x.p.rating);
  return t;
}
function absEp(it, pr){
  if (!pr || !it.seasons) return 0;
  let n = 0; it.seasons.forEach((s) => { if (s.number < pr.s) n += s.episodes; });
  return n + pr.e;
}
/* «T22 E5» no le sirve a nadie que vea anime: el reproductor dice «episodio
   1093». El número absoluto ya sabíamos calcularlo, sólo faltaba enseñarlo —
   y sólo cuando aporta algo, que en una serie de una temporada sería decir
   dos veces el mismo número. */
function epTxt(it, pr, sep){
  const s = pr ? pr.s : 1, e = pr ? pr.e : 0, n = absEp(it, pr);
  return 'T' + s + (sep || ' E') + e + (n > e ? ' · nº ' + n : '');
}
function step(it, pr, dir){
  const ss = it.seasons || [];
  let s = pr ? pr.s : 1, e = pr ? pr.e : 0;
  const len = (n) => (ss.find((x) => x.number === n) || { episodes:0 }).episodes;
  if (dir > 0){ e += 1; if (e > len(s)){ if (s >= ss.length) return 'end'; s += 1; e = 1; } }
  else { e -= 1; if (e < 0){ if (s <= 1) return { s:1, e:0 }; s -= 1; e = len(s); } }
  return { s:s, e:e };
}
function matches(it, uid_, f){
  if (S.q){
    const q = norm(S.q);
    if (!norm(it.title).includes(q) && !norm(it.originalTitle).includes(q)) return false;
  }
  if (f.type && it.type !== f.type) return false;
  if (f.provs.length && !it.providers.some((p) => f.provs.includes(p.name))) return false;
  if (f.avail && !it.providers.length) return false;
  if (f.by.length && !f.by.includes(it.addedBy)) return false;
  if (f.who.length && !f.who.includes(uid_)) return false;
  if (f.hypeUser){
    const ok = (u) => { const p = it.participants[u]; return !!p && p.status === 'wish' && p.hype >= f.hypeMin; };
    if (f.hypeUser === 'any'){ if (!ok(uid_)) return false; }
    else if (!ok(f.hypeUser) || it.participants[uid_].status !== 'wish') return false;
  }
  return true;
}
const hasF = (f) => { const g = f || S.f; return !!(S.q || g.type || g.provs.length || g.by.length || g.who.length || g.avail || g.hypeUser); };
const countTitles = (f) => S.data.items.filter((i) => Object.keys(i.participants).some((u) => matches(i, u, f))).length;

let toastT = null;

function toast(text, label, action){

async function call(fn, ok){
  try { const r = await fn(); if (ok) say(ok); return r; }
  catch(e){
    if (e && e.code === 'no-tmdb') toast('falta la clave de TMDB, no puedo buscar títulos');
    else toast('no he podido guardarlo (・_・;)', 'reintentar', () => call(fn, ok));
    return null;
  }
}

function rain(rect){
  const chars = ['💗','⭐','✨','💛','🩷','🌟'];
  const parts = Array.from({ length:16 }, (_, i) => ({
    x: Math.round(rect.left + rect.width * (0.15 + Math.random() * 0.7)),
    y: Math.round(rect.top + rect.height * 0.4),
    ch: chars[i % chars.length], size: Math.round(13 + Math.random() * 14),
    dx: Math.round((Math.random() - 0.5) * 220), dy: Math.round(-70 - Math.random() * 160),
    rot: Math.round((Math.random() - 0.5) * 220), dur: (0.7 + Math.random() * 0.25).toFixed(2),
  }));
  setS({ confetti:parts });
  setTimeout(() => setS({ confetti:[] }), 1000);
}

function buildCards(status){
  const out = [];
  S.data.items.forEach((it) => {
    if (S.pendingDel === it.id) return;
    const groups = {};
    Object.keys(it.participants).forEach((u) => {
      const p = it.participants[u];
      if (p.status !== status) return;
      if (!matches(it, u, S.f)) return;
      (groups[p.order] = groups[p.order] || []).push(u);
    });
    Object.keys(groups).sort((a, b) => b - a).forEach((o) => out.push({ it:it, order:+o, users:groups[o] }));
  });
  return out;
}

function detailHtml(){
  const k = parseKey(S.sheet.key);
  const it = findItem(k.itemId); if (!it) return '';

  const all = Object.keys(it.participants);
  const mine = it.participants[me];
  const orig = it.originalTitle && norm(it.originalTitle) !== norm(it.title) ? it.originalTitle : null;
  const meta = [it.type === 'tv' ? '📺 serie' : '🎬 película', it.year,
    it.seasons ? it.seasons.length + ' temporadas · ' + it.totalEpisodes + ' ep. de ' + it.runtime + ' min' : it.runtime + ' min'].filter(Boolean).join(' · ');
  const poster = it.poster ? Api.imageUrl(it.poster, 'lg') : null;

  let parts = all.map((u) => {
    const p = it.participants[u], uu = user(u), cc = COL(p.status).v, you = u === me;

      + '<div style="font-size:11.5px;font-weight:700;color:' + cc + '">' + COL(p.status).emoji + ' ' + COL(p.status).label
        + (p.progress ? ' · ' + epTxt(it, p.progress) : '')

      + (p.rating ? '<span style="font-size:14px;color:var(--done);letter-spacing:1px;flex:none">' + STARS(p.rating) + '</span>' : '')

      let moves = '';

          + '<button class="pill on" style="--c:' + c + '" data-a="d.ep:1">+ siguiente ep.</button>';
      }
      moves += CK.filter((x) => x !== p.status).map((x) => '<button class="pill" style="background:' + soft(COL(x).v, 15) + ';color:' + COL(x).v + '" data-a="d.to:' + x + '">' + COL(x).emoji + ' ' + COL(x).label + '</button>').join('');
      row += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">' + moves + '</div>';
      if (p.status === 'done' || p.status === 'dropped'){
        row += '<div style="display:flex;align-items:center;gap:6px;margin-top:10px"><span class="lbl">tu nota</span>'
          + [1,2,3,4,5].map((n) => '<button class="r44' + (S.pop && n <= S.pop ? ' pop' : '') + '" data-a="d.rate:' + n + '" style="font-size:21px;color:' + (n <= (p.rating || 0) ? 'var(--done)' : 'var(--text-dim)') + ';background:' + (n <= (p.rating || 0) ? soft('var(--done)', 12) : '#ffffff08') + '">' + (n <= (p.rating || 0) ? '★' : '☆') + '</button>').join('')
          + '</div>';
      }
    }
    return row + '</div>';
  }).join('');

  const joins = [], seen = {};
  if (mine) all.forEach((u) => {
    if (u === me) return;
    const p = it.participants[u];
    if (p.status === mine.status && p.order === mine.order) return;
    const kk = p.status + '|' + p.order; if (seen[kk]) return; seen[kk] = 1;
    const uu = user(u);
    joins.push('<button class="big" data-a="d.join:' + u + '" style="background:' + soft(COL(p.status).v, 16) + ';color:' + COL(p.status).v + '">🤝 me uno a ' + esc(uu.name) + ' ' + uu.emoji + ' (' + COL(p.status).label.toLowerCase() + ')</button>');
  });
  const canSolo = !!(mine && users.length > 1 && users.includes(me));
  const notes = it.notes.slice().sort((a, b) => new Date(a.at) - new Date(b.at));
  const fuera = otrosClubes(it.tmdbId);

  return '<div style="--c:' + c + '">'
    + '<div style="display:flex;gap:14px;align-items:flex-start">'
    + (poster ? '<div class="dposter" role="img" aria-label="' + esc(it.title) + '" style="' + bgImg(poster) + '"></div>'
              : '<div class="dposter ink">' + esc(it.title.slice(0, 2).toUpperCase()) + '</div>')
    + '<div style="flex:1;min-width:0"><div class="dtitle">' + esc(it.title) + '</div>'
    + (orig ? '<div style="font-size:13px;color:var(--text-dim);font-style:italic;margin-top:2px">' + esc(orig) + '</div>' : '')
    + '<div style="font-size:13px;color:var(--text-dim);font-weight:700;margin-top:7px">' + esc(meta) + '</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:9px">' + it.genres.map((g) => '<span class="gchip">' + esc(g) + '</span>').join('') + '</div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">'
    + it.providers.map((p) => '<span class="pchip"><i style="' + bgImg(Api.imageUrl(p.logo, 'sm')) + '"></i><span>' + esc(p.name) + '</span></span>').join('')
    + (!it.providers.length ? '<span style="font-size:12px;font-weight:700;color:var(--text-dim)">no está en ninguna plataforma vuestra 🏴‍☠️</span>' : '')
    + '</div></div></div>'
    + (it.overview ? '<p style="font-size:14px;line-height:1.55;color:var(--text-dim);margin:16px 0 0" class="pretty">' + esc(it.overview) + '</p>' : '')
    + '<div class="lbl-u" style="margin-top:20px">quién la lleva</div>'
    + '<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">' + parts + '</div>'
    + (fuera.length ? '<div class="xclub" style="margin-top:9px">🛋️<div>'
        + fuera.map((x) => esc(fraseOtroClub(x))).join('<br>')
        + '<br><span style="opacity:.75">esto sólo lo ves tú, y sólo en este dispositivo.</span></div></div>' : '')
    + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:16px">'
    + (canSolo ? '<button class="big" data-a="d.solo">🚶 seguir yo solo</button>' : '')
    + joins.join('')
    + '<button class="big" data-a="d.del" style="flex:none;min-width:0;padding:0 18px;background:#ffffff0d;color:var(--text-dim)">🗑 borrar</button>'
    + '</div>'
    + '<div class="lbl-u" style="margin-top:22px">notas (' + notes.length + ')</div>'
    + '<div style="display:flex;flex-direction:column;gap:9px;margin-top:10px">'
    + notes.map((n) => { const uu = user(n.by);
        return '<div class="note"><span class="av s30" style="--c:' + uu.color + '">' + uu.emoji + '</span><div>'
          + '<div style="display:flex;align-items:baseline;gap:8px"><span style="font-weight:800;font-size:12.5px">' + esc(uu.name) + '</span>'
          + '<span style="font-size:11px;color:var(--text-dim);font-weight:600">' + ago(n.at) + '</span>'
          + (n.by === me ? '<button data-a="d.note:' + n.id + '" style="margin-left:auto;font-size:11px;font-weight:800;color:var(--text-dim);min-width:44px;min-height:28px">borrar</button>' : '')
          + '</div><div style="font-size:13.5px;line-height:1.45;margin-top:3px" class="pretty">' + esc(n.text) + '</div></div></div>';
      }).join('')
    + (!notes.length ? '<div style="font-size:13px;color:var(--text-dim);font-weight:600">nadie ha dicho nada todavía <span class="face">( ˘ω˘ )</span></div>' : '')
    + '<div style="display:flex;gap:8px;align-items:center;margin-top:4px">'
    + '<input id="notei" class="inp" style="height:46px;font-size:14px;font-weight:600" value="' + esc(S.noteDraft) + '" data-in="note" placeholder="escribe algo…">'
    + '<button class="r44" data-a="d.send" aria-label="Enviar nota" style="width:46px;height:46px;background:var(--watching);color:var(--ink);font-size:18px;font-weight:800">↑</button>'
    + '</div></div></div>';
}

/* ── hoja: buscar y filtrar ── */
function filtersHtml(){
  const d = S.data, f = S.fd || S.f;
  const provs = [].concat.apply([], d.items.map((i) => i.providers.map((p) => p.name))).filter((v, i, a) => a.indexOf(v) === i);
  const pill = (a, label, on, c, avatarUser) => '<button class="pill' + (on ? ' on' : '') + '" style="--c:' + c + (avatarUser ? ';padding-left:5px' : '') + '" data-a="' + a + '">'
    + (avatarUser ? '<span class="av s30" style="--c:' + avatarUser.color + '">' + avatarUser.emoji + '</span>' : '') + '<span>' + esc(label) + '</span></button>';
  const n = countTitles(f);
  const mineOnly = f.who.length === 1 && f.who[0] === meId();
  const sections = [
    { t:'qué es', chips:[pill('f.t:tv', '📺 series', f.type === 'tv', 'var(--watching)'), pill('f.t:movie', '🎬 pelis', f.type === 'movie', 'var(--watching)')] },
    { t:'quién lo tiene apuntado', hint:'con mucha gente en el tablero, el filtro más útil',
      chips:[pill('f.mine', '👤 solo lo mío', mineOnly, 'var(--wish)')].concat(d.users.map((u) => pill('f.who:' + u.id, u.name, f.who.includes(u.id), u.color, u))) },
    { t:'dónde está', chips:[pill('f.avail', '📡 disponible ahora', f.avail, 'var(--done)')].concat(provs.map((p) => pill('f.prov:' + p, p, f.provs.includes(p), 'var(--done)'))) },
    { t:'nivel de ganas', hint:'solo mira la columna «Nos apetece»',
      chips:[pill('f.hu:any', 'de quien sea', f.hypeUser === 'any', 'var(--wish)')]
        .concat(d.users.map((u) => pill('f.hu:' + u.id, u.name, f.hypeUser === u.id, u.color, u)))

/* ── hoja: ruleta ── */
function candidates(){
  const r = S.roul || { users:[], provs:[], kind:'both' };
  return S.data.items.map((it) => {
    let w = 0;
    r.users.forEach((u) => { const p = it.participants[u]; if (p && p.status === 'wish') w += p.hype; });
    if (!w) return null;
    if (r.kind !== 'both' && it.type !== r.kind) return null;
    if (r.time && (it.runtime || 0) > r.time) return null;
    if (r.provs.length && !it.providers.some((p) => r.provs.includes(p.name))) return null;
    return { item:it, w:w };
  }).filter(Boolean);
}

/* ── hoja: estadísticas ── */
function statsHtml(){
  const d = S.data, me = meId(), mineOnly = S.statScope === 'me', year = S.statYear;
  const rows = [];
  d.items.forEach((it) => Object.keys(it.participants).forEach((u) => {
    if (mineOnly && u !== me) return;
    const p = it.participants[u];
    const y = p.finishedAt ? new Date(p.finishedAt).getFullYear() : null;
    if (year !== 'all' && String(y) !== year) return;
    rows.push({ item:it, u:u, p:p });
  }));
  const done = rows.filter((r) => r.p.status === 'done');
  const series = done.filter((r) => r.item.type === 'tv').length;
  const movies = done.filter((r) => r.item.type === 'movie').length;
  const mins = rows.reduce((a, r) => {
    const it = r.item;
    if (it.type === 'movie') return a + (r.p.status === 'done' ? it.runtime : 0);
    const eps = r.p.status === 'done' ? (it.totalEpisodes || 0) : absEp(it, r.p.progress);
    return a + eps * it.runtime;
  }, 0);
  const hours = Math.round(mins / 60);
  const human = hours > 48 ? nfmt(hours / 24) + ' días seguidos de televisión' : nfmt(hours / 3.5) + ' tardes de sofá enteras';
  const rated = rows.filter((r) => r.p.rating);
  const avg = rated.length ? rated.reduce((a, r) => a + r.p.rating, 0) / rated.length : 0;
  const best = rated.slice().sort((a, b) => b.p.rating - a.p.rating)[0];
  const worst = rated.slice().sort((a, b) => a.p.rating - b.p.rating)[0];
  const dropped = rows.filter((r) => r.p.status === 'dropped');
  const dropEp = dropped.filter((r) => r.p.progress).map((r) => absEp(r.item, r.p.progress));
  const genres = {}; done.forEach((r) => r.item.genres.forEach((g) => { genres[g] = (genres[g] || 0) + 1; }));
  const gTop = Object.keys(genres).map((g) => [g, genres[g]]).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const gMax = gTop.length ? gTop[0][1] : 1;
  const props = {}; d.items.forEach((i) => { props[i.addedBy] = (props[i.addedBy] || 0) + 1; });
  const pTop = Object.keys(props).map((u) => [u, props[u]]).sort((a, b) => b[1] - a[1]);
  const pMax = pTop.length ? pTop[0][1] : 1;
  const hit = Object.keys(props).map((u) => {
    const rr = [];
    d.items.filter((i) => i.addedBy === u).forEach((i) => Object.keys(i.participants).forEach((k) => { const p = i.participants[k]; if (p.rating) rr.push(p.rating); }));
    return { u:u, n: rr.length ? rr.reduce((a, b) => a + b, 0) / rr.length : 0 };
  }).filter((x) => x.n).sort((a, b) => b.n - a.n);
  const pairs = [];
  d.users.forEach((a, i) => d.users.slice(i + 1).forEach((b) => {
    const diffs = [];
    d.items.forEach((it) => { const pa = it.participants[a.id], pb = it.participants[b.id];
      if (pa && pb && pa.rating && pb.rating) diffs.push(Math.abs(pa.rating - pb.rating)); });
    if (diffs.length) pairs.push({ a:a, b:b, n: diffs.reduce((x, y) => x + y, 0) / diffs.length });
  }));
  pairs.sort((x, y) => x.n - y.n);
  const years = ['all'].concat([].concat.apply([], d.items.map((i) => Object.keys(i.participants).map((k) => i.participants[k].finishedAt && new Date(i.participants[k].finishedAt).getFullYear())))
    .filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => b - a).map(String));
  const total = series + movies || 1;
  const ringA = Math.round((series / total) * 100);

  const bar = (label, value, pct, c) => '<div class="srow" style="--c:' + c + '"><b>' + label + '</b><i><u style="width:' + pct + '%"></u></i><em>' + value + '</em></div>';
  const block = (title, rowsH, note) => '<div class="b" style="margin-top:10px"><div class="lbl">' + title + '</div>'
    + '<div style="display:flex;flex-direction:column;gap:9px;margin-top:11px">' + rowsH + '</div>'
    + (note ? '<div style="font-size:12.5px;color:var(--text-dim);font-weight:600;margin-top:11px" class="pretty">' + esc(note) + '</div>' : '') + '</div>';

  return '<div style="display:flex;align-items:center;gap:10px">'
    + '<div class="stitle" style="flex:1">estadísticas</div>'
    + '<div style="display:flex;background:#ffffff0f;border-radius:999px;padding:3px">'
    + [['me','mías'],['group','del grupo']].map((s) => '<button class="pill" style="background:' + (S.statScope === s[0] ? 'var(--wish)' : 'transparent') + ';color:' + (S.statScope === s[0] ? '#2A2016' : 'var(--text-dim)') + '" data-a="s.scope:' + s[0] + '">' + s[1] + '</button>').join('')
    + '</div></div>'
    + '<div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">'
    + years.map((y) => '<button class="pill" style="background:' + (year === y ? soft('var(--done)', 20) : '#ffffff0d') + ';color:' + (year === y ? 'var(--done)' : 'var(--text-dim)') + '" data-a="s.year:' + y + '">' + (y === 'all' ? 'todo' : y) + '</button>').join('')
    + '</div>'
    + '<div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:14px">'
    + [['terminadas', series + movies, series + ' series y ' + movies + ' pelis', 'var(--done)'],
       ['horas vistas', hours + ' h', human, 'var(--watching)'],
       ['nota media', avg ? nfmt(avg) : '–', rated.length + ' puntuaciones puestas', 'var(--wish)']]
      .map((b) => '<div class="stat" style="--c:' + b[3] + '"><div class="lbl">' + b[0] + '</div><b>' + b[1] + '</b><p>' + esc(b[2]) + '</p></div>').join('')
    + '</div>'
    + '<div class="b" style="margin-top:10px"><div class="lbl">series y pelis terminadas</div>'
    + '<div style="display:flex;align-items:center;gap:16px;margin-top:10px">'
    + '<svg width="104" height="104" viewBox="0 0 42 42" aria-hidden="true" style="flex:none">'
    + '<circle cx="21" cy="21" r="15.9" fill="none" stroke="#ffffff14" stroke-width="7"/>'
    + '<circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--done)" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + ringA + ' ' + (100 - ringA) + '" stroke-dashoffset="25" transform="rotate(-90 21 21)"/></svg>'
    + '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">'
    + [['📺 series', series, ringA, 'var(--done)'], ['🎬 pelis', movies, 100 - ringA, 'var(--wish)']].map((s) =>
        '<div><div style="display:flex;align-items:baseline;gap:7px"><span style="font-size:13px;font-weight:800">' + s[0] + '</span>'
        + '<span style="font-size:12px;color:var(--text-dim);font-weight:700">' + s[1] + '</span></div>'
        + '<div class="bar" style="--c:' + s[3] + ';height:8px"><i style="width:' + s[2] + '%"></i></div></div>').join('')
    + '</div></div></div>'
    + block('géneros que más caen', gTop.map((g) => bar(esc(g[0]), g[1], Math.round((g[1] / gMax) * 100), 'var(--watching)')).join(''),
        gTop.length ? 'lo vuestro es ' + gTop[0][0].toLowerCase() : 'aún no hay nada terminado')
    + block('quién propone más', pTop.map((p) => bar(user(p[0]).emoji + ' ' + esc(user(p[0]).name), p[1], Math.round((p[1] / pMax) * 100), soft(user(p[0]).color, 85))).join(''),
        hit.length ? 'a quien mejor le sale: ' + user(hit[0].u).name + ' ' + user(hit[0].u).emoji + ' (media ' + nfmt(hit[0].n) + ')' : null)
    + block('mejor y peor paradas',
        [best ? bar('🏆 ' + esc(best.item.title.slice(0, 22)), STARS(best.p.rating), 100, 'var(--done)') : '',
         worst ? bar('🥀 ' + esc(worst.item.title.slice(0, 22)), STARS(worst.p.rating), Math.round((worst.p.rating / 5) * 100), 'var(--dropped)') : ''].join(''),
        dropped.length ? dropped.length + ' dejadas a medias, normalmente sobre el episodio ' + (dropEp.length ? Math.round(dropEp.reduce((a, b) => a + b, 0) / dropEp.length) : '?') : 'ni una abandonada, qué disciplina')
    + (pairs.length ? block('quién coincide con quién',
        pairs.slice(0, 4).map((p) => bar(p.a.emoji + p.b.emoji + ' ' + esc(p.a.name), nfmt(5 - p.n * 1.5), Math.round(clamp((1 - p.n / 3) * 100, 6, 100)), soft(p.a.color, 80))).join(''),
        'arriba los que más se parecen; ' + pairs[pairs.length - 1].a.name + ' y ' + pairs[pairs.length - 1].b.name + ' es donde salta la discusión') : '');
}

/* ── pintado por zonas ────────────────────────────────────────────────────────
   Esto era un innerHTML del documento entero en cada cambio de estado, y hacía
   dos cosas malas: reproducía la animación de entrada de todas las tarjetas —que
   nacen con opacity 0, o sea un parpadeo en toda regla— y tiraba el foco y el
   scroll. Ahora cada zona recuerda el HTML que pintó y sólo toca el DOM si ha
   cambiado de verdad. Quieto en la pantalla, el repaso de cada minuto ya no
   mueve un solo nodo.                                                          */
const ZONAS = ['rhead', 'rmain', 'rnav', 'rfloat', 'rsheet'];
const pintado = {};
let vistas = {};          /* tarjetas que ya estaban en el repintado anterior */
let hojaPintada = null;   /* qué hoja había abierta, para animarla sólo al abrir */

function zonas(){
  if (!S.data) return { rhead:headerHtml(), rmain:bootHtml(), rnav:'', rfloat:'', rsheet:'' };
  /* Con una invitación en la mano SIEMPRE hay que preguntar quién eres, aunque
     ya estés dentro de otro club: si no, entrar en un segundo club desde un
     móvil que ya tiene uno es imposible y la invitación se pierde en silencio.
     Las redundantes ya las ha descartado el Api antes de llegar aquí.          */
  const needsWelcome = (Api.hayInvitacion && Api.hayInvitacion())
    || !S.data.me || !S.data.users.some((u) => u.id === S.data.me);
  if (needsWelcome && (!S.sheet || S.sheet.kind !== 'welcome')){ S.sheet = { kind:'welcome' }; S.pila = []; }
  if (needsWelcome && !S.prof){
    const rec = Api.perfilDelDispositivo ? Api.perfilDelDispositivo() : null;
    S.prof = rec ? { name:rec.name, emoji:rec.emoji, color:rec.color } : { name:'', emoji:'🐻', color:PALETTE[0] };
    S.profRec = !!rec;
  }
  return {
    rhead: headerHtml(),
    rmain: (Api.isDemo() ? '<div class="banner">estás en <b>modo demo</b> con datos de ejemplo: nada se guarda. Abre el enlace de tu club para entrar de verdad.</div>' : '')
      + (Api.authFailed() ? '<div class="banner" style="color:var(--bad);background:color-mix(in oklab,#FF6B8A 14%,var(--surface))">tu clave ya no vale: puede que te hayan sacado del club o que se haya generado otra. Pide un enlace nuevo.</div>' : '')
      + (S.booting ? bootHtml() : boardHtml()),
    rnav: navHtml()
      + '<button class="fab desk" data-a="add"><span style="font-size:26px;line-height:1;margin-top:-2px">+</span> Añadir un título</button>',
    rfloat: floatHtml(),
    rsheet: sheetHtml(),
  };
}
let rafPending = false;
function render(){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    document.documentElement.setAttribute('data-theme', S.theme === 'malva' ? '' : S.theme);
    const z = zonas();
    const act = document.activeElement;
    const fid = act && act.id ? act.id : null;
    const ss = fid ? act.selectionStart : null, se = fid ? act.selectionEnd : null;
    const scr = document.querySelector('[data-sheet] .scroll');
    const scrTop = scr ? scr.scrollTop : 0;

    let algo = false;
    for (const id of ZONAS){
      if (pintado[id] === z[id]) continue;          /* esta zona no ha cambiado */
      pintado[id] = z[id];
      document.getElementById(id).innerHTML = z[id];
      algo = true;
    }
    if (!algo) return;

    const kind = S.sheet ? S.sheet.kind : null;
    if (kind && kind !== hojaPintada){
      /* recién abierta: que se deslice. La clase va aquí y no en el HTML para
         que no forme parte de lo que se compara arriba */
      const ov = document.querySelector('.ov'), sh = document.querySelector('[data-sheet]');
      if (ov) ov.classList.add('anim');
      if (sh) sh.classList.add('anim');
    } else if (kind && scrTop){
      /* seguía abierta: no la mandes otra vez al principio */
      const el = document.querySelector('[data-sheet] .scroll');
      if (el) el.scrollTop = scrTop;
    }
    hojaPintada = kind;

    vistas = {};
    document.querySelectorAll('[data-card]').forEach((e) => { vistas[e.dataset.card] = 1; });

    if (fid){
      const el = document.getElementById(fid);
      if (el && el !== document.activeElement){
        el.focus({ preventScroll:true });
        try { if (ss != null) el.setSelectionRange(ss, se); } catch(e){}
      }
    }
  });
}

/* ── acciones ── */
/* ── navegación entre hojas ───────────────────────────────────────────────────
   Cada hoja abierta empuja una entrada en el historial, así que el botón atrás
   del móvil cierra la hoja en vez de sacarte de la aplicación. Quien manda sobre
   cuántas hay abiertas es el historial: al volver, «popstate» dice a qué
   profundidad hay que quedarse y la pila se recorta hasta ahí. Por eso cerrar
   nunca toca el estado a mano — pide un paso atrás y deja que llegue.          */
function abrirHoja(sheet, extra, apilar){
  if (apilar && S.sheet) S.pila.push(S.sheet);
  else S.pila = [];
  history.pushState({ sc: S.pila.length + 1 }, '');
  setS(Object.assign({ sheet:sheet }, extra || {}));
}
const profundidad = () => S.pila.length + (S.sheet ? 1 : 0);
const closeSheet = () => {
  const n = profundidad();
  if (n > 0) history.go(-n);
  else setS({ sheet:null, pila:[], confirmAsk:null });
};
/* recorta la pila hasta la profundidad que pide el historial. Aparte porque es
   lo único de todo esto que se puede probar sin navegador. */
function recortarPila(sheet, pila, objetivo){
  let prof = pila.length + (sheet ? 1 : 0);
  while (prof > objetivo){ sheet = pila.pop() || null; prof--; }
  return { sheet:sheet, pila:pila };
}
window.addEventListener('popstate', (e) => {
  const objetivo = (e.state && e.state.sc) || 0;
  if (profundidad() <= objetivo) return;
  const r = recortarPila(S.sheet, S.pila, objetivo);
  S.sheet = r.sheet; S.pila = r.pila;
  setS({ confirmAsk:(S.sheet && S.sheet.kind === 'confirm') ? S.confirmAsk : null });
});

function move(key, to, rect){
  const k = parseKey(key), it = findItem(k.itemId); if (!it) return;
  const users = groupUsers(it, k.status, k.order);
  if (to === 'done' && rect) rain(rect);
  flash([k.itemId + '|' + to], 'land');
  call(() => Api.setStatus(k.itemId, users, to), it.title + ' → ' + COL(to).label);
  if (S.isMobile && S.tab !== to) setS({ tab:to });
}
function shift(key, dir, rect){
  const flow = ['wish','watching','done'];
  const st = parseKey(key).status;
  const i = flow.indexOf(st);
  if (i < 0){ move(key, dir > 0 ? 'watching' : 'wish', rect); return; }
  const j = clamp(i + dir, 0, flow.length - 1);
  if (j === i){ toast(dir > 0 ? 'ya está en Terminado 🎉' : 'no hay nada antes de Nos apetece'); return; }
  move(key, flow[j], rect);
}
function bumpProgress(itemId, users, dir, rect){
  const it = findItem(itemId); if (!it) return;
  const p = it.participants[users[0]]; if (!p) return;
  const next = step(it, p.progress, dir);
  if (next === 'end'){
    if (rect) rain(rect);
    call(() => Api.setStatus(itemId, users, 'done'), it.title + ' terminada');
    toast('¡' + it.title + ' terminada! ✨ ponedle nota cuando queráis');
    return;
  }
  call(() => Api.setProgress(itemId, users, next));
}
function confirmYes(){
  const a = S.confirmAsk; if (!a) return;
  setS({ sheet:null, confirmAsk:null });
  if (a.kind === 'del'){
    setS({ pendingDel:a.itemId });
    const t = setTimeout(() => { setS({ pendingDel:null }); call(() => Api.removeItem(a.itemId)); }, 6000);
    toast('«' + a.title + '» fuera del tablero', 'deshacer', () => { clearTimeout(t); setS({ pendingDel:null, toast:null }); });
  } else if (a.kind === 'user'){
    call(() => Api.removeUser(a.userId), 'ya no está en el tablero');
  } else if (a.kind === 'leave'){
    Api.salirDeClub(a.secret);
  }
}
let searchDeb = null, searchAC = null;
function onSearchInput(q){
  S.addQ = q; S.addPick = null;
  clearTimeout(searchDeb);
  if (searchAC) searchAC.abort();
  if (!q.trim()){ setS({ addResults:null, addSearching:false }); return; }
  setS({ addSearching:true });
  searchDeb = setTimeout(() => {
    searchAC = new AbortController();
    Api.searchTitles(q, { signal:searchAC.signal })
      .then((r) => setS({ addResults:r, addSearching:false }))
      .catch((err) => { if (err.name !== 'AbortError'){ setS({ addSearching:false, addResults:[] }); if (err.code === 'no-tmdb') toast('falta la clave de TMDB'); } });
  }, 240);
}
let spinT = null;
function spin(){
  const cands = candidates();
  const r = Object.assign({}, S.roul);
  const pool = cands.length > 1 ? cands.filter((c) => c.item.id !== r.last) : cands;
  if (!pool.length){ setS({ roul:Object.assign(r, { spinning:false, result:null, nothing:true }) }); return; }
  let total = pool.reduce((a, c) => a + c.w, 0), pick = Math.random() * total, chosen = pool[0];
  for (const c of pool){ pick -= c.w; if (pick <= 0){ chosen = c; break; } }
  setS({ roul:Object.assign(r, { spinning:true, result:null, nothing:false, frame:Api.imageUrl(pool[0].item.poster, 'lg') }) });
  let i = 0;
  clearInterval(spinT);
  /* diez carátulas por segundo no son diez repintados del documento: se cambia
     la imagen del elemento y ya. La URL la valida imageUrl y la CSP sólo deja
     cargar de image.tmdb.org, así que no hay por dónde colar nada. */
  spinT = setInterval(() => {
    i++;
    const el = document.querySelector('[data-spin]');
    if (!el) return;
    const u = Api.imageUrl(pool[i % pool.length].item.poster, 'lg');
    el.style.backgroundImage = u ? 'url("' + u + '")' : '';
  }, 95);
  setTimeout(() => {
    clearInterval(spinT);
    setS({ roul:Object.assign({}, S.roul, { spinning:false, result:chosen.item.id, last:chosen.item.id, weight:chosen.w }) });
    buzz(14);
  }, 1750);
}
async function saveProfile(finish){
  const p = S.prof;
  if (!p || !p.name.trim()){ toast(finish ? 'ponte un nombre, aunque sea inventado' : 'ponle un nombre, aunque sea inventado'); return; }
  /* con una invitación en la mano, entrar significa canjearla: el Worker crea tu
     persona y te devuelve TU secreto, distinto del de todos los demás */
  if (finish && Api.hayInvitacion()){
    setS({ saveState:'saving' });
    try {
      await Api.unirse(p);
      closeSheet();
      toast('bienvenida/o al club, ' + p.name + ' ' + p.emoji);
    } catch(e){
      setS({ saveState:'idle' });
      toast(e.code === 'invitacion-invalida'
        ? 'esa invitación ya se usó o ha caducado. Pide otra 🙈'
        : 'no he podido entrar (・_・;) ¿probamos otra vez?', 'reintentar', () => saveProfile(true));
    }
    return;
  }
  if (finish) closeSheet(); else setS({ saveState:'saving' });
  const r = await call(() => Api.updateProfile(p), 'perfil guardado');
  if (r === null){ setS({ saveState:'idle' }); return; }
  if (!finish){ setS({ saveState:'done' }); setTimeout(() => setS({ saveState:'idle' }), 2000); }
  toast((finish ? 'bienvenida/o, ' : 'perfil guardado: ') + p.name + ' ' + p.emoji);
}
async function copyInvite(){
  const txt = S.invite;
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch(e){
    try {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); document.body.removeChild(ta);
    } catch(e2){ ok = false; }
  }
  if (ok){ setS({ copyState:'done' }); toast('enlace copiado al portapapeles 💌'); setTimeout(() => setS({ copyState:'idle' }), 2200); }
  else toast('cópialo a mano de ahí arriba, el navegador no me deja tocar el portapapeles');
}

let blockClick = 0;
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const raw = el.dataset.a;
  const i = raw.indexOf(':');
  const verb = i < 0 ? raw : raw.slice(0, i);
  const arg = i < 0 ? null : raw.slice(i + 1);

  /* «close» es el fondo oscuro y por eso ignora los toques de dentro; el botón
     de la esquina vive dentro de la hoja y necesita verbos propios */
  if (verb === 'cerrar'){ closeSheet(); return; }
  if (verb === 'atras'){ history.back(); return; }
  if (verb === 'close'){ if (e.target.closest('.sheet')) return; closeSheet(); return; }
  if (Date.now() - blockClick < 320 && el.closest('[data-card]')) return;
  e.stopPropagation();

  const cardEl = el.closest('[data-card]');
  const ck = cardEl && parseKey(cardEl.dataset.card);
  const it = ck && findItem(ck.itemId);
  const users = it ? groupUsers(it, ck.status, ck.order) : [];
  const rect = cardEl ? cardEl.getBoundingClientRect() : null;
  const me = meId();

  switch (verb){
    /* cabecera y navegación */
    case 'sync': if (Api.isDemo()) toast('esto es la demo: abre el enlace con las claves para conectar vuestro tablero'); else Api.retry(); break;
    case 'filters': abrirHoja({ kind:'filters' }, { fd:Object.assign({}, S.f) }); break;
    case 'roulette': openRoulette(); break;
    case 'stats': abrirHoja({ kind:'stats' }); break;
    case 'settings': openSettings(); break;
    case 'add': openAdd(); break;
    case 'tab': setS({ tab:arg }); break;
    case 'collapse': if (arg === 'dropped' && !S.isMobile) setS({ collapsed:!S.collapsed }); break;
    case 'nav':
      if (arg === 'board') closeSheet();
      else if (arg === 'add') openAdd();
      else if (arg === 'roulette') openRoulette();
      else if (arg === 'stats') abrirHoja({ kind:'stats' });
      else if (arg === 'settings') openSettings();
      break;
    case 'toastact': { const t = S.toast; if (t && t.action) t.action(); setS({ toast:null }); break; }
    case 'confirmyes': confirmYes(); break;
    case 'theme': S.theme = arg; try { localStorage.setItem(LS.theme, arg); } catch(err){} render(); break;

    /* quitar filtros */
    case 'rm': {
      const parts = arg.split(':'), what = parts[0], v = parts[1];
      if (what === 'all'){ setS({ q:'', f:Object.assign({}, F0), fd:null }); break; }
      if (what === 'q'){ setS({ q:'' }); break; }
      const f = Object.assign({}, S.f, { provs:S.f.provs.slice(), by:S.f.by.slice(), who:S.f.who.slice() });
      if (what === 'type') f.type = null;
      else if (what === 'avail') f.avail = false;
      else if (what === 'hype') f.hypeUser = null;
      else if (what === 'who') f.who = f.who.filter((x) => x !== v);
      else if (what === 'prov') f.provs = f.provs.filter((x) => x !== v);
      else if (what === 'by') f.by = f.by.filter((x) => x !== v);
      setS({ f:f, fd:null });
      break;
    }

    /* tarjeta */
    case 'hype': call(() => Api.setHype(ck.itemId, me, +arg)); break;
    case 'plus': bumpProgress(ck.itemId, users, 1, rect); break;
    case 'minus': bumpProgress(ck.itemId, users, -1, rect); break;
    case 'rplus': bumpProgress(ck.itemId, arg.split(','), 1, rect); break;
    case 'rminus': bumpProgress(ck.itemId, arg.split(','), -1, rect); break;
    case 'seen': move(cardEl.dataset.card, 'done', rect); break;
    case 'open': openDetail(cardEl.dataset.card); break;

    /* detalle */
    case 'd.to': {
      const k = parseKey(S.sheet.key);
      flash([k.itemId + '|' + arg], 'land');
      call(() => Api.setStatus(k.itemId, [me], arg), 'te he movido a ' + COL(arg).label);
      setTimeout(() => { const x = findItem(k.itemId); const p = x && x.participants[me];
        if (p) setS({ sheet:{ kind:'detail', key:k.itemId + '|' + p.status + '|' + p.order } }); }, 30);
      break;

    case 'd.rate': {
      const k = parseKey(S.sheet.key);
      call(() => Api.setRating(k.itemId, me, +arg));

    case 'd.send': {
      const t = S.noteDraft.trim(); if (!t) break;

    /* añadir */
    case 'a.pick': {

      if (have && have.participants[me]){ toast('ya lo tienes en ' + COL(have.participants[me].status).label); break; }

    case 'f.apply': setS({ f:S.fd || S.f, fd:null, sheet:null }); say('filtros aplicados'); break;
    default: {
      if (verb.indexOf('f.') === 0){
