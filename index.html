        f.provs = f.provs.slice(); f.by = f.by.slice(); f.who = f.who.slice();
        const tog = (arr, v) => arr.includes(v) ? arr.filter((x) => x !== v) : arr.concat([v]);
        const w = verb.slice(2);
        if (w === 't') f.type = f.type === arg ? null : arg;
        else if (w === 'mine') f.who = (f.who.length === 1 && f.who[0] === me) ? [] : [me];
        else if (w === 'who') f.who = tog(f.who, arg);
        else if (w === 'avail') f.avail = !f.avail;
        else if (w === 'prov') f.provs = tog(f.provs, arg);
        else if (w === 'hu') f.hypeUser = f.hypeUser === arg ? null : arg;
        else if (w === 'hm'){ f.hypeMin = +arg; if (!f.hypeUser) f.hypeUser = 'any'; }
        else if (w === 'by') f.by = tog(f.by, arg);
        setS({ fd:f });
        break;
      }
      if (verb.indexOf('r.') === 0){
        const r = Object.assign({}, S.roul);
        const w = verb.slice(2);
        if (w === 'user') r.users = r.users.includes(arg) ? r.users.filter((u) => u !== arg) : r.users.concat([arg]);
        else if (w === 'time') r.time = r.time === +arg ? null : (+arg || null);
        else if (w === 'kind') r.kind = arg;
        else if (w === 'prov') r.provs = r.provs.includes(arg) ? r.provs.filter((p) => p !== arg) : r.provs.concat([arg]);
        else if (w === 'spin'){ spin(); break; }

        setS({ roul:r });

      }
      if (verb === 's.scope'){ setS({ statScope:arg }); break; }
      if (verb === 's.year'){ setS({ statYear:arg }); break; }
      if (verb.indexOf('p.') === 0){
        const w = verb.slice(2), p = S.prof || {};
        if (w === 'emoji') setS({ prof:Object.assign({}, p, { emoji:arg }) });
        else if (w === 'color') setS({ prof:Object.assign({}, p, { color:decodeURIComponent(arg) }) });
        else if (w === 'save') saveProfile(false);
        else if (w === 'finish') saveProfile(true);
        else if (w === 'welcome') setS({ sheet:{ kind:'welcome' }, pila:[], profRec:false, prof:{ name:'', emoji:'🐻', color:PALETTE[0] } });
        else if (w === 'rmuser') abrirHoja({ kind:'confirm' }, { confirmAsk:{ kind:'user', userId:arg, name:user(arg).name } }, true);
        else if (w === 'copy') copyInvite();
        else if (w === 'forget') Api.olvidarDispositivo();
        else if (w === 'clubs') abrirHoja({ kind:'clubs' }, { nuevoClub:'', creando:false });
        else if (w === 'crear'){
          if (S.creando) break;
          /* norm() ya quita los acentos, con el rango de diacríticos escapado.

          const n = norm(String(S.nuevoClub || '').trim()).replace(/\s+/g, '-');
          if (!/^[a-z0-9][a-z0-9-]{1,30}$/.test(n)){ toast('el nombre va en minúsculas, sin espacios ni acentos, de 2 a 31 letras'); break; }

    }
  }

/* ── gestos (Pointer Events, ratón y dedo con el mismo código) ──────────────────
   Ninguno pasa por el pintado. Antes cada pointermove reconstruía el documento
   entero —unas sesenta veces por segundo mientras deslizas una tarjeta—, así que
   ahora el gesto escribe el estilo del elemento que se mueve y el estado sólo se
   entera al soltar, que es cuando de verdad ha pasado algo.                     */
function pintarDeslizamiento(card, dx){
  if (!card) return;
  card.style.transform = dx ? 'translateX(' + dx + 'px)' : '';
  card.style.transition = dx ? 'none' : '';
  const hint = card.parentElement && card.parentElement.querySelector('[data-swipe]');
  if (!hint || !card.dataset.card) return;
  const fi = ['wish','watching','done'].indexOf(parseKey(card.dataset.card).status);
  const nxt = COL(['wish','watching','done'][clamp(fi + 1, 0, 2)]);
  const prv = COL(['wish','watching','done'][clamp(fi - 1, 0, 2)]);
  const on = Math.abs(dx) > 4;
  hint.style.opacity = on ? '1' : '0';
  hint.style.background = on ? soft(dx > 0 ? nxt.v : prv.v, 26) : '';
  hint.children[0].style.opacity = dx < 0 ? '1' : '0';
  hint.children[1].style.opacity = dx > 0 ? '1' : '0';
}
const marcarColumna = (key) => document.querySelectorAll('[data-dropline]').forEach((el) => {
  const col = el.closest('[data-col]');
  el.classList.toggle('on', !!col && col.dataset.col === key);
});
const marcarDock = (key) => document.querySelectorAll('[data-dockt]').forEach((el) => {
  el.classList.toggle('over', el.dataset.dockt === key);
});

let G = null, lpT = null, moved = false;
function detach(){ window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); window.removeEventListener('pointercancel', onUp); }
function endGesture(){
  clearTimeout(lpT); detach();
  if (G && G.mode === 'swipe') pintarDeslizamiento(G.el, 0);
  G = null;
  if (S.drag || S.dock) setS({ drag:null, dock:null });
}
document.addEventListener('pointerdown', (e) => {
  const handle = e.target.closest('[data-handle]');
  if (handle){
    const y0 = e.clientY;
    const hoja = handle.closest('[data-sheet]');
    if (hoja) hoja.style.transition = 'none';
    const mv = (ev) => { if (hoja) hoja.style.transform = 'translateY(' + Math.max(0, ev.clientY - y0) + 'px)'; };
    const up = (ev) => {
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up);
      if (hoja){ hoja.style.transition = ''; hoja.style.transform = ''; }
      if (Math.max(0, ev.clientY - y0) > 90) closeSheet();
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
    return;
  }
  const cardEl = e.target.closest('[data-card]');
  if (cardEl){
    if (e.button > 0 || e.target.closest('[data-a]')) return;
    G = { key:cardEl.dataset.card, el:cardEl, dx:0, x0:e.clientX, y0:e.clientY, r:cardEl.getBoundingClientRect(), mode:null };
    moved = false;
    window.addEventListener('pointermove', onMove, { passive:false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    if (S.isMobile){
      lpT = setTimeout(() => {
        if (!G || G.mode) return;
        G.mode = 'dock'; moved = true; buzz(12); G.over = null;
        setS({ dock:{ key:G.key } });
        /* el dock se pinta en el fotograma siguiente: medirlo antes daría nada */
        requestAnimationFrame(() => { if (G) G.docks = [...document.querySelectorAll('[data-dockt]')].map((el) => ({ key:el.dataset.dockt, r:el.getBoundingClientRect() })); });
      }, 350);
    }
    return;
  }
  /* deslizar el fondo cambia de pestaña */
  const board = e.target.closest('[data-board]');
  if (board && S.isMobile && !e.target.closest('[data-a]')){
    const x0 = e.clientX, y0 = e.clientY; let done = false;
    const mv = (ev) => {
      if (done) return;
      const dx = ev.clientX - x0, dy = ev.clientY - y0;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4){
        done = true;
        const i = CK.indexOf(S.tab), j = clamp(i + (dx < 0 ? 1 : -1), 0, CK.length - 1);
        if (j !== i){ setS({ tab:CK[j] }); buzz(6); }
        up();
      }
    };
    const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', mv, { passive:true });
    window.addEventListener('pointerup', up);
  }
});
function onMove(e){
  if (!G) return;
  const dx = e.clientX - G.x0, dy = e.clientY - G.y0;
  if (!G.mode){
    if (Math.abs(dx) < 9 && Math.abs(dy) < 9) return;
    clearTimeout(lpT);
    if (!S.isMobile){
      G.mode = 'drag';
      const k = parseKey(G.key), it = findItem(k.itemId); if (!it){ endGesture(); return; }
      const us = groupUsers(it, k.status, k.order), c = COL(k.status).v;
      /* los rectángulos de las columnas se miden una vez, no en cada movimiento */
      G.cols = [...document.querySelectorAll('[data-col]')].map((el) => ({ key:el.dataset.col, r:el.getBoundingClientRect() }));
      G.over = k.status;
      setS({ drag:{ key:G.key, w:G.r.width, x:G.r.left, y:G.r.top, ox:G.x0 - G.r.left, oy:G.y0 - G.r.top,
        over:k.status, c:c, title:it.title, ini:it.title.slice(0, 2).toUpperCase(),
        who: us.map((u) => user(u).emoji).join(' ') + ' ' + (us.length > 1 ? us.length + ' personas' : user(us[0]).name) } });
    }
    else if (Math.abs(dx) > Math.abs(dy) * 1.25) G.mode = 'swipe';
    else { endGesture(); return; }
  }
  moved = true;
  if (G.mode === 'swipe'){
    e.preventDefault();
    G.dx = clamp(dx, -150, 150);
    pintarDeslizamiento(G.el, G.dx);
  }
  else if (G.mode === 'drag'){
    e.preventDefault();
    let over = null;
    (G.cols || []).forEach((c) => { if (e.clientX >= c.r.left && e.clientX <= c.r.right) over = c.key; });
    const ghost = document.querySelector('[data-ghost]');
    if (ghost) ghost.style.translate = (e.clientX - S.drag.ox) + 'px ' + (e.clientY - S.drag.oy) + 'px';
    if (over && over !== G.over){
      G.over = over;
      marcarColumna(over !== parseKey(G.key).status ? over : null);
    }
  }
  else if (G.mode === 'dock'){
    e.preventDefault();
    let over = null;
    (G.docks || []).forEach((d) => {
      if (e.clientX >= d.r.left - 4 && e.clientX <= d.r.right + 4 && e.clientY >= d.r.top - 30) over = d.key;
    });
    if (over !== G.over){ if (over) buzz(6); G.over = over; marcarDock(over); }
  }
}
function onUp(){
  if (!G){ endGesture(); return; }
  const mode = G.mode, key = G.key, r = G.r, el = G.el, dx = G.dx || 0, over = G.over;
  clearTimeout(lpT); detach(); G = null;
  if (mode === 'swipe'){
    const dir = dx > 80 ? 1 : dx < -80 ? -1 : 0;
    pintarDeslizamiento(el, 0);        /* vuelve a su sitio con su propia curva */
    if (dir){ buzz(10); shift(key, dir, r); }
  } else if (mode === 'drag'){
    setS({ drag:null });
    if (over && over !== parseKey(key).status) move(key, over, r);
  } else if (mode === 'dock'){
    setS({ dock:null });
    if (over && over !== parseKey(key).status){ buzz(10); move(key, over, r); }
  } else {
    endGesture();
    if (!moved) openDetail(key);
  }
  if (moved) blockClick = Date.now();
}
window.addEventListener('resize', () => {
  const m = window.innerWidth < 900;
  if (m !== S.isMobile) setS({ isMobile:m });
});

/* ── arranque ── */
(async function boot(){
  try { S.theme = localStorage.getItem(LS.theme) || 'neon'; } catch(e){ S.theme = 'neon'; }
  const cfg = readConfig();
  Api = createApi(cfg);
  Api.subscribe((data) => { S.data = data; S.sync = Api.getSyncStatus(); render(); });
  render();
  await Api.boot();
  S.data = Api.getState(); S.sync = Api.getSyncStatus();
  setTimeout(() => setS({ booting:false }), 700);
  /* si la invitación era para un club en el que ya estabas, no se canjea, pero
     tampoco se calla: abrir un enlace y que no pase nada es lo peor que hay */
  if (Api.invitacionSobraba && Api.invitacionSobraba()){
    setTimeout(() => toast('ya estabas en este club 🛋️ te he dejado como estabas'), 900);
  }
})();
</script>
