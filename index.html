/* ═══════════ TOKENS ═══════════ */
/* La base es Cosmos: los cuatro temas planos de antes se fueron, así que aquí
   ya no hay una paleta «por defecto» distinta de la que se ve. */
:root{
  --bg:#0B0817; --surface:#191233; --surface-2:#221846; --text:#F4EFFF; --text-dim:#9E93C9;
  --wish:#FFD86B; --watching:#FF4FA3; --done:#3DF5D0; --dropped:#9B7BFF;
  --spring:cubic-bezier(.34,1.56,.64,1); --ink:#140D26; --bad:#FF6B8A;
}
[data-theme="cosmos"]{ --bg:#0B0817; --surface:#191233; --surface-2:#221846; --text:#F4EFFF; --text-dim:#9E93C9;
  --wish:#FFD86B; --watching:#FF4FA3; --done:#3DF5D0; --dropped:#9B7BFF; --ink:#140D26; }
/* el cielo: dos nebulosas quietas y un campo de estrellas que se mueve muy
   despacio. Todo es CSS, no hay ni un nodo ni un fotograma de JavaScript.
   Y se tiñe de la columna en la que estás: el cielo dice dónde estás antes de
   que leas nada. Las cuatro nebulosas se cruzan con una transición larga. */
[data-theme="cosmos"]{ --neb1:#2C1A5E; --neb2:#4A1550; --st1:#FFB3E0; --st2:#C9B0FF; }
[data-theme="cosmos"][data-col="wish"]{ --neb1:#4A3410; --neb2:#5C2A16; --st1:#FFE08A; --st2:#FFC98A; }
[data-theme="cosmos"][data-col="watching"]{ --neb1:#3A1147; --neb2:#5C1440; --st1:#FF9ACF; --st2:#C9B0FF; }
[data-theme="cosmos"][data-col="done"]{ --neb1:#0E3D3A; --neb2:#123A52; --st1:#8CFFE4; --st2:#9BE8FF; }
[data-theme="cosmos"][data-col="dropped"]{ --neb1:#2A1B5E; --neb2:#3D1A5C; --st1:#C4A8FF; --st2:#9BE8FF; }
[data-theme="cosmos"] body,.escena[data-t="cosmos"]{background:
  radial-gradient(85% 45% at 50% -6%,color-mix(in oklab,var(--colc,var(--watching)) 26%,transparent) 0%,transparent 72%),
  radial-gradient(120% 80% at 10% -8%,var(--neb1) 0%,transparent 58%),
  radial-gradient(90% 60% at 98% 12%,var(--neb2) 0%,transparent 52%),var(--bg);
  background-attachment:fixed}
[data-theme="cosmos"] body::before,.escena[data-t="cosmos"]::before{content:'';position:fixed;inset:-20%;pointer-events:none;z-index:0;opacity:.9;
  background-image:
    radial-gradient(1.7px 1.7px at 12% 18%,var(--st2),transparent),
    radial-gradient(1.5px 1.5px at 34% 62%,var(--st1),transparent),
    radial-gradient(2px 2px at 68% 24%,var(--st1),transparent),
    radial-gradient(1.4px 1.4px at 82% 71%,var(--st2),transparent),
    radial-gradient(1.6px 1.6px at 24% 88%,var(--st1),transparent),
    radial-gradient(1.3px 1.3px at 54% 44%,#FFFFFF,transparent),
    radial-gradient(1.8px 1.8px at 91% 41%,var(--st1),transparent),
    radial-gradient(1.4px 1.4px at 6% 52%,#FFFFFF,transparent),
    radial-gradient(1.5px 1.5px at 44% 8%,var(--st2),transparent),
    radial-gradient(1.6px 1.6px at 74% 92%,var(--st1),transparent);
  animation:nebula 26s ease-in-out infinite alternate}
/* la cabecera deja ver el cielo teñido en vez de taparlo con gris */
[data-theme="cosmos"] header{background:color-mix(in oklab,var(--bg) 62%,transparent)}
[data-theme="cosmos"] nav{background:color-mix(in oklab,var(--bg) 82%,transparent)}
/* y las tarjetas de la columna llevan un punto de su color, para que el tema no
   dependa sólo del hueco entre tarjetas */
[data-theme="cosmos"] .card{background:linear-gradient(160deg,color-mix(in oklab,var(--c) 13%,color-mix(in oklab,var(--surface) 82%,transparent)),
    color-mix(in oklab,var(--surface) 72%,transparent));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
[data-theme="cosmos"] #app{position:relative;z-index:1}
html[data-theme] body{transition:background-color .45s ease}
[data-theme="cosmos"] .card{background:linear-gradient(160deg,#ffffff14,#ffffff07);
  box-shadow:inset 0 0 0 1px #ffffff1f,0 18px 40px -26px #000}
[data-theme="cosmos"] .b,[data-theme="cosmos"] .prow2,[data-theme="cosmos"] .stat{background:#ffffff0a}
/* Las hojas eran un bloque opaco de color plano encima del cielo y cortaban el
   tema en seco. Ahora son del mismo cristal que las tarjetas: dejan pasar la
   nebulosa desenfocada y se sostienen con un filo de luz arriba. */
[data-theme="cosmos"] .ov{background:color-mix(in oklab,#050310 74%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
[data-theme="cosmos"] .sheet{background:linear-gradient(180deg,color-mix(in oklab,#160E33 84%,transparent) 0%,color-mix(in oklab,#0A0719 92%,transparent) 100%);
  backdrop-filter:blur(26px) saturate(1.2);-webkit-backdrop-filter:blur(26px) saturate(1.2);
  box-shadow:inset 0 1px 0 #ffffff2e,inset 0 0 0 1px #ffffff14,0 -24px 70px -22px #000}
[data-theme="cosmos"] .footbar,[data-theme="cosmos"] .pickbar{background:color-mix(in oklab,#0E0922 62%,transparent);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 -1px 0 #ffffff1f}
[data-theme="cosmos"] .dock{background:linear-gradient(to top,color-mix(in oklab,#0E0922 88%,transparent),transparent)}
[data-theme="cosmos"] .toast>div{background:color-mix(in oklab,#150E31 86%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px #ffffff1f,0 22px 50px -18px #000}
[data-theme="cosmos"] .handle i{background:#ffffff4d}
@keyframes nebula{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-14px,-22px,0) scale(1.04)}}

/* ═══ COMETA · cintas de luz (WebGL) ═══
   Éste no se pinta con degradados: es un shader. El lienzo va detrás de todo,
   no recibe toques y se apaga solo si el móvil pide menos animación o si la
   tarjeta gráfica no da. Sin librerías: la app sigue siendo un archivo. */
[data-theme="cometa"]{ --bg:#050510; --surface:#111132; --surface-2:#181842; --text:#F2F0FF; --text-dim:#9B98C8;
  --wish:#FFD98A; --watching:#FF7FD1; --done:#7CF5DC; --dropped:#A99BFF; --ink:#0B0A1E; }
[data-theme="cometa"] body,.escena[data-t="cometa"]{background:linear-gradient(#080716 0%,#050510 60%,#03030A 100%);background-attachment:fixed}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
[data-theme="cometa"] #fx{display:block;opacity:.9}
[data-theme="cometa"]:has(.page) #fx{opacity:.5}
[data-theme="cometa"] #app{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){#fx{display:none!important}}

/* ═══ MAREA · fondo marino ═══ */
[data-theme="marea"]{ --bg:#04141C; --surface:#0A2331; --surface-2:#0F2E40; --text:#E8F8FF; --text-dim:#84AEC2;
  --wish:#FFD98A; --watching:#4FDCEC; --done:#68E9A6; --dropped:#9FBBFF; --ink:#04222C;
  --f1:#0B3A4E; --f2:#062431; --p1:#7FE7FF; --p2:#BFF4FF; }
[data-theme="marea"][data-col="wish"]{ --f1:#3F3517; --f2:#2A2A16; --p1:#FFE3A0; --p2:#FFF2CF }
[data-theme="marea"][data-col="watching"]{ --f1:#0B3A4E; --f2:#062431; --p1:#7FE7FF; --p2:#BFF4FF }
[data-theme="marea"][data-col="done"]{ --f1:#0C4438; --f2:#062A26; --p1:#8CFFCB; --p2:#CFFFE9 }
[data-theme="marea"][data-col="dropped"]{ --f1:#1B2C55; --f2:#101B34; --p1:#B9CBFF; --p2:#E1E8FF }
[data-theme="marea"] body,.escena[data-t="marea"]{background:
  radial-gradient(90% 50% at 50% -10%,color-mix(in oklab,var(--colc,var(--watching)) 26%,transparent),transparent 70%),
  linear-gradient(var(--f1) 0%,var(--f2) 55%,#020C13 100%);background-attachment:fixed}
[data-theme="marea"] body::before,.escena[data-t="marea"]::before{content:'';position:fixed;inset:-25%;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(5px 5px at 14% 88%,var(--p1),transparent),
    radial-gradient(3px 3px at 32% 72%,var(--p2),transparent),
    radial-gradient(6px 6px at 61% 94%,var(--p1),transparent),
    radial-gradient(4px 4px at 82% 66%,var(--p2),transparent),
    radial-gradient(3px 3px at 46% 55%,var(--p1),transparent),
    radial-gradient(5px 5px at 91% 84%,var(--p2),transparent);
  animation:burbujas 15s linear infinite}
/* la luz de la superficie: manchas anchas y desenfocadas que se mecen, en vez
   de rayas de 2 px que competían con el texto */
[data-theme="marea"] body::after,.escena[data-t="marea"]::after{content:'';position:fixed;inset:-15%;pointer-events:none;z-index:0;opacity:.22;
  filter:blur(38px);
  background:
    radial-gradient(38% 16% at 22% 18%,var(--p1) 0%,transparent 70%),
    radial-gradient(30% 12% at 68% 34%,var(--p2) 0%,transparent 70%),
    radial-gradient(44% 14% at 46% 72%,var(--p1) 0%,transparent 72%);
  animation:caustica 14s ease-in-out infinite alternate}
@keyframes burbujas{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(10px,-260px,0)}}
@keyframes caustica{0%{transform:translate3d(-26px,-10px,0) scale(1)}100%{transform:translate3d(26px,14px,0) scale(1.12)}}

/* ═══ BRASA · atardecer ═══ */
[data-theme="brasa"]{ --bg:#170B12; --surface:#2A1520; --surface-2:#371B29; --text:#FFF1E8; --text-dim:#C89A97;
  --wish:#FFC46B; --watching:#FF6E93; --done:#7FE3BE; --dropped:#C98BFF; --ink:#2A1016;
  --f1:#20101A; --s1:#FF9F5A; --s2:#FF5E7E55 }
[data-theme="brasa"][data-col="wish"]{ --f1:#2A1A0F; --s1:#FFC46B; --s2:#FF8A4C55 }
[data-theme="brasa"][data-col="watching"]{ --f1:#251019; --s1:#FF9F5A; --s2:#FF5E7E55 }
[data-theme="brasa"][data-col="done"]{ --f1:#12271F; --s1:#FFC08A; --s2:#5CC9A455 }
[data-theme="brasa"][data-col="dropped"]{ --f1:#221534; --s1:#E29BFF; --s2:#8A5EFF55 }
[data-theme="brasa"] body,.escena[data-t="brasa"]{background:
  radial-gradient(85% 45% at 50% -6%,color-mix(in oklab,var(--colc,var(--watching)) 28%,transparent),transparent 72%),
  radial-gradient(120% 70% at 50% 108%,color-mix(in oklab,var(--s1) 22%,transparent) 0%,transparent 60%),
  linear-gradient(var(--f1) 0%,#170B12 60%,#0E070C 100%);background-attachment:fixed}
[data-theme="brasa"] body::before,.escena[data-t="brasa"]::before{content:'';position:fixed;left:50%;bottom:-38vh;translate:-50% 0;width:150vw;height:80vh;
  pointer-events:none;z-index:0;border-radius:50%;opacity:.55;
  background:radial-gradient(circle at 50% 50%,var(--s1) 0%,var(--s2) 42%,transparent 70%);
  animation:brasaLatido 9s ease-in-out infinite alternate}
@keyframes brasaLatido{0%{transform:scale(1);opacity:.45}100%{transform:scale(1.12);opacity:.68}}

/* ═══ AURORA · bosque de noche ═══ */
[data-theme="aurora"]{ --bg:#06120F; --surface:#0E211C; --surface-2:#142E27; --text:#EAFFF6; --text-dim:#84B0A2;
  --wish:#E9F58C; --watching:#5CE1C0; --done:#7FD1FF; --dropped:#C9A0FF; --ink:#05201A;
  --f1:#0A1D18; --r1:#5CE1C066; --r2:#C9A0FF4d; --r3:#7FD1FF40 }
[data-theme="aurora"][data-col="wish"]{ --f1:#141D0E; --r1:#E9F58C66; --r2:#9BE1704d; --r3:#FFF2A040 }
[data-theme="aurora"][data-col="watching"]{ --f1:#0A1D18; --r1:#5CE1C066; --r2:#C9A0FF4d; --r3:#7FD1FF40 }
[data-theme="aurora"][data-col="done"]{ --f1:#0B1B2A; --r1:#7FD1FF66; --r2:#8CFFE04d; --r3:#B9C7FF40 }
[data-theme="aurora"][data-col="dropped"]{ --f1:#170F26; --r1:#C9A0FF66; --r2:#8A7BFF4d; --r3:#E7C8FF40 }
[data-theme="aurora"] body,.escena[data-t="aurora"]{background:
  radial-gradient(85% 45% at 50% -6%,color-mix(in oklab,var(--colc,var(--watching)) 26%,transparent),transparent 72%),
  linear-gradient(var(--f1) 0%,#06120F 60%,#030A09 100%);background-attachment:fixed}
[data-theme="aurora"] body::before,.escena[data-t="aurora"]::before{content:'';position:fixed;inset:-30% -40%;pointer-events:none;z-index:0;opacity:.42;
  background:
    linear-gradient(74deg,transparent 34%,var(--r1) 45%,transparent 56%),
    linear-gradient(96deg,transparent 40%,var(--r2) 52%,transparent 63%),
    linear-gradient(60deg,transparent 46%,var(--r3) 55%,transparent 66%);
  filter:blur(42px);animation:cintas 22s ease-in-out infinite alternate}
[data-theme="aurora"] body::after,.escena[data-t="aurora"]::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;
  background-image:
    radial-gradient(1.4px 1.4px at 18% 22%,#FFFFFF,transparent),
    radial-gradient(1.2px 1.2px at 63% 14%,#EAFFF6,transparent),
    radial-gradient(1.5px 1.5px at 84% 36%,#FFFFFF,transparent),
    radial-gradient(1.2px 1.2px at 39% 8%,#C9F5E6,transparent)}
@keyframes cintas{0%{transform:translate3d(-3%,0,0) skewY(-1deg)}100%{transform:translate3d(3%,-4%,0) skewY(2deg)}}

/* ═══ ARCADE · recreativa de barrio ═══ */
[data-theme="arcade"]{ --bg:#08040F; --surface:#160B24; --surface-2:#20102F; --text:#FFFFFF; --text-dim:#9C86C6;
  --wish:#FFE14D; --watching:#FF3DAE; --done:#3DF5D0; --dropped:#7B5CFF; --ink:#12061C;
  --f1:#170A26; --g1:#FF3DAE; --g2:#7B5CFF }
[data-theme="arcade"][data-col="wish"]{ --f1:#231A05; --g1:#FFE14D; --g2:#FF9B3D }
[data-theme="arcade"][data-col="watching"]{ --f1:#26082A; --g1:#FF3DAE; --g2:#7B5CFF }
[data-theme="arcade"][data-col="done"]{ --f1:#052620; --g1:#3DF5D0; --g2:#3DA9F5 }
[data-theme="arcade"][data-col="dropped"]{ --f1:#180A33; --g1:#7B5CFF; --g2:#C43DFF }
[data-theme="arcade"] body,.escena[data-t="arcade"]{background:
  radial-gradient(80% 42% at 50% -4%,color-mix(in oklab,var(--colc,var(--watching)) 32%,transparent),transparent 70%),
  linear-gradient(var(--f1) 0%,#08040F 62%,#05030A 100%);background-attachment:fixed}
/* la rejilla vive sólo en el borde inferior, desenfocada y a media luz: se
   intuye el neón, pero no hay ni una línea nítida cruzando el contenido */
[data-theme="arcade"] body::before,.escena[data-t="arcade"]::before{content:'';position:fixed;left:-25%;right:-25%;bottom:0;height:38vh;pointer-events:none;z-index:0;opacity:.2;
  filter:blur(2.5px);
  background-image:repeating-linear-gradient(var(--g1) 0 2px,transparent 2px 54px),
    repeating-linear-gradient(90deg,var(--g2) 0 2px,transparent 2px 54px);
  mask-image:linear-gradient(transparent,#000 90%);-webkit-mask-image:linear-gradient(transparent,#000 90%);
  animation:rejilla 5.5s linear infinite}
/* y en vez de rayas de televisión, dos focos de neón que van y vienen */
[data-theme="arcade"] body::after,.escena[data-t="arcade"]::after{content:'';position:fixed;inset:-20%;pointer-events:none;z-index:0;opacity:.3;
  filter:blur(50px);
  background:
    radial-gradient(30% 22% at 16% 22%,var(--g1) 0%,transparent 70%),
    radial-gradient(26% 20% at 84% 46%,var(--g2) 0%,transparent 70%);
  animation:focos 13s ease-in-out infinite alternate}
@keyframes focos{0%{transform:translate3d(-3%,-2%,0)}100%{transform:translate3d(4%,3%,0)}}
@keyframes rejilla{0%{background-position:0 0,0 0}100%{background-position:0 54px,0 0}}

/* lo que comparten los cuatro escenarios con cosmos */
[data-theme="marea"] #app,[data-theme="brasa"] #app,[data-theme="aurora"] #app,[data-theme="arcade"] #app{position:relative;z-index:1}
[data-theme="cometa"] .card,[data-theme="marea"] .card,[data-theme="brasa"] .card,[data-theme="aurora"] .card,[data-theme="arcade"] .card{
  background:linear-gradient(160deg,color-mix(in oklab,var(--c) 13%,color-mix(in oklab,var(--surface) 82%,transparent)),
    color-mix(in oklab,var(--surface) 72%,transparent));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 0 0 1px #ffffff1a,0 18px 40px -26px #000}
[data-theme="cometa"] .b,[data-theme="cometa"] .prow2,[data-theme="cometa"] .stat,
[data-theme="marea"] .b,[data-theme="brasa"] .b,[data-theme="aurora"] .b,[data-theme="arcade"] .b,
[data-theme="marea"] .prow2,[data-theme="brasa"] .prow2,[data-theme="aurora"] .prow2,[data-theme="arcade"] .prow2,
[data-theme="marea"] .stat,[data-theme="brasa"] .stat,[data-theme="aurora"] .stat,[data-theme="arcade"] .stat{background:#ffffff0d}
[data-theme="cometa"] header,[data-theme="marea"] header,[data-theme="brasa"] header,[data-theme="aurora"] header,[data-theme="arcade"] header{
  background:color-mix(in oklab,var(--bg) 68%,transparent)}
[data-theme="cometa"] nav,[data-theme="marea"] nav,[data-theme="brasa"] nav,[data-theme="aurora"] nav,[data-theme="arcade"] nav{
  background:color-mix(in oklab,var(--bg) 84%,transparent)}
[data-theme="cometa"] .ov,[data-theme="marea"] .ov,[data-theme="brasa"] .ov,[data-theme="aurora"] .ov,[data-theme="arcade"] .ov{
  background:color-mix(in oklab,#04030A 72%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
[data-theme="cometa"] .sheet,[data-theme="marea"] .sheet,[data-theme="brasa"] .sheet,[data-theme="aurora"] .sheet,[data-theme="arcade"] .sheet{
  background:linear-gradient(180deg,color-mix(in oklab,var(--surface-2) 86%,transparent),color-mix(in oklab,var(--bg) 92%,transparent));
  backdrop-filter:blur(26px) saturate(1.2);-webkit-backdrop-filter:blur(26px) saturate(1.2);
  box-shadow:inset 0 1px 0 #ffffff2e,inset 0 0 0 1px #ffffff14,0 -24px 70px -22px #000}
[data-theme="cometa"] .footbar,[data-theme="cometa"] .pickbar,
[data-theme="marea"] .footbar,[data-theme="brasa"] .footbar,[data-theme="aurora"] .footbar,[data-theme="arcade"] .footbar,
[data-theme="marea"] .pickbar,[data-theme="brasa"] .pickbar,[data-theme="aurora"] .pickbar,[data-theme="arcade"] .pickbar{
  background:color-mix(in oklab,var(--bg) 66%,transparent)}
[data-theme="cometa"] .toast>div,[data-theme="marea"] .toast>div,[data-theme="brasa"] .toast>div,[data-theme="aurora"] .toast>div,[data-theme="arcade"] .toast>div{
  background:color-mix(in oklab,var(--surface-2) 88%,transparent);backdrop-filter:blur(20px);
  box-shadow:inset 0 0 0 1px #ffffff1f,0 22px 50px -18px #000}

*{box-sizing:border-box}
html{margin:0;padding:0;background:var(--bg)}
body{margin:0;padding:0;min-height:100vh;min-height:100dvh}
body{font-family:Nunito,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--wish);outline-offset:3px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#ffffff1f;border-radius:999px;border:3px solid transparent;background-clip:content-box}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
/* zonas de pintado: no generan caja, así que la cabecera pegajosa y el tablero
   se comportan como si fueran hijos directos de #app, que es lo que eran */
.rgn{display:contents}

/* ═══════════ ÁTOMOS ═══════════ */

.pretty{text-wrap:pretty}
.r44{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;flex:none}

.pill.on{background:color-mix(in oklab,var(--c) 20%,transparent);color:var(--c);

.av{border-radius:999px;display:grid;place-items:center;flex:none;

.av.s34{width:34px;height:34px;font-size:17px}
.av.s30{width:30px;height:30px;font-size:15px}
.av.s38{width:38px;height:38px;font-size:19px}
.av.s52{width:52px;height:52px;font-size:26px}
.bar{height:7px;border-radius:999px;background:#ffffff14;margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--c);transition:width .3s var(--spring)}

.inp{height:52px;border-radius:999px;background:#ffffff0f;border:0;outline:none;padding:0 16px;

.cta{width:100%;height:52px;border-radius:999px;background:var(--watching);color:var(--ink);

.clubc{width:100%;background:var(--surface);border-radius:22px;padding:13px 14px;display:flex;

  box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--c) 42%,transparent)}
.stack{display:flex;flex:none}
.stack>span{margin-left:-9px;box-shadow:0 0 0 2.5px var(--surface-2)}
.stack>span:first-child{margin-left:0}
.prow .stack>span{box-shadow:0 0 0 2px color-mix(in oklab,var(--c) 7%,var(--surface))}

/* pista de otro club: información que sólo tiene este móvil, dicha bajito */
.xclub{display:flex;align-items:flex-start;gap:9px;background:#ffffff0a;border-radius:16px;

/* ═══════════ CABECERA ═══════════ */
header{position:sticky;top:0;z-index:30;background:color-mix(in oklab,var(--bg) 84%,transparent);

.hsync::after{content:'';position:absolute;left:0;right:0;top:-13px;bottom:-13px}

/* ═══════════ TABLERO ═══════════ */
.board{display:grid;gap:14px;padding:4px 14px 130px;align-items:start;max-width:1500px;margin:0 auto;touch-action:pan-y}

/* siempre puesta, invisible: el arrastre la enciende sin repintar el tablero */
.dropline{height:4px;border-radius:999px;background:var(--c);box-shadow:0 0 14px var(--c);display:none}

@media (min-width:900px){
  .board{grid-template-columns:repeat(3,minmax(230px,1fr)) 74px;padding:10px 22px 160px;gap:18px}

  .col[data-collapsed="true"] .cards{display:none}

/* la pista de deslizamiento está siempre puesta y empieza invisible: el gesto la

.epline{display:flex;align-items:center;gap:11px;margin-top:12px}
.epmark{font-weight:800;font-size:17px;color:var(--c);letter-spacing:-.3px}
.epcount{font-size:11.5px;color:var(--text-dim);font-weight:700}
.minus{background:#ffffff12;font-size:20px;font-weight:800}
.plus{background:var(--c);color:var(--ink);font-size:21px;font-weight:800;

.rows{display:flex;flex-direction:column;gap:7px;margin-top:11px;padding-top:10px;box-shadow:inset 0 1px 0 #ffffff12}
.prow{display:flex;align-items:center;gap:9px}
.prow b{font-weight:800;font-size:13px;white-space:nowrap}
.prow em{font-size:10.5px;color:var(--text-dim);font-weight:700;font-style:normal;white-space:nowrap}
.wide{width:100%;margin-top:11px;height:44px;border-radius:14px;background:#ffffff0d;
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13.5px;font-weight:800;color:var(--c)}
.seen{width:100%;margin-top:11px;height:46px;border-radius:14px;background:var(--c);color:var(--ink);
  font-size:14.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}

.rchip{display:flex;align-items:center;gap:3px;height:22px;padding:0 7px 0 3px;border-radius:999px;

@media (prefers-reduced-motion:reduce){.empty svg{animation:none}}
@keyframes flota{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-5px) rotate(1.2deg)}}

nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;gap:4px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));min-height:var(--navh);box-sizing:border-box;
  background:color-mix(in oklab,var(--surface-2) 94%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 -14px 34px -18px #000c}

  background:var(--watching);color:var(--ink);font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:10px;
  box-shadow:0 14px 34px -10px var(--watching),0 4px 12px #0006}
/* la posición la escribe el arrastre en «translate», que se compone aparte del
   transform y no obliga a repintar el tablero en cada pointermove */
.ghostcard{position:fixed;left:0;top:0;z-index:60;pointer-events:none;transform:rotate(2deg) scale(1.03);
  border-radius:20px;padding:12px;background:color-mix(in oklab,var(--c) 12%,var(--surface));
  box-shadow:0 30px 60px -18px #000c,0 0 0 1px #ffffff1a}

  transform:scale(1);transition:transform .16s var(--spring)}

  padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 22px 50px -18px #000c}

  color:#2A2016;font-weight:800;font-size:13.5px}

/* ═══════════ HOJAS ═══════════ */
/* el hueco de arriba respeta la muesca: si no, con la hoja al máximo el tirador
   se metía debajo del reloj */
.ov{position:fixed;inset:0;z-index:100;background:#0A0812b8;backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top) 0 0}
/* «92vh» se mide contra el viewport GRANDE, el de la barra de URL escondida,
   mientras que .ov ocupa sólo el visible. En el móvil eso significaba que la
   hoja podía pedir más alto del que había y, al estar pegada abajo, desbordaba
   HACIA ARRIBA: el borde superior, el tirador y el botón de cerrar se salían de
   la pantalla. «dvh» sigue al viewport visible y el «%» se mide contra este
   mismo contenedor; se coge el menor de los dos y ya no se sale por ningún lado. */
.sheet{position:relative;background:var(--surface-2);width:100%;max-width:100%;
  max-height:92vh;max-height:min(92dvh,92%);border-radius:28px 28px 0 0;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -20px 60px -20px #000e;
  will-change:transform;transition:transform .2s var(--spring)}
/* la entrada se anima sólo al abrir la hoja, no cada vez que cambia algo dentro:
   la clase la pone el pintado a mano sobre el elemento recién creado */
/* «backwards» y no «both» a propósito: con «both» la animación se queda puesta
   para siempre y, en la cascada, una animación gana a un estilo en línea — o
   sea que el transform que escribe el arrastre no se veía y la hoja no seguía
   al dedo. Con «backwards» sólo se rellena la entrada y luego suelta el mando. */
.ov.anim{animation:fadeIn .18s ease backwards}
.sheet.anim{animation:sheetUp .24s var(--spring) backwards}
/* la zona de agarre es bastante más alta que la barrita que se ve: antes eran
   21 px y no había quien la cogiera */
.handle{flex:none;padding:15px 0 11px;display:grid;place-items:center;cursor:grab;touch-action:none}
.handle:active{cursor:grabbing}
.handle i{width:52px;height:5px;border-radius:999px;background:#ffffff38;display:block}
/* cerrar / volver: hasta ahora sólo se salía tocando fuera o arrastrando la
   barrita, y en un móvil eso no lo encuentra nadie */
.xsheet{position:absolute;top:9px;right:9px;z-index:2;width:44px;height:44px;border-radius:999px;
  display:grid;place-items:center;font-size:22px;font-weight:800;color:var(--text-dim);line-height:1}
.xsheet:active{background:#ffffff12}
.scroll{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:6px 18px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:900px){
  .ov{align-items:center;padding:28px}
  .sheet{max-width:620px;max-height:88vh;max-height:min(88dvh,100%);border-radius:28px}
}

.dposter{width:104px;height:156px;border-radius:16px;flex:none;background-color:#0003;
  background-size:cover;background-position:center;box-shadow:0 14px 30px -14px #000b}

  background:color-mix(in oklab,var(--c) 18%,transparent);color:var(--c);box-shadow:none}
.dtitle{font-weight:800;font-size:22px;line-height:1.12;letter-spacing:-.4px;text-wrap:pretty}
.gchip{height:26px;padding:0 11px;border-radius:999px;background:#ffffff0f;font-size:11.5px;
  font-weight:800;color:var(--text-dim);display:grid;place-items:center}
.pchip{height:28px;display:flex;align-items:center;gap:6px;padding:0 11px 0 4px;border-radius:999px;background:#ffffff12}

<body>
<div class="sr" aria-live="polite" id="live"></div>
<i id="fxtint" aria-hidden="true" style="position:fixed;left:-9999px;top:0;color:var(--colc,#FF4FA3)"></i>
<!-- Cinco zonas que se repintan por separado. Llevan display:contents, así que
     para el diseño esto es exactamente igual que un solo contenedor. -->
<canvas id="fx" aria-hidden="true"></canvas>
<div id="app"><div class="rgn" id="rhead"></div><div class="rgn" id="rmain"></div><div class="rgn" id="rnav"></div><div class="rgn" id="rfloat"></div><div class="rgn" id="rsheet"></div></div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   API REAL — sustituye a mock-api.js del handoff.
   Implementa el contrato de §2.2. Fuera de este bloque no hay ni un fetch ni
   un localStorage. Persistencia: data.json en un repo de GitHub vía Contents
   API. Catálogo: TMDB. Claves: link mágico → localStorage.
   ══════════════════════════════════════════════════════════════════════════ */

const LS = { cfg:'sc.cfg', theme:'sc.theme', perfil:'sc.me', cache:'sc.cache.' };
const iso = (d) => new Date(d == null ? Date.now() : d).toISOString();
const uid = (p) => p + Math.random().toString(36).slice(2, 9);
const nowIso = () => new Date().toISOString();

/* ── configuración ────────────────────────────────────────────────────────────
   El navegador ya no guarda ningún token de GitHub ni de TMDB. Sólo guarda tu
   secreto personal, que únicamente sirve para hablar con el Worker y que lleva
   dentro a qué grupo perteneces. El enlace trae «#s=» si ya eres del grupo o
   «#i=» si te acaban de invitar (de un solo uso).

   Se admiten varios secretos a la vez: así puedes estar en el tablero de la
   pareja y en el de los amigos desde el mismo móvil. Ojo con lo que esto NO es:
   no hay cuenta ni identidad común. En cada club eres una persona distinta con
   su propia clave, y el servidor no sabe que sois la misma. Quien sí lo sabe es
   este dispositivo, y por eso todo lo que cruza clubes — el perfil que se
   preselecciona, las pistas de «esto ya lo tienes en el otro» — se calcula aquí
   y no sale de aquí.                                                           */
const WORKER_URL = 'https://sofa-club.mysofaclub.workers.dev';   /* ← edítalo una vez */
const CLAVE_OK = /^[a-z0-9][a-z0-9-]{1,30}\.[a-z0-9]{16,64}$/;
const grupoDe = (s) => (CLAVE_OK.test(String(s || '')) ? String(s).split('.')[0] : null);

function readConfig(){
  let cfg = { secrets: [], active: null, invite: null };
  try {
    const g = JSON.parse(localStorage.getItem(LS.cfg) || '{}');
    if (Array.isArray(g.secrets)) cfg.secrets = g.secrets.filter((s) => CLAVE_OK.test(s));
    if (CLAVE_OK.test(g.active)) cfg.active = g.active;
  } catch(e){}
  const h = location.hash.slice(1);
  if (h){
    const p = new URLSearchParams(h);
    const s = p.get('s'), i = p.get('i');
    if (s && CLAVE_OK.test(s)) añadirSecreto(cfg, s);
    if (i && CLAVE_OK.test(i)) cfg.invite = i;          /* no se guarda: se consume al entrar */
    history.replaceState(null, '', location.pathname + location.search);
  }
  if (!cfg.active || cfg.secrets.indexOf(cfg.active) < 0) cfg.active = cfg.secrets[0] || null;
  return cfg;
}
function añadirSecreto(cfg, s){
  const g = grupoDe(s);
  cfg.secrets = cfg.secrets.filter((x) => grupoDe(x) !== g).concat([s]);
  cfg.active = s;
  saveConfig(cfg);
}
/* salir de un club en ESTE dispositivo: se va la clave y se va su copia local.
   No echa a nadie de ningún sitio ni borra nada del club; simplemente este
   móvil deja de tener llave, y para volver hará falta otra invitación.         */
function quitarSecreto(cfg, s){
  const g = grupoDe(s);
  cfg.secrets = cfg.secrets.filter((x) => x !== s);
  if (cfg.active === s) cfg.active = cfg.secrets[0] || null;
  if (g && !cfg.secrets.some((x) => grupoDe(x) === g)) borrarCacheDe(g);
  saveConfig(cfg);
}
function saveConfig(cfg){
  try { localStorage.setItem(LS.cfg, JSON.stringify({ secrets: cfg.secrets, active: cfg.active })); } catch(e){}
}
function olvidarTodo(cfg){
  try {
    localStorage.removeItem(LS.cfg);
    localStorage.removeItem(LS.perfil);
    ((cfg && cfg.secrets) || []).forEach((s) => borrarCacheDe(grupoDe(s)));
  } catch(e){}
}

/* ── la copia local, una por club ────────────────────────────────────────────
   Antes había una sola ranura y cambiar de club dejaba el tablero en blanco
   hasta que contestaba el Worker. Con una copia por club el cambio es
   instantáneo, y de paso el dispositivo puede mirar de reojo lo que tienes en
   los otros sin pedir permiso a nadie ni hacer una sola petición.              */
const claveCache = (g) => LS.cache + g;
function guardarCacheDe(g, state){
  if (!g) return;
  try { localStorage.setItem(claveCache(g), JSON.stringify(state)); } catch(e){}
}
function borrarCacheDe(g){
  if (!g) return;
  try { localStorage.removeItem(claveCache(g)); } catch(e){}
}
/* se sanea al leer: esto es texto guardado en el navegador y acaba en el DOM */
function leerCacheDe(g){
  if (!g) return null;
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(claveCache(g)) || 'null'); } catch(e){}
  if (!raw || !raw.me) return null;
  const v = publicView(raw, raw.me);
  if (!v.me) return null;
  v.group = g;
  return v;
}

/* ── el perfil de este dispositivo ───────────────────────────────────────────
   No es una cuenta: es un recuerdo. Sirve para no volver a teclear tu nombre y
   tu bicho cada vez que entras en un club nuevo. Sigues siendo una persona
   distinta en cada club, con su propia clave y su propio identificador.        */
function leerPerfil(){
  let p = null;
  try { p = JSON.parse(localStorage.getItem(LS.perfil) || 'null'); } catch(e){}
  if (!p || !String(p.name || '').trim()) return null;
  return { name: okStr(p.name, 40), emoji: okEmoji(p.emoji), color: okColor(p.color) };
}
function guardarPerfil(p){
  if (!p || !String(p.name || '').trim()) return;
  try { localStorage.setItem(LS.perfil, JSON.stringify({ name: okStr(p.name, 40), emoji: okEmoji(p.emoji), color: okColor(p.color) })); } catch(e){}
}

/* ── saneado en la frontera ──────────────────────────────────────────────────
   Todo lo que sale del Api pasa por aquí. data.json lo puede escribir cualquiera
   con el enlace, y los títulos vienen de TMDB, que es contenido editado por
   terceros: ninguno de los dos es de fiar para meterlo en el DOM tal cual.      */
const ID_OK = /^[A-Za-z0-9_-]{1,64}$/;
const okId = (s) => ID_OK.test(String(s || '')) ? String(s) : null;
const okColor = (c) => /^#[0-9a-fA-F]{3,8}$/.test(String(c || '')) ? String(c) : '#8B85A8';
const okEmoji = (e) => (String(e == null ? '' : e).replace(/[^\p{Extended_Pictographic}\p{L}\p{N}]/gu, '').slice(0, 4) || '👤');
const okNum = (n) => (typeof n === 'number' && isFinite(n)) ? n : (isFinite(+n) && n !== null && n !== '' ? +n : null);
const okStr = (s, max) => String(s == null ? '' : s).slice(0, max || 400);
/* sólo carátulas de TMDB (o el SVG del modo demo). Cualquier otra cosa, fuera. */
const okImgPath = (p) => {
  const s = String(p || '');
  if (/^\/[A-Za-z0-9._-]{1,120}$/.test(s)) return s;               // ruta TMDB
  if (/^data:image\/svg\+xml,[A-Za-z0-9%._~()'!*:@,;+$-]*$/.test(s)) return s; // demo
  return null;
};
function safeUser(u){
  const id = okId(u.id); if (!id) return null;
  return { id: id, name: okStr(u.name, 40) || '¿?', emoji: okEmoji(u.emoji), color: okColor(u.color),
    joinedAt: u.joinedAt, active: u.active !== false };
}
function safeItem(i){
  const id = okId(i.id); if (!id) return null;
  const parts = {};
  Object.keys(i.participants || {}).forEach((k) => {
    const uidOk = okId(k); if (!uidOk) return;
    const p = i.participants[k];
    if (!p || ['wish','watching','done','dropped'].indexOf(p.status) < 0) return;
    parts[uidOk] = {
      status: p.status, order: okNum(p.order) || 0,
      progress: p.progress && okNum(p.progress.s) != null && okNum(p.progress.e) != null ? { s:+p.progress.s, e:+p.progress.e } : null,
      hype: clampN(okNum(p.hype), 1, 5, 3), rating: p.rating == null ? null : clampN(okNum(p.rating), 1, 5, null),
      startedAt: p.startedAt || null, finishedAt: p.finishedAt || null, updatedAt: p.updatedAt || null,
    };
  });
  if (!Object.keys(parts).length) return null;
  const seasons = Array.isArray(i.seasons)
    ? i.seasons.map((s) => ({ number: okNum(s.number) || 0, episodes: okNum(s.episodes) || 0 })).filter((s) => s.number > 0)
    : null;
  return {
    id: id, tmdbId: okNum(i.tmdbId), type: i.type === 'movie' ? 'movie' : 'tv',
    title: okStr(i.title, 160) || 'Sin título', originalTitle: okStr(i.originalTitle, 160),
    year: okNum(i.year), poster: okImgPath(i.poster),
    /* nota de TMDB, 0–10. Es dato del catálogo, no vuestro: nadie la escribe
       desde la app, sólo llega con el título. */
    score: i.score == null ? null : clampN(okNum(i.score), 0, 10, null),
    genres: (Array.isArray(i.genres) ? i.genres : []).slice(0, 8).map((g) => okStr(g, 40)),
    overview: okStr(i.overview, 1200), runtime: okNum(i.runtime) || 0,
    seasons: seasons && seasons.length ? seasons : null,
    totalEpisodes: okNum(i.totalEpisodes),
    providers: (Array.isArray(i.providers) ? i.providers : []).slice(0, 6)
      .map((p) => ({ name: okStr(p.name, 40), logo: okImgPath(p.logo) })).filter((p) => p.name),
    providersCheckedAt: i.providersCheckedAt || null,
    addedBy: okId(i.addedBy) || '', addedAt: i.addedAt || null,
    participants: parts,
    notes: (Array.isArray(i.notes) ? i.notes : []).filter((n) => n && !n.deletedAt && okId(n.id))
      .slice(0, 200).map((n) => ({ id: okId(n.id), by: okId(n.by) || '', text: okStr(n.text, 600), at: n.at || null })),
    updatedAt: i.updatedAt || null,
  };
}
function clampN(v, a, b, dflt){ return (v == null || !isFinite(v)) ? dflt : Math.max(a, Math.min(b, v)); }

/* vista pública: sin lápidas y saneada */
function publicView(raw, me){
  return {
    me: okId(me),
    users: (raw.users || []).filter((u) => !u.deletedAt).map(safeUser).filter(Boolean),
    items: (raw.items || []).filter((i) => !i.deletedAt).map(safeItem).filter(Boolean),
  };
}
/* ── cliente de GitHub: data.json vía Contents API (envía CORS, sin proxy) ── */
const IMG = { sm: 'w185', md: 'w342', lg: 'w500' };

/* ── espejo local de las operaciones ──────────────────────────────────────────
   Sirve para dos cosas: el modo demo, y pintar el cambio al instante mientras
   el Worker confirma. No es una comprobación de seguridad — el Worker vuelve a
   validarlo todo y su respuesta manda —, así que puede ser simple.            */
function aplicarLocal(st, op, a, me){
  const it = (id) => st.items.find((x) => x.id === id);
  const orden = (status) => {
    let max = 0;
    st.items.forEach((i) => Object.values(i.participants).forEach((p) => { if (p.status === status) max = Math.max(max, p.order || 0); }));
    return max + 1024;
  };
  const parte = (status, o) => ({ status, order: o.order, progress: o.progress || null, hype: o.hype != null ? o.hype : 3,
    rating: null, startedAt: status === 'wish' ? null : nowIso(),
    finishedAt: (status === 'done' || status === 'dropped') ? nowIso() : null, updatedAt: nowIso() });
  const sellar = (x, u) => { if (x.participants[u]) x.participants[u].updatedAt = nowIso(); x.updatedAt = nowIso(); };
  const x = a.id ? it(a.id) : null;

  if (op === 'addItem'){
    let y = st.items.find((i) => i.tmdbId === a.tmdbId);
    if (!y){
      y = Object.assign({ id: uid('itm_'), tmdbId: a.tmdbId, type: a.type, title: a.title || 'Cargando…',
        originalTitle: a.originalTitle || '', year: a.year || null, poster: a.poster || null,
        score: a.score == null ? null : a.score, genres: [], overview: '',
        runtime: 0, seasons: null, totalEpisodes: null, providers: [], addedBy: me, addedAt: nowIso(),
        participants: {}, notes: [], updatedAt: nowIso() });
      st.items = [y].concat(st.items);
    }
    if (!y.participants[me]) y.participants[me] = parte(a.status || 'wish', { order: orden(a.status || 'wish'), hype: a.hype });
    return;
  }
  if (!x && op !== 'updateProfile' && op !== 'removeUser') return;
  if (op === 'removeItem') st.items = st.items.filter((i) => i.id !== a.id);
  /* salirse no es borrar: sólo desaparece tu parte. El título se va del todo
     únicamente si no quedaba nadie más apuntado. */
  else if (op === 'leaveItem'){
    delete x.participants[me];
    x.updatedAt = nowIso();
    if (!Object.keys(x.participants).length) st.items = st.items.filter((i) => i.id !== a.id);
  }
  else if (op === 'setStatus'){
    const o = orden(a.status);
    (a.userIds || []).forEach((u) => {
      const p = x.participants[u]; if (!p) return;
      p.status = a.status; p.order = o;
      /* si nunca la has visto, entrar en «viendo» te deja en el primer episodio:
         «T1 E0» era un sitio en el que no ha estado nadie nunca */
      if (a.status === 'watching' && x.type === 'tv' && !p.progress) p.progress = { s: 1, e: 1 };
      if (a.status === 'wish'){ p.progress = null; p.rating = null; p.finishedAt = null; }
      if (a.status === 'done' || a.status === 'dropped') p.finishedAt = nowIso();
      if (a.status === 'watching'){ p.startedAt = p.startedAt || nowIso(); p.finishedAt = null; }
      sellar(x, u);
    });
  }
  else if (op === 'setProgress') (a.userIds || []).forEach((u) => { const p = x.participants[u]; if (p){ p.progress = { s: a.progress.s, e: a.progress.e }; sellar(x, u); } });
  else if (op === 'splitOut'){ const p = x.participants[me]; if (p){ p.order = orden(p.status); sellar(x, me); } }
  else if (op === 'joinUsers'){
    const t = x.participants[a.target]; if (!t) return;
    x.participants[me] = Object.assign({}, x.participants[me] || parte(t.status, { order: t.order }),
      { status: t.status, order: t.order, progress: t.progress ? Object.assign({}, t.progress) : null });
    sellar(x, me);
  }
  else if (op === 'setHype'){ const p = x.participants[me]; if (p){ p.hype = a.value; sellar(x, me); } }
  else if (op === 'setRating'){ const p = x.participants[me]; if (p){ p.rating = a.value; sellar(x, me); } }
  else if (op === 'addNote'){ x.notes = x.notes.concat([{ id: uid('n_'), by: me, text: a.text, at: nowIso() }]); x.updatedAt = nowIso(); }
  else if (op === 'removeNote'){ x.notes = x.notes.filter((n) => n.id !== a.noteId || n.by !== me); x.updatedAt = nowIso(); }
  else if (op === 'updateProfile') st.users = st.users.map((u) => u.id === me ? Object.assign({}, u, { name: a.name, emoji: a.emoji, color: a.color }) : u);
  else if (op === 'removeUser'){
    st.users = st.users.filter((u) => u.id !== a.userId);
    st.items.forEach((i) => { delete i.participants[a.userId]; });
    st.items = st.items.filter((i) => Object.keys(i.participants).length);
  }
}

/* lo que llega del Worker se vuelve a sanear aquí: los nombres, las notas y
   los textos de TMDB los escriben personas, y esta es la última frontera antes
   del DOM. */
const sanear = (st) => Object.assign(publicView(st || {}, st && st.me), { group: st && st.group, owner: st && st.owner });

/* ── el Api: hacia fuera, el mismo contrato de siempre ────────────────────── */
function createApi(cfg){
  const demo = !cfg.active || /TU-SUBDOMINIO/.test(WORKER_URL);
  let state = { me: null, users: [], items: [] };
  let sync = { state: 'idle', pending: 0 };
  const subs = new Set();
  const cola = [];
  let enviando = false, sinClave = false, ultimoError = null, sobraba = false;
  const catalogo = {};

  const emit = () => { const s = state; subs.forEach((f) => { try { f(s); } catch(e){ console.error(e); } }); };
  const setSync = (st, n, silencioso) => {
    const antes = sync;
    sync = { state: st, pending: n == null ? cola.length : n };
    /* «silencioso» significa: el tablero volvió igual que estaba. Si además el
       estado de sincronización tampoco cambió, no hay nada que contarle a la
       pantalla — emitir aquí es lo que la hacía parpadear cada minuto. */
    if (silencioso && antes.state === sync.state && antes.pending === sync.pending) return;
    emit();
  };
  const guardarCache = () => { if (!demo) guardarCacheDe(grupoDe(cfg.active), state); };

  async function llamar(ruta, opciones){
    const r = await fetch(WORKER_URL + ruta, Object.assign({
      headers: Object.assign({ 'Content-Type': 'application/json' }, cfg.active ? { Authorization: 'Bearer ' + cfg.active } : {}),
    }, opciones || {}));
    let cuerpo = null;
    try { cuerpo = await r.json(); } catch(e){}
    if (!r.ok){
      const err = new Error((cuerpo && cuerpo.error) || ('http-' + r.status));
      err.code = (cuerpo && cuerpo.error) || 'http'; err.status = r.status;
      throw err;
    }
    return cuerpo;
  }

  /* las operaciones se encolan y salen en orden; así el servidor nunca recibe
     dos cambios cruzados y el reintento es trivial */
  function encolar(op, args, opciones){
    if (demo){ aplicarLocal(state, op, args, state.me); state = Object.assign({}, state, { items: state.items.slice() }); emit(); return Promise.resolve({}); }
    aplicarLocal(state, op, args, state.me);
    state = Object.assign({}, state, { items: state.items.slice() });
    guardarCache(); emit();
    return new Promise((resolve, reject) => {
      const previo = (opciones && opciones.fusionar) ? cola.find((c) => c.op === op && c.clave === opciones.fusionar && !c.enviada) : null;
      if (previo){ previo.args = args; previo.resolves.push(resolve); previo.rejects.push(reject); }
      else cola.push({ op, args, clave: opciones && opciones.fusionar, enviada: false, resolves: [resolve], rejects: [reject] });
      setSync('saving');
      clearTimeout(encolar._t);
      encolar._t = setTimeout(vaciar, (opciones && opciones.esperar) || 120);
    });
  }
  async function vaciar(){
    if (enviando || !cola.length || sinClave) return;
    if (!navigator.onLine){ setSync('offline'); return; }
    enviando = true;
    while (cola.length){
      const c = cola[0];
      c.enviada = true;
      try {
        const r = await llamar('/api/op', { method: 'POST', body: JSON.stringify({ op: c.op, args: c.args }) });
        state = sanear(r.state); guardarCache();
        cola.shift(); c.resolves.forEach((f) => f(r));
      } catch(e){
        c.enviada = false;
        if (e.code === 'sin-clave'){ sinClave = true; setSync('error'); enviando = false; emit(); return; }
        if (!navigator.onLine || e.status === undefined){ setSync('offline'); enviando = false; return; }
        ultimoError = e;
        setSync('error');
        cola.shift(); c.rejects.forEach((f) => f(e));
      }
    }
    enviando = false;
    ultimoError = null;
    setSync('idle', 0);
  }
  async function refrescar(){
    if (demo || sinClave || cola.length) return;
    try {
      const r = await llamar('/api/session', { method: 'POST' });
      const nuevo = sanear(r.state);
      const igual = JSON.stringify(nuevo) === JSON.stringify(state);
      state = nuevo;
      if (!igual) guardarCache();       /* y si vino igual, ni escribir en disco */
      setSync('idle', 0, igual);
    }
    catch(e){ if (e.code === 'sin-clave'){ sinClave = true; setSync('error'); } else if (!navigator.onLine) setSync('offline'); }
  }

  /* los resultados del catálogo se filtran por lo que traiga cada uno: si el
     servidor manda categorías o plataformas, esos filtros pasan a filtrar de
     verdad en vez de sólo pedirlas al buscar. */
  /* en demo el catálogo también va por páginas, del mismo tamaño que las de
     TMDB, para que «ver más» se comporte igual que en la app de verdad */
  const pagina = (todo, opts) => { const p = (opts && opts.page) || 1;
    return todo.slice((p - 1) * 20, p * 20); };
  const limpiarResultados = (lista) => (Array.isArray(lista) ? lista : []).map((x) => Object.assign({}, x, {
    genres: (Array.isArray(x.genres) ? x.genres : []).slice(0, 8).map((g) => okStr(g, 40)),
    genreIds: (Array.isArray(x.genreIds) ? x.genreIds : (Array.isArray(x.genre_ids) ? x.genre_ids : [])).slice(0, 12).map((v) => okNum(v)).filter((v) => v != null),
    providers: (Array.isArray(x.providers) ? x.providers : []).slice(0, 12)
      .map((p) => ({ name: okStr(p && p.name, 60), logo: okImgPath(p && p.logo) })).filter((p) => p.name),
  }));

  const Api = {
    getState: () => state,
    subscribe(fn){ subs.add(fn); return () => subs.delete(fn); },
    getSyncStatus: () => sync,
    imageUrl(path, size){
      if (!path) return null;
      if (/^data:/.test(path)) return path;
      if (!/^\/[A-Za-z0-9._-]{1,120}$/.test(path)) return null;
      return 'https://image.tmdb.org/t/p/' + (IMG[size || 'md']) + path;
    },

    async searchTitles(query, opts){
      if (demo){
        const q = (query || '').toLowerCase();
        const mios = state.items.map((i) => ({ tmdbId: i.tmdbId, type: i.type, title: i.title, originalTitle: i.originalTitle,
          year: i.year, poster: i.poster, score: i.score, genres: i.genres, providers: i.providers }));
        const todo = mios.concat(demoCatalogo()).filter((i) => (i.title + ' ' + (i.originalTitle || '')).toLowerCase().includes(q));
        return pagina(todo, opts);
      }
      const r = await fetch(WORKER_URL + '/api/search?q=' + encodeURIComponent(query)
          + '&page=' + ((opts && opts.page) || 1),
        { headers: { Authorization: 'Bearer ' + cfg.active }, signal: opts && opts.signal });
      if (!r.ok) throw new Error('busqueda');
      const j = await r.json();
      const rs = limpiarResultados(j.results);
      rs.forEach((x) => { catalogo[x.tmdbId] = x; });
      return rs;
    },

    /* buscar sin escribir nada: sólo con los filtros. El catálogo es de TMDB, así
       que esto lo tiene que resolver el servidor (/api/discover). Si todavía no
       existe, se avisa y se sigue pudiendo buscar por título. */
    async discoverTitles(f, opts){
      if (demo){
        const mios = state.items.map((i) => ({ tmdbId: i.tmdbId, type: i.type, title: i.title, originalTitle: i.originalTitle,
          year: i.year, poster: i.poster, score: i.score, genres: i.genres, providers: i.providers }));
        return pagina(mios.concat(demoCatalogo()), opts);
      }
      const p = new URLSearchParams();
      if (f.type) p.set('type', f.type);
      if (f.rateMin) p.set('rateMin', String(f.rateMin));
      if (f.dec) p.set('dec', String(f.dec));
      if (f.genres && f.genres.length) p.set('genres', idsDeCategorias(f.genres).join(','));
      if (f.provs && f.provs.length) p.set('provs', f.provs.join(','));
      p.set('sort', f.sort || 'rel');
      p.set('page', String((opts && opts.page) || 1));
      const r = await fetch(WORKER_URL + '/api/discover?' + p.toString(),
        { headers: { Authorization: 'Bearer ' + cfg.active }, signal: opts && opts.signal });
      if (!r.ok){ const e = new Error('discover'); e.code = 'no-discover'; throw e; }
      const j = await r.json();
      const rs = limpiarResultados(j.results);
      rs.forEach((x) => { catalogo[x.tmdbId] = x; });
      return rs;
    },

    addItem(o){
      const semilla = catalogo[o.tmdbId] || {};
      /* «score» es el vote_average de TMDB: el Worker lo manda en /api/search y
         al enriquecer el título. Si no viene, el filtro por valoración
         simplemente no tiene nada que mirar. */
      return encolar('addItem', { tmdbId: o.tmdbId, type: o.type, status: o.status, hype: o.hype,
        title: semilla.title, originalTitle: semilla.originalTitle, year: semilla.year, poster: semilla.poster,
        score: semilla.score == null ? null : semilla.score });
    },
    removeItem(id){ return encolar('removeItem', { id }); },
    leaveItem(id){ return encolar('leaveItem', { id }); },
    setStatus(id, userIds, status){ return encolar('setStatus', { id, userIds, status }); },
    /* el progreso es un valor absoluto, así que varios toques seguidos se funden
       en uno solo: ni te hace esperar ni genera un commit por episodio */
    setProgress(id, userIds, p){ return encolar('setProgress', { id, userIds, progress: p }, { fusionar: 'p:' + id, esperar: 700 }); },
    splitOut(id){ return encolar('splitOut', { id }); },
    joinUsers(id, _me, target){ return encolar('joinUsers', { id, target }); },
    setHype(id, _u, value){ return encolar('setHype', { id, value }, { fusionar: 'h:' + id, esperar: 400 }); },
    setRating(id, _u, value){ return encolar('setRating', { id, value }, { fusionar: 'r:' + id, esperar: 400 }); },
    addNote(id, text){ return encolar('addNote', { id, text }); },
    removeNote(id, noteId){ return encolar('removeNote', { id, noteId }); },
    updateProfile(p){
      if (demo && !state.me){
        const id = uid('u_');
        state = Object.assign({}, state, { me: id, users: state.users.concat([{ id, name: p.name, emoji: p.emoji, color: p.color, joinedAt: nowIso(), active: true }]) });
        emit(); return Promise.resolve(id);
      }
      guardarPerfil(p);            /* para no volver a teclearlo en el próximo club */
      return encolar('updateProfile', { name: p.name, emoji: p.emoji, color: p.color });
    },
    removeUser(userId){ return encolar('removeUser', { userId }); },
    async createInvite(){
      if (demo) return location.href;
      const r = await llamar('/api/op', { method: 'POST', body: JSON.stringify({ op: 'createInvite', args: {} }) });
      state = sanear(r.state); emit();
      return r.url;
    },

    /* estado para la interfaz */
    isDemo: () => demo,
    isClassic: () => false,
    hasTmdb: () => !demo,
    authFailed: () => sinClave,
    repoName: () => grupoDe(cfg.active),

    /* los clubes de este dispositivo. Nada de esto viaja: son las claves que
       hay guardadas aquí y la copia local de cada tablero.                    */
    grupos: () => cfg.secrets.map((s) => ({ secret: s, group: grupoDe(s), activo: s === cfg.active })),
    estadoDeClub: (g) => (g && g === grupoDe(cfg.active) ? state : leerCacheDe(g)),
    perfilDelDispositivo: () => leerPerfil(),
    cambiarGrupo(secret){ if (secret === cfg.active) return; cfg.active = secret; saveConfig(cfg); location.reload(); },
    salirDeClub(secret){ quitarSecreto(cfg, secret); location.reload(); },
    olvidarDispositivo(){ olvidarTodo(cfg); location.reload(); },
    retry(){ sinClave = false; ultimoError = null; if (cola.length) vaciar(); else refrescar(); },
    ultimoFallo: () => ultimoError,

    async boot(){
      if (demo){ const raw = demoSeed(); state = sanear({ me: raw.users[0].id, users: raw.users, items: raw.items }); emit(); return; }
      const c = leerCacheDe(grupoDe(cfg.active));            /* pinta ya, sin esperar al Worker */
      if (c){ state = c; emit(); }
      /* Una invitación al club en el que YA estás no sirve de nada: canjearla te
         crearía una segunda persona y dejaría la primera huérfana en el tablero.
         Pero sólo sobra si tu clave de ese club sigue valiendo — si te echaron o
         se regeneró, la invitación es justo lo que necesitas. Por eso se
         pregunta primero y se decide después.                                  */
      if (cfg.invite && cfg.active && grupoDe(cfg.invite) === grupoDe(cfg.active)){
        await refrescar();
        if (!sinClave){ cfg.invite = null; sobraba = true; emit(); return; }
      }
      if (cfg.invite){
        emit();          /* la pantalla de bienvenida se encarga: llamará a unirse() */
        return;
      }
      await refrescar();
    },
    /* crear un club nuevo estando ya en alguno. El Worker exige una clave
       válida de cualquier club: no hace falta la llave maestra, pero tampoco
       puede hacerlo quien pase por aquí de casualidad. */
    async crearClub(nombre, perfil){
      const r = await llamar('/api/group', { method: 'POST', body: JSON.stringify({
        group: nombre, name: perfil.name, emoji: perfil.emoji, color: perfil.color }) });
      añadirSecreto(cfg, r.secret);
      guardarPerfil(perfil);
      state = sanear(r.state); guardarCacheDe(grupoDe(r.secret), state);
      return r;
    },
    /* alta con invitación de un solo uso: el Worker devuelve TU secreto */
    async unirse(perfil){
      const r = await llamar('/api/join', { method: 'POST', body: JSON.stringify({ invite: cfg.invite, name: perfil.name, emoji: perfil.emoji, color: perfil.color }) });
      añadirSecreto(cfg, r.secret);
      guardarPerfil(perfil);
      cfg.invite = null;
      state = sanear(r.state); guardarCache(); setSync('idle', 0);
      return r;
    },
    hayInvitacion: () => !!cfg.invite,
    clubInvitado: () => grupoDe(cfg.invite),
    invitacionSobraba(){ const s = sobraba; sobraba = false; return s; },   /* se cuenta una vez */
  };

  window.addEventListener('online', () => { if (cola.length) vaciar(); else refrescar(); });
  window.addEventListener('offline', () => setSync('offline'));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (cola.length) vaciar(); else refrescar(); } });
  setInterval(() => { if (!document.hidden) refrescar(); }, 60000);
  return Api;
}

function absEp(it, pr){
  if (!pr || !it.seasons) return 0;
  let n = 0; it.seasons.forEach((s) => { if (s.number < pr.s) n += s.episodes; });
  return n + pr.e;
}
/* «T22 E5» no le sirve a nadie que vea anime: el reproductor dice «episodio
   1093». El número absoluto ya sabíamos calcularlo, sólo faltaba enseñarlo —
   y sólo cuando aporta algo, que en una serie de una temporada sería decir
   dos veces el mismo número. */
function epTxt(it, pr, sep){
  const s = pr ? pr.s : 1, e = pr ? pr.e : 0, n = absEp(it, pr);
  return 'T' + s + (sep || ' E') + e + (n > e ? ' · nº ' + n : '');
}
function step(it, pr, dir){
  const ss = it.seasons || [];
  let s = pr ? pr.s : 1, e = pr ? pr.e : 0;
  const len = (n) => (ss.find((x) => x.number === n) || { episodes:0 }).episodes;
  if (dir > 0){ e += 1; if (e > len(s)){ if (s >= ss.length) return 'end'; s += 1; e = 1; } }
  else { e -= 1; if (e < 0){ if (s <= 1) return { s:1, e:0 }; s -= 1; e = len(s); } }
  return { s:s, e:e };
}
function matches(it, uid_, f){

  if (f.provs.length && !it.providers.some((p) => f.provs.includes(p.name)) && !(f.avail && !it.providers.length)) return false;
  if (f.by.length && !f.by.includes(it.addedBy)) return false;
  if (f.genres && f.genres.length && !it.genres.some((g) => f.genres.includes(g))) return false;
  if (f.rateMin && !(it.score >= f.rateMin)) return false;

    const ok = (u) => { const p = it.participants[u]; return !!p && p.status === 'wish' && p.hype >= f.hypeMin; };

    else if (!ok(f.hypeUser) || it.participants[uid_].status !== 'wish') return false;
  }
  return true;
}

/* ── el fondo de «Cometa»: un shader y nada más ────────────────────────────────
   Es la misma idea que esos fondos de aurora que corren en la tarjeta gráfica,
   pero escrito a mano contra WebGL: sin three.js, sin CDN y sin tocar la CSP.
   Si el navegador no da WebGL, o el sistema pide menos animación, el lienzo no
   llega ni a encenderse y queda el degradado de debajo, que ya es un fondo.
   Se pausa solo cuando la pestaña no se ve: ahí no hay nada que animar.        */
const FX = { gl:null, prog:null, buf:null, u:{}, raf:0, t:0, roto:false, tinte:[1, .5, .8] };
const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const FS = [
  'precision highp float;',
  'uniform float iTime; uniform vec2 iRes; uniform vec3 iTint;',
  'float rand(vec2 n){ return fract(sin(dot(n, vec2(12.9898,4.1414)))*43758.5453); }',
  'float noise(vec2 p){ vec2 ip=floor(p); vec2 u=fract(p); u=u*u*(3.0-2.0*u);',
  '  float r=mix(mix(rand(ip),rand(ip+vec2(1.,0.)),u.x),mix(rand(ip+vec2(0.,1.)),rand(ip+vec2(1.,1.)),u.x),u.y); return r*r; }',
  'float fbm(vec2 x){ float v=0.0; float a=0.3; vec2 sh=vec2(100.0);',
  '  mat2 rot=mat2(cos(0.5),sin(0.5),-sin(0.5),cos(0.5));',
  '  for(int i=0;i<3;i++){ v+=a*noise(x); x=rot*x*2.0+sh; a*=0.4; } return v; }',
  'vec4 tanh4(vec4 x){ vec4 e=exp(-2.0*x); return (1.0-e)/(1.0+e); }',
  'void main(){',
  '  vec2 shake=vec2(sin(iTime*1.2)*0.005, cos(iTime*2.1)*0.005);',
  '  vec2 p=((gl_FragCoord.xy+shake*iRes)-iRes*0.5)/iRes.y*mat2(13.0,-8.5,8.5,13.0);',
  '  vec4 o=vec4(0.0);',
  '  float f=2.0+fbm(p+vec2(iTime*5.0,0.0))*0.5;',
  '  for(int k=0;k<26;k++){ float i=float(k);',
  '    vec2 v=p+cos(i*i+(iTime+p.x*0.08)*0.025+i*vec2(13.0,11.0))*3.5',
  '      +vec2(sin(iTime*3.0+i)*0.003, cos(iTime*3.5-i)*0.003);',
  '    float tail=fbm(v+vec2(iTime*0.5,i))*0.3*(1.0-(i/26.0));',
  /* el color base sale del acento de la sección: el fondo va a juego con la
     pantalla en la que estás, igual que en los demás temas */
  '    float wob=0.55+0.45*sin(i*0.27+iTime*0.45);',
  '    vec3 base=iTint*wob;',
  '    vec3 sec=vec3(iTint.b, iTint.r, iTint.g);',
  '    vec4 col=vec4(mix(base, sec*wob, 0.22), 1.0);',
  '    vec4 c=col*exp(sin(i*i+iTime*0.8)*0.72)/length(max(v, vec2(v.x*f*0.03, v.y*2.4)));',
  '    float thin=smoothstep(0.0,1.0,i/26.0)*0.6;',
  '    o+=c*(1.0+tail*0.8)*thin; }',
  '  o=tanh4(pow(o/26.0, vec4(1.25)));',
  '  gl_FragColor=vec4(o.rgb*1.1, 1.0); }',
].join('\n');

function fxCompilar(gl, tipo, src){
  const s = gl.createShader(tipo);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) return null;
  return s;
}
function fxArrancar(){
  if (FX.gl || FX.roto) return !!FX.gl;
  const cv = document.getElementById('fx');
  let gl = null;
  try { gl = cv.getContext('webgl', { alpha:true, antialias:false, depth:false, powerPreference:'low-power' })
    || cv.getContext('experimental-webgl'); } catch(e){}
  if (!gl){ FX.roto = true; return false; }
  const vs = fxCompilar(gl, gl.VERTEX_SHADER, VS), fs = fxCompilar(gl, gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs){ FX.roto = true; return false; }
  const pr = gl.createProgram();
  gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)){ FX.roto = true; return false; }
  gl.useProgram(pr);
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  FX.gl = gl; FX.prog = pr; FX.buf = b;
  FX.u = { t:gl.getUniformLocation(pr, 'iTime'), r:gl.getUniformLocation(pr, 'iRes'), c:gl.getUniformLocation(pr, 'iTint') };
  fxMedir();
  return true;
}
function fxMedir(){
  if (!FX.gl) return;
  const cv = document.getElementById('fx');
  /* medio píxel por píxel: esto es fondo, no hace falta que sea nítido, y así
     un móvil modesto no se pone a calentar */
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5) * 0.7;
  const w = Math.max(2, Math.round(window.innerWidth * dpr)), hh = Math.max(2, Math.round(window.innerHeight * dpr));
  if (cv.width === w && cv.height === hh) return;
  cv.width = w; cv.height = hh;
  FX.gl.viewport(0, 0, w, hh);
  FX.gl.uniform2f(FX.u.r, w, hh);
}
function fxTinte(){
  const el = document.getElementById('fxtint');
  if (!el) return FX.tinte;
  const m = getComputedStyle(el).color.match(/[\d.]+/g);
  if (!m) return FX.tinte;
  return [Math.max(.25, +m[0] / 255), Math.max(.25, +m[1] / 255), Math.max(.25, +m[2] / 255)];
}
function fxLatido(){
  FX.raf = 0;
  if (!FX.gl) return;
  /* medio ritmo: al alejar el plano los cometas se hicieron pequeños y cruzaban
     su propio tamaño el doble de rápido, así que corría más de lo que parecía */
  FX.t += 0.0072;
  fxMedir();
  FX.gl.uniform1f(FX.u.t, FX.t);
  FX.gl.uniform3fv(FX.u.c, FX.tinte);
  FX.gl.drawArrays(FX.gl.TRIANGLES, 0, 3);
  if (S.theme === 'cometa' && !document.hidden) FX.raf = requestAnimationFrame(fxLatido);
}
/* lo llama el pintado: enciende, apaga y actualiza el color de la sección */
function fxSync(){
  const quiere = S.theme === 'cometa'
    && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches);
  if (!quiere){
    if (FX.raf){ cancelAnimationFrame(FX.raf); FX.raf = 0; }
    return;
  }
  if (!fxArrancar()) return;
  FX.tinte = fxTinte();
  if (!FX.raf && !document.hidden) FX.raf = requestAnimationFrame(fxLatido);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) fxSync(); });
window.addEventListener('resize', fxMedir);

/* segunda barrera: aunque la ruta ya venga saneada, la URL final se valida otra
   vez antes de entrar en un atributo style, y se escapa. */
const bgImg = (url) => {
  const s = String(url || '');
  if (!/^https:\/\/image\.tmdb\.org\/t\/p\/[A-Za-z0-9]+\/[A-Za-z0-9._-]+$/.test(s)
   && !/^data:image\/svg\+xml,[A-Za-z0-9%._~()'!*:@,;+$-]*$/.test(s)) return '';
  return 'background-image:url(&quot;' + esc(s) + '&quot;)';
};

/* ── una tarjeta ── */
function cardHtml(it, status, order, users){
  const c = COL(status).v;
  const key = it.id + '|' + status + '|' + order;
  const isDrag = S.drag && S.drag.key === key;
  const fi = ['wish','watching','done'].indexOf(status);
  const nxt = COL(['wish','watching','done'][clamp(fi + 1, 0, 2)]);
  const prv = COL(['wish','watching','done'][clamp(fi - 1, 0, 2)]);
  /* «in» sólo si la tarjeta no estaba en el repintado anterior. Antes lo llevaban
     todas siempre, así que cualquier repintado las desvanecía y las traía de
     vuelta a la vez: ese era el parpadeo. */
  const anim = S.anim[key] || S.anim[it.id + '|' + status] || (vistas[key] ? '' : 'in');
  const me = meId();
  const orig = it.originalTitle && norm(it.originalTitle) !== norm(it.title) ? it.originalTitle : null;
  const meta = ic(it.type === 'tv' ? 'tv' : 'film', 13, 'currentColor')
    + '<span>' + (it.year || '') + (it.totalEpisodes ? ' · ' + it.totalEpisodes + ' ep.' : (it.runtime ? ' · ' + it.runtime + ' min' : '')) + '</span>'
    + (it.score ? '<span title="nota de TMDB" style="display:flex;align-items:center;gap:3px;font-weight:800;color:var(--text-dim)">★ ' + nfmt(it.score) + '</span>' : '')
    + (it.providers.length ? '<span style="display:flex;gap:4px">' + it.providers.slice(0, 3).map((p) =>
        '<i class="provlogo" style="width:18px;height:18px;border-radius:5px;' + bgImg(Api.imageUrl(p.logo, 'sm')) + '" title="' + esc(p.name) + '"></i>').join('') + '</span>' : '');
  const ini = it.title.replace(/^(el|la|los|las)\s+/i, '').slice(0, 2).toUpperCase();
  const poster = it.poster ? Api.imageUrl(it.poster, 'sm') : null;

  let body = '';
  let extraCls = '';

  if (status === 'wish'){
    const hy = users.map((u) => it.participants[u].hype);
    const avg = hy.reduce((a, b) => a + b, 0) / hy.length;
    const mine = it.participants[me];
  /* ir juntos = misma columna, mismo grupo y mismo episodio. Compartir grupo
     yendo por capítulos distintos no es ver algo juntos. */
  const mismaFila = (a, b) => !!a && !!b && a.status === b.status && a.order === b.order
    && ((!a.progress && !b.progress) || (!!a.progress && !!b.progress && a.progress.s === b.progress.s && a.progress.e === b.progress.e));
    if (avg >= 4.5 && users.length > 2) extraCls = ' glow';
    /* aquí sólo se mira: los corazones se cambian en el detalle, así que la
       tarjeta se queda en una línea fina en vez de dos filas de 44 px */
    body += '<div class="crow" style="margin-top:8px;gap:7px">'
      + '<div class="hype' + (avg >= 4 && users.length > 1 ? ' hot' : '') + '" style="padding:0;background:none">'
      + '<div style="display:flex;gap:3px">'
      + [1,2,3,4,5].map((n) => '<span class="hdot' + (n <= Math.round(avg) ? ' on' : '') + '"></span>').join('')
      + '</div></div>'
      + '<span style="font-size:11px;color:var(--text-dim);font-weight:700">'
      + (hy.length > 1
          ? 'ganas de ' + hy.length + ' personas' + (mine && mine.status === 'wish' ? ' · las tuyas ' + mine.hype : '')
          : 'ganas')
      + '</span>'
      + '</div>';
  } else if (status === 'watching'){
    if (it.type === 'movie'){
      body += '<button class="seen" data-a="seen">' + ic('check', 18, 'var(--ink)') + 'ya la hemos visto</button>';
    } else {
      const byProg = {};
      users.forEach((u) => { const p = it.participants[u];
        const k = p.order + '@' + (p.progress ? p.progress.s + '-' + p.progress.e : '0'); (byProg[k] = byProg[k] || []).push(u); });
      const keys = Object.keys(byProg);
      const total = it.totalEpisodes || 1;
      const mk = (us) => { const p = it.participants[us[0]]; const n = absEp(it, p.progress);
        return { label:'T' + (p.progress ? p.progress.s : 1) + ' · E' + (p.progress ? p.progress.e : 0),
          counter:'nº ' + n + '/' + total, pct:Math.round((n / total) * 100) }; };
      if (keys.length === 1){
        const r = mk(users);
        body += '<div class="epline"><div style="flex:1;min-width:0">'
          + '<div style="display:flex;align-items:baseline;gap:8px"><span class="epmark">' + r.label + '</span><span class="epcount">' + r.counter + '</span></div>'
          + '<div class="bar"><i style="width:' + r.pct + '%"></i></div></div>'
          + '<div style="display:flex;gap:6px;flex:none">'
          + '<button class="r44 minus" data-a="minus" aria-label="Episodio anterior">−</button>'
          + '<button class="r44 plus" data-a="plus" aria-label="Siguiente episodio">+</button></div></div>';
      } else if (keys.length > 3){
        body += '<button class="wide" data-a="open"><span>' + keys.length + ' ritmos distintos</span><span style="opacity:.7">›</span></button>';
      } else {
        body += '<div class="rows">' + keys.sort((a, b) => byProg[b].length - byProg[a].length).map((k) => {
          const us = byProg[k], uu = user(us[0]), r = mk(us), isMe = us.includes(me);
          return '<div class="prow">'
            + '<span class="stack" style="flex:none">'
              + us.slice(0, 3).map((x) => '<span class="av" style="--c:' + user(x).color + '" title="' + esc(user(x).name) + '">' + user(x).emoji + '</span>').join('')
              + (us.length > 3 ? '<span class="more">+' + (us.length - 3) + '</span>' : '')
            + '</span>'
            + '<div style="flex:1;min-width:0"><div style="display:flex;align-items:baseline;gap:7px"><b>' + r.label + '</b><em>' + r.counter + '</em></div>'
            + '<div class="bar sm" style="--c:' + soft(uu.color, 90) + '"><i style="width:' + r.pct + '%"></i></div></div>'
            + (isMe
              ? '<div style="display:flex;gap:5px;flex:none">'
                + '<button class="r44 minus" data-a="rminus:' + us.join(',') + '" aria-label="Episodio anterior">−</button>'
                + '<button class="r44 plus" data-a="rplus:' + us.join(',') + '" aria-label="Siguiente episodio">+</button></div>'
              : '<span style="flex:none;font-size:10.5px;font-weight:800;color:var(--text-dim);padding-right:6px">a su ritmo</span>')
            + '</div>';
        }).join('') + '</div>';
      }
    }
  } else {
    const rs = users.map((u) => ({ u:u, r:it.participants[u].rating })).filter((x) => x.r);
    if (rs.length){
      const avg = rs.reduce((a, x) => a + x.r, 0) / rs.length;
      const spread = Math.max.apply(null, rs.map((x) => x.r)) - Math.min.apply(null, rs.map((x) => x.r));
      body += '<div class="rated"><div style="display:flex;align-items:baseline;gap:3px">'
        + '<span class="ravg">' + nfmt(avg) + '</span><span style="font-size:12px;color:var(--text-dim);font-weight:700">/5</span></div>'
        + '<div style="flex:1;min-width:0"><div class="rstars">' + STARS(Math.round(avg)) + '</div>'
        + '<div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap">'
        + rs.map((x) => { const uu = user(x.u); return '<span class="rchip"><span class="av" style="--c:' + uu.color + '">' + uu.emoji + '</span>' + x.r + '</span>'; }).join('')
        + '</div></div></div>';
      if (spread > 2) body += '<div class="mood" style="--c:var(--wish)">aquí hubo debate 🥊</div>';
      else if (rs.length > 1 && spread === 0) body += '<div class="mood">todos igual, qué bonito 🫶</div>';
    } else {
      body += '<div class="rated"><div style="display:flex;align-items:baseline;gap:3px"><span class="ravg">–</span>'
        + '<span style="font-size:12px;color:var(--text-dim);font-weight:700">/5</span></div>'
        + '<div style="flex:1"><div class="rstars" style="color:var(--text-dim)">☆☆☆☆☆</div></div></div>'
        + '<div class="mood" style="color:var(--text-dim);background:#ffffff0d">sin puntuar todavía</div>';
    }
  }

  /* gente en otras columnas */
  const others = Object.keys(it.participants).filter((u) => !users.includes(u));
  const bits = [];
  others.slice(0, 2).forEach((u) => {
    const p = it.participants[u], uu = user(u);
    if (p.status === 'done') bits.push(uu.emoji + ' ya la vio' + (p.rating ? ' y le puso ' + STARS(p.rating).replace(/☆/g, '') : ''));
    else if (p.status === 'dropped') bits.push(uu.emoji + ' la dejó' + (p.progress ? ' en el ' + (absEp(it, p.progress) || p.progress.e) : ''));
    else if (p.status === 'watching') bits.push(uu.emoji + ' va por ' + (p.progress ? epTxt(it, p.progress, ' · E') : 'T1'));
    else bits.push(uu.emoji + ' la quiere ver');
  });
  if (bits.length) body += '<div class="elsew"><span style="opacity:.6;flex:none">⤵</span><span class="pretty">'
    + esc(bits.join(' · ') + (others.length > 2 ? ' · +' + (others.length - 2) : '')) + '</span></div>';

  const showProp = !users.includes(it.addedBy) || users.length > 1;
  return '<div class="cw">'
    + '<div class="swipe" data-swipe><span>' + ic(prv.icon, 26, prv.v) + '</span><span>' + ic(nxt.icon, 26, nxt.v) + '</span></div>'
    + '<div class="card' + extraCls + (isDrag ? ' ghost' : '') + '" data-card="' + key + '"'
    + (anim ? ' data-anim="' + anim + '"' : '')
    + ' style="--c:' + c + '">'
    + '<div class="ctop">'
    + (poster ? '<div class="post" role="img" aria-label="' + esc(it.title) + '" style="' + bgImg(poster) + '"></div>'
              : '<div class="post ink">' + esc(ini) + '</div>')
    + '<div style="flex:1;min-width:0">'
    + '<div class="ctitle">' + esc(it.title) + '</div>'
    + (orig ? '<div class="corig">' + esc(orig) + '</div>' : '')
    + '<div class="cmeta" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' + meta + '</div>'
    + '<div class="crow"><div class="stack">'
    + users.slice(0, 4).map((u) => '<span class="av" style="--c:' + user(u).color + '" title="' + esc(user(u).name) + '">' + user(u).emoji + '</span>').join('')
    + (users.length > 4 ? '<span class="more">+' + (users.length - 4) + '</span>' : '')
    + '</div>'
    + (showProp ? '<span class="prop"><span style="opacity:.5">·</span>' + user(it.addedBy).emoji + ' lo propuso</span>' : '')
    + (it.notes.length ? '<span class="ncount">' + ic('note', 13, 'currentColor') + it.notes.length + '</span>' : '')
    + '</div></div></div>'
    + body
    + '</div></div>';
}

/* La tarjeta es del título, no del grupo. Antes cada grupo pintaba la suya, así
   que «seguir yo solo» hacía aparecer una segunda tarjeta del mismo título y
   parecía que se hubiera duplicado; ahora eso es una fila más dentro de la
   misma. El «orden» que identifica la tarjeta es el tuyo si estás dentro, y si
   no el del grupo que va más adelantado. */
function buildCards(status){
  const out = [];
  const me = meId();
  S.data.items.forEach((it) => {
    const pend = S.pendingDel === it.id;
    const us = [];
    let ord = -1;
    Object.keys(it.participants).forEach((u) => {
      if (pend && u === me) return;
      const p = it.participants[u];
      if (p.status !== status) return;
      if (!matches(it, u, S.f)) return;
      us.push(u);
      if (p.order > ord) ord = p.order;
    });
    if (!us.length) return;
    const mine = it.participants[me];
  /* ir juntos = misma columna, mismo grupo y mismo episodio. Compartir grupo
     yendo por capítulos distintos no es ver algo juntos. */
  const mismaFila = (a, b) => !!a && !!b && a.status === b.status && a.order === b.order
    && ((!a.progress && !b.progress) || (!!a.progress && !!b.progress && a.progress.s === b.progress.s && a.progress.e === b.progress.e));
    const order = (mine && mine.status === status && us.indexOf(me) >= 0) ? mine.order : ord;
    out.push({ it:it, order:order, users:us });
  });
  return out.sort((a, b) => b.order - a.order);
}
function syncLabel(corto){
  const s = S.sync;
  if (S.booting) return 'preparando el sofá…';
  if (Api.authFailed()) return 'la clave no vale · toca aquí';
  if (s.state === 'saving') return 'guardando…';
  if (s.state === 'offline') return 'sin conexión · ' + s.pending + ' cambio' + (s.pending === 1 ? '' : 's') + ' por subir';
  if (s.state === 'error') return 'algo falló al guardar · toca aquí';
  const n = S.data ? S.data.users.length : 0;
  /* con el chip del club al lado no cabe todo: el recuento se cae, que además
     lo dice el estante. Lo que nunca se cae es el estado. */
  if (corto) return 'todo al día';
  return n + (n === 1 ? ' persona' : ' personas') + ' · todo al día';
}
function syncColor(){
  const s = S.sync.state;
  return s === 'saving' ? 'var(--wish)' : s === 'offline' ? 'var(--dropped)' : s === 'error' ? 'var(--bad)' : 'var(--done)';
}
function activeChips(){
  const f = S.f, out = [];
  const add = (a, label, c) => out.push({ a:a, label:label, c:c });
  if (S.q) add('rm:q', '🔍 «' + S.q + '»', 'var(--text)');
  if (f.type) add('rm:type', f.type === 'tv' ? '📺 series' : '🎬 pelis', 'var(--watching)');
  if (f.who.length === 1 && f.who[0] === meId()) add('rm:who:' + meId(), '👤 solo lo mío', 'var(--wish)');
  else f.who.forEach((u) => add('rm:who:' + u, user(u).emoji + ' ' + user(u).name, user(u).color));
  if (f.avail) add('rm:avail', '📡 con los que no tienen plataforma', 'var(--done)');
  f.provs.forEach((p) => add('rm:prov:' + p, p, 'var(--done)'));
  if (f.hypeUser) add('rm:hype', '💗'.repeat(f.hypeMin) + (f.hypeUser === 'any' ? ' de quien sea' : ' de ' + user(f.hypeUser).name), 'var(--wish)');
  f.by.forEach((u) => add('rm:by:' + u, 'lo propuso ' + user(u).emoji, user(u).color));
  (f.genres || []).forEach((g) => add('rm:gen:' + g, g, 'var(--dropped)'));
  if (f.rateMin) add('rm:rate', '★ ' + nfmt(f.rateMin) + ' o más en TMDB', 'var(--done)');
  return out;
}

function navHtml(){

  const v = S.isMobile ? S.view : (kind === 'roulette' ? 'roulette' : kind === 'add' ? 'add'
    : kind === 'stats' ? 'stats' : (kind === 'settings' || kind === 'clubs') ? 'settings' : 'board');
  const items = [
    { to:'board', icon:'board', c:'var(--watching)', label:'Tablero', on: v === 'board' },
    { to:'roulette', icon:'dice', c:'var(--wish)', label:'Ruleta', on: v === 'roulette' },
    { to:'add', icon:'plus', c:'var(--watching)', label:'Añadir', on: v === 'add', pri:true, aria:'Añadir un título nuevo al tablero' },
    { to:'stats', icon:'chart', c:'var(--done)', label:'Datos', on: v === 'stats' },
    { to:'settings', icon:'sliders', c:'var(--dropped)', label:'Ajustes', on: v === 'settings' },
  ];
  /* cada sección lleva su color en el icono aunque no esté puesta: la barra se
     lee de un vistazo y lo activo se distingue porque el texto también se tiñe */
  return '<nav class="mob" aria-label="Secciones">' + items.map((i) =>
    '<button class="' + (i.pri ? 'pri' + (i.on ? ' on' : '') : (i.on ? 'on' : '')) + '" data-a="nav:' + i.to + '" aria-label="' + esc(i.aria || i.label)
    + '" aria-current="' + (i.on ? 'page' : 'false') + '" style="--nc:' + i.c + ';color:' + (i.on || i.pri ? i.c : 'var(--text-dim)') + '">'
    + ic(i.icon, i.pri ? 25 : 20, i.c) + '<b>' + i.label + '</b></button>').join('') + '</nav>';
}

function floatHtml(){
  let h = '';
  if (S.drag){
    const d = S.drag;
    h += '<div class="ghostcard" data-ghost style="--c:' + d.c + ';width:' + d.w + 'px;translate:' + d.x + 'px ' + d.y + 'px">'
      + '<div style="display:flex;gap:12px;align-items:center">'
      + '<div style="width:44px;height:66px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:' + soft(d.c, 20) + ';color:' + d.c + '">' + esc(d.ini) + '</div>'

      + '<div style="font-size:12px;color:var(--text-dim);font-weight:700">' + esc(d.who) + '</div></div></div></div>';
  }
  if (S.dock){
    h += '<div class="dock"><p>suelta en la columna que quieras</p><div>'
      + COLS.map((c) => '<div class="dockt" data-dockt="' + c.key + '" style="--c:' + c.v + '">'
          + '<i>' + ic(c.icon, 24, 'currentColor') + '</i><b>' + c.label + '</b></div>').join('')
